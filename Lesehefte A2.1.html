scenes:[
{id:'kalender',title:'Der Kalender',en:'The calendar',focus:'Monate · Wochentage · Datum',
 story:['Ein Jahr hat zwölf Monate, zweiundfünfzig Wochen und vier Jahreszeiten.|A year has twelve months, fifty-two weeks and four seasons.','Eine Woche hat sieben Tage: fünf Arbeitstage und das Wochenende.|A week has seven days: five working days and the weekend.','Tippe auf die Monate, die Tage und die Jahreszeiten!|Tap the months, the days and the seasons!'],
 hs:{
 _bg:['der Kalender|the calendar','die Kalender','Im Kalender stehen die Tage, die Wochen und die Monate.|The days, weeks and months are in the calendar.','sie: Ich schreibe den Termin in meinen Kalender.|I’ll write the appointment in my calendar.','In Deutschland beginnt die Woche im Kalender mit dem Montag, nicht mit dem Sonntag.|In Germany the calendar week starts on Monday, not Sunday.'],
 jahr:['das Jahr|the year','die Jahre','Ein Jahr hat zwölf Monate und vier Jahreszeiten.|A year has twelve months and four seasons.','er: Wie alt bist du?|How old are you? // kind: Ich bin acht Jahre alt.|I am eight years old.','Ein Jahr hat dreihundertfünfundsechzig Tage. Ein Schaltjahr hat dreihundertsechsundsechzig.|A year has 365 days. A leap year has 366.'],
 winter:['der Winter|winter','die Winter','Der Winter: Dezember, Januar und Februar.|Winter: December, January and February.','er: Brr, ist das kalt!|Brr, it’s cold!','Im Winter wird es schon um halb fünf dunkel.|In winter it gets dark at half past four.'],
 fruehling:['der Frühling|spring','die Frühlinge','Der Frühling: März, April und Mai.|Spring: March, April and May.','sie: Endlich ist der Frühling da!|Spring is finally here!','Im Frühling werden die Tage länger und wärmer.|In spring the days get longer and warmer.'],
 sommer:['der Sommer|summer','die Sommer','Der Sommer: Juni, Juli und August.|Summer: June, July and August.','kind: Ich liebe den Sommer!|I love summer!','Im Sommer kann es in Deutschland über dreißig Grad heiß werden.|In summer it can get hotter than thirty degrees in Germany.'],
 herbst:['der Herbst|autumn','die Herbste','Der Herbst: September, Oktober und November.|Autumn: September, October and November.','sie: Es wird kühler. Zieh eine Jacke an!|It’s getting cooler. Put on a jacket!','Ende Oktober stellt man die Uhr eine Stunde zurück. Dann ist Winterzeit.|At the end of October the clocks go back an hour.'],
 januar:['der Januar|January','','Der Januar ist der erste Monat. Er hat einunddreißig Tage.|January is the first month. It has thirty-one days.','sie: Frohes neues Jahr!|Happy New Year!','Im Januar ist es oft kalt, manchmal unter null Grad.|In January it is often cold, sometimes below zero.'],
 februar:['der Februar|February','','Der Februar ist der kürzeste Monat. Er hat achtundzwanzig Tage, im Schaltjahr neunundzwanzig.|February is the shortest month. It has 28 days, 29 in a leap year.','er: Helau! Alaaf! Im Februar ist oft Karneval.|Helau! Alaaf! Carnival is often in February.','Karneval, Fasching oder Fastnacht: Das Fest hat in jeder Region einen anderen Namen.|Carnival has a different name in each region.'],
 maerz:['der März|March','','Der März ist der dritte Monat. Im März beginnt der Frühling.|March is the third month. Spring starts in March.','sie: Endlich wird es wärmer!|At last it’s getting warmer!','Am letzten Sonntag im März stellt man die Uhr eine Stunde vor. Dann beginnt die Sommerzeit.|On the last Sunday in March the clocks go forward an hour.'],
 april:['der April|April','','Im April ist das Wetter oft wechselhaft: Sonne, Regen und manchmal Schnee.|In April the weather is changeable: sun, rain and sometimes snow.','er: April, April, der macht, was er will!|April, April, does whatever it wants!','Am ersten April macht man Witze. Dann ruft man: April, April!|On the first of April people play jokes and shout: April fool!'],
 mai:['der Mai|May','','Im Mai blühen viele Blumen und Bäume.|In May many flowers and trees blossom.','sie: Der erste Mai ist ein Feiertag. Wir haben frei!|The first of May is a holiday. We have the day off!','Der erste Mai ist der Tag der Arbeit. Viele Leute machen einen Ausflug.|The first of May is Labour Day. Many people go on an outing.'],
 juni:['der Juni|June','','Im Juni beginnt der Sommer. Die Tage sind sehr lang.|Summer starts in June. The days are very long.','kind: Es ist schon zehn Uhr abends und noch hell!|It’s already ten in the evening and still light!','Um den einundzwanzigsten Juni ist der längste Tag des Jahres.|Around the twenty-first of June is the longest day of the year.'],
 juli:['der Juli|July','','Im Juli ist es oft heiß. Viele Kinder haben Sommerferien.|In July it is often hot. Many children have summer holidays.','sie: Schöne Ferien!|Have a nice holiday!','Die Sommerferien sind in jedem Bundesland zu einer anderen Zeit.|Summer holidays are at a different time in each federal state.'],
 august:['der August|August','','Der August ist der achte Monat. Viele Leute machen Urlaub.|August is the eighth month. Many people go on holiday.','er: Wohin fahrt ihr in den Urlaub?|Where are you going on holiday?','Viele Deutsche fahren im Urlaub ans Meer, in die Berge oder nach Italien und Spanien.|Many Germans go to the sea, the mountains or to Italy and Spain on holiday.'],
 september:['der September|September','','Im September beginnt der Herbst. Die Schule fängt wieder an.|Autumn starts in September. School starts again.','sie: Viel Glück am ersten Schultag!|Good luck on your first day of school!','Am ersten Schultag bekommen Kinder in Deutschland eine Schultüte mit Süßigkeiten.|On their first school day children in Germany get a cone full of sweets.'],
 oktober:['der Oktober|October','','Im Oktober werden die Blätter bunt.|In October the leaves turn colourful.','er: Der dritte Oktober ist ein Feiertag.|The third of October is a public holiday.','Am dritten Oktober feiert Deutschland die Wiedervereinigung von neunzehnhundertneunzig.|On the third of October Germany celebrates reunification in 1990.'],
 november:['der November|November','','Der November ist oft grau, nass und neblig.|November is often grey, wet and foggy.','kind: Ich gehe mit meiner Laterne!|I’m going with my lantern!','Am elften November ist Sankt Martin. Kinder gehen mit Laternen durch die Straßen und singen.|On the eleventh of November it’s St Martin’s Day. Children walk with lanterns and sing.'],
 dezember:['der Dezember|December','','Der Dezember ist der letzte Monat. Er hat einunddreißig Tage.|December is the last month. It has thirty-one days.','sie: Frohe Weihnachten!|Merry Christmas!','Am vierundzwanzigsten Dezember ist Heiligabend. Dann gibt es Geschenke.|The twenty-fourth of December is Christmas Eve. That’s when there are presents.'],
 montag:['der Montag|Monday','die Montage','Der Montag ist der erste Tag der Woche.|Monday is the first day of the week.','er: Am Montag fängt die Arbeit wieder an.|On Monday work starts again.','am Montag heißt „an dem Montag“. Bei Tagen benutzt man immer „am“.|With days you always use "am".'],
 dienstag:['der Dienstag|Tuesday','die Dienstage','Der Dienstag ist der zweite Tag der Woche.|Tuesday is the second day of the week.','sie: Hast du am Dienstag Zeit?|Are you free on Tuesday?','dienstags heißt: jeden Dienstag. Ich habe dienstags Deutschkurs.|dienstags means every Tuesday.'],
 mittwoch:['der Mittwoch|Wednesday','die Mittwoche','Der Mittwoch ist in der Mitte der Woche.|Wednesday is in the middle of the week.','er: Mittwoch! Die halbe Woche ist geschafft.|Wednesday! Half the week is done.','Mittwoch kommt von „Mitte der Woche“.|Mittwoch comes from "middle of the week".'],
 donnerstag:['der Donnerstag|Thursday','die Donnerstage','Der Donnerstag ist der vierte Tag der Woche.|Thursday is the fourth day of the week.','sie: Am Donnerstag habe ich einen Termin beim Arzt.|On Thursday I have a doctor’s appointment.','Donnerstag kommt von Donar, dem alten Gott des Donners.|Thursday comes from Donar, the old god of thunder.'],
 freitag:['der Freitag|Friday','die Freitage','Am Freitag ist die Arbeitswoche fast vorbei.|On Friday the working week is almost over.','er: Endlich Freitag! Schönes Wochenende!|Finally Friday! Have a nice weekend!','Am Freitagabend gehen viele Leute aus: ins Kino, ins Restaurant oder zu Freunden.|On Friday evening many people go out.'],
 samstag:['der Samstag|Saturday','die Samstage','Am Samstag sind die Geschäfte offen.|On Saturday the shops are open.','sie: Am Samstag gehe ich einkaufen.|On Saturday I go shopping.','Im Norden sagt man oft Sonnabend, im Süden Samstag.|In the north people often say Sonnabend, in the south Samstag.'],
 sonntag:['der Sonntag|Sunday','die Sonntage','Am Sonntag haben die meisten Leute frei.|On Sunday most people have the day off.','er: Was machst du am Sonntag?|What are you doing on Sunday?','Am Sonntag sind fast alle Geschäfte zu. Bäckereien sind oft am Morgen offen.|On Sunday almost all shops are closed. Bakeries are often open in the morning.'],
 wochenende:['das Wochenende|the weekend','die Wochenenden','Samstag und Sonntag sind das Wochenende.|Saturday and Sunday are the weekend.','sie: Schönes Wochenende!|Have a nice weekend!','Am Freitag sagt man zum Abschied oft: Schönes Wochenende!|On Friday people often say goodbye with: Have a nice weekend!'],
 feiertag:['der Feiertag|the public holiday','die Feiertage','Der dritte Oktober ist ein Feiertag.|The third of October is a public holiday.','er: Morgen ist Feiertag. Ich muss nicht arbeiten!|Tomorrow is a holiday. I don’t have to work!','An Feiertagen sind die Geschäfte und Ämter geschlossen.|On public holidays shops and offices are closed.'],
 geburtstag:['der Geburtstag|the birthday','die Geburtstage','Der Kuchen ist für einen Geburtstag.|The cake is for a birthday.',['sie: Alles Gute zum Geburtstag!|Happy birthday!','er: Wann hast du Geburtstag?|When is your birthday? // sie: Am zwölften Mai.|On the twelfth of May.'],['Ordinalzahlen: am ersten, am zweiten, am dritten, am zwölften Mai.|Ordinal numbers for dates: on the first, second, third, twelfth of May.','In Deutschland gratuliert man nicht vor dem Geburtstag. Das bringt Unglück.|In Germany you don’t congratulate someone before their birthday. It brings bad luck.']],
 },
 groups:[['Finde die drei Wintermonate!|Find the three winter months!','dezember januar februar'],['Finde die drei Sommermonate!|Find the three summer months!','juni juli august'],['Finde die zwei Tage vom Wochenende!|Find the two weekend days!','samstag sonntag'],['Finde die drei Frühlingsmonate!|Find the three spring months!','maerz april mai'],['Finde die drei Herbstmonate!|Find the three autumn months!','september oktober november'],['Finde die drei Monate mit J!|Find the three months with J!','januar juni juli']],
 tf:[['Ein Jahr hat zwölf Monate.|A year has twelve months.',1,'jahr'],['Der Februar hat einunddreißig Tage.|February has thirty-one days.',0,'februar','Nein. Der Februar hat achtundzwanzig oder neunundzwanzig Tage.|No. February has twenty-eight or twenty-nine days.'],['Nach dem Dienstag kommt der Mittwoch.|After Tuesday comes Wednesday.',1,'mittwoch'],['Der Juli ist ein Wintermonat.|July is a winter month.',0,'juli','Nein. Der Juli ist ein Sommermonat.|No. July is a summer month.'],['Der dritte Oktober ist ein Feiertag in Deutschland.|The third of October is a public holiday in Germany.',1,'feiertag'],['Die Woche hat acht Tage.|The week has eight days.',0,'','Nein. Die Woche hat sieben Tage.|No. The week has seven days.'],['Der Frühling beginnt im März.|Spring starts in March.',1,'fruehling']],
 hoer:[['Dieser Monat kommt nach dem April und vor dem Juni.|This month comes after April and before June.','mai'],['An diesem Tag sagt man: Alles Gute! Es gibt Kuchen mit Kerzen.|On this day people say: All the best! There is cake with candles.','geburtstag'],['Diese Jahreszeit ist kalt. Oft liegt Schnee.|This season is cold. There is often snow.','winter'],['Das ist der erste Tag der Woche. Viele Leute fangen wieder an zu arbeiten.|This is the first day of the week. Many people start work again.','montag'],['In diesem Monat ist Weihnachten. Es ist der letzte Monat im Jahr.|Christmas is in this month. It is the last month of the year.','dezember'],['Dieser Tag ist zwischen Mittwoch und Freitag.|This day is between Wednesday and Friday.','donnerstag'],['In diesem Monat fängt die Schule wieder an, und der Herbst kommt.|In this month school starts again and autumn comes.','september']]},

{id:'fruehling',title:'Im Frühling',en:'In spring',focus:'Wetter · Natur · Ostern',
 story:['Im Frühling wird es wärmer. Die Tage werden länger.|In spring it gets warmer. The days get longer.','Die Bäume blühen, die Vögel bauen Nester, und im Garten wachsen Blumen.|The trees blossom, birds build nests and flowers grow in the garden.','Das Wetter wechselt oft: Sonne, Regen und manchmal ein Regenbogen.|The weather changes often: sun, rain and sometimes a rainbow.'],
 hs:{
 _bg:['der Garten|the garden','die Gärten','Im Garten wachsen Blumen, Obst und Gemüse.|Flowers, fruit and vegetables grow in the garden.','sie: Im Frühling arbeite ich gern im Garten.|In spring I like working in the garden.','In der Stadt mieten viele Leute einen kleinen Garten. Er heißt Schrebergarten.|In the city many people rent a small garden plot called a Schrebergarten.'],
 sonne:['die Sonne|the sun','','Die Sonne scheint schon wärmer.|The sun is already warmer.','er: Heute ist es schön warm. Endlich keine dicke Jacke mehr!|It’s nice and warm today. Finally no more thick jacket!','Im Frühling steht die Sonne jeden Tag ein bisschen höher.|In spring the sun climbs a little higher every day.'],
 regen:['der Regen|the rain','','Aus der Wolke kommt Regen.|Rain is coming out of the cloud.','er: Es regnet schon wieder! Gut, dass ich einen Regenschirm habe.|It’s raining again! Good thing I have an umbrella.','Beim Wetter benutzt man „es“: Es regnet, es schneit, es donnert.|For weather you use "es": it rains, it snows, it thunders.'],
 regenbogen:['der Regenbogen|the rainbow','die Regenbögen','Der Regenbogen hat sieben Farben.|The rainbow has seven colours.','kind: Schau mal, ein Regenbogen! Wie schön!|Look, a rainbow! How beautiful!','Einen Regenbogen sieht man, wenn die Sonne scheint und es gleichzeitig regnet.|You see a rainbow when the sun shines and it rains at the same time.'],
 baum:['der Kirschbaum|the cherry tree','die Kirschbäume','Der Kirschbaum blüht rosa und weiß.|The cherry tree blossoms pink and white.','sie: Riech mal! Die Blüten duften so gut.|Smell that! The blossoms smell so good.','Aus den Blüten werden im Sommer Kirschen.|In summer the blossoms turn into cherries.'],
 nest:['das Nest|the nest','die Nester','Im Nest liegen zwei blaue Eier.|There are two blue eggs in the nest.','kind: Bald schlüpfen die Vogelbabys!|Soon the baby birds will hatch!','Vögel bauen ihre Nester im Frühling aus kleinen Ästen und Gras.|Birds build their nests in spring from little twigs and grass.'],
 vogel:['der Vogel|the bird','die Vögel','Der Vogel fliegt zum Nest.|The bird flies to the nest.','kind: Hör mal, der Vogel singt!|Listen, the bird is singing!','Viele Vögel fliegen im Herbst in den Süden und kommen im Frühling zurück.|Many birds fly south in autumn and come back in spring.'],
 tulpen:['die Tulpe|the tulip','die Tulpen','Die Tulpen sind rot, gelb und lila.|The tulips are red, yellow and purple.','sie: Ich kaufe einen Strauß Tulpen für meine Mutter.|I’ll buy a bunch of tulips for my mother.','Tulpen sind typische Frühlingsblumen. Viele kommen aus den Niederlanden.|Tulips are typical spring flowers. Many come from the Netherlands.'],
 biene:['die Biene|the bee','die Bienen','Die Biene sammelt Nektar von den Blumen.|The bee collects nectar from the flowers.','kind: Hilfe, eine Biene!|Help, a bee! // sie: Keine Angst, sie tut dir nichts.|Don’t be afraid, it won’t hurt you.','Bienen machen Honig. Ohne Bienen gibt es auch weniger Obst.|Bees make honey. Without bees there is also less fruit.'],
 schmetterling:['der Schmetterling|the butterfly','die Schmetterlinge','Der Schmetterling hat bunte Flügel.|The butterfly has colourful wings.','kind: Der Schmetterling fliegt von Blume zu Blume.|The butterfly flies from flower to flower.','Ein Schmetterling war zuerst eine Raupe.|A butterfly was a caterpillar first.'],
 ostereier:['das Osterei|the Easter egg','die Ostereier','Die Ostereier sind bunt bemalt.|The Easter eggs are painted in bright colours.','kind: Ich habe drei Ostereier gefunden!|I’ve found three Easter eggs!','Zu Ostern bemalt man Eier und versteckt sie im Garten. Die Kinder suchen sie.|At Easter people paint eggs and hide them in the garden. The children look for them.'],
 osterhase:['der Osterhase|the Easter bunny','die Osterhasen','Der Osterhase bringt die Eier.|The Easter bunny brings the eggs.','sie: Frohe Ostern!|Happy Easter!','Ostern ist im März oder im April. Das Datum ist jedes Jahr anders.|Easter is in March or April. The date is different every year.'],
 nachbar:['der Nachbar|the neighbour','die Nachbarn','Der Nachbar steht im Regen.|The neighbour is standing in the rain.','er: Guten Morgen! Schönes Wetter heute, oder? Na ja, ein bisschen nass.|Good morning! Nice weather today, isn’t it? Well, a bit wet.','der Nachbar, die Nachbarin: die Person, die neben dir wohnt.|The person who lives next to you.'],
 regenschirm:['der Regenschirm|the umbrella','die Regenschirme','Der Regenschirm ist rot und offen.|The umbrella is red and open.','sie: Nimm einen Regenschirm mit! Im April weiß man nie.|Take an umbrella! In April you never know.','der Regen und der Schirm: der Regenschirm. Gegen die Sonne gibt es den Sonnenschirm.|rain + shade = umbrella. Against the sun there is the parasol.'],
 gummistiefel:['der Gummistiefel|the rubber boot','die Gummistiefel','Die Gummistiefel sind gelb.|The rubber boots are yellow.','kind: Juhu, Pfützen! Mit Gummistiefeln kann ich springen.|Yay, puddles! With rubber boots I can jump.','Für zwei Schuhe sagt man „ein Paar“: ein Paar Gummistiefel, ein Paar Socken.|For two shoes you say "a pair".'],
 oma:['die Oma|the grandma','die Omas','Die Oma gießt die Blumen.|Grandma is watering the flowers.','sie: Die Blumen haben Durst. Ich gieße sie jeden Morgen.|The flowers are thirsty. I water them every morning.','Die Oma heißt auch Großmutter. Der Opa heißt auch Großvater.|Oma is also called grandmother. Opa is grandfather.'],
 giesskanne:['die Gießkanne|the watering can','die Gießkannen','Die Gießkanne ist voll Wasser.|The watering can is full of water.','sie: Kannst du mir bitte die Gießkanne geben?|Can you please give me the watering can?','gießen und die Kanne: die Gießkanne. Mit der Gießkanne gießt man Blumen.|water + can = watering can.'],
 },

 tf:[['Im Frühling werden die Tage länger.|In spring the days get longer.',1,'sonne'],['Der Regenbogen hat drei Farben.|The rainbow has three colours.',0,'regenbogen','Nein. Der Regenbogen hat sieben Farben.|No. The rainbow has seven colours.'],['Ostern ist immer im Dezember.|Easter is always in December.',0,'osterhase','Nein. Ostern ist im März oder im April.|No. Easter is in March or April.'],['Bienen machen Honig.|Bees make honey.',1,'biene'],['Aus den Blüten werden im Sommer Kirschen.|The blossoms turn into cherries in summer.',1,'baum'],['Ein Schmetterling war zuerst ein Vogel.|A butterfly was a bird first.',0,'schmetterling','Nein. Ein Schmetterling war zuerst eine Raupe.|No. A butterfly was a caterpillar first.'],['Mit Gummistiefeln bleiben die Füße trocken.|With rubber boots your feet stay dry.',1,'gummistiefel']],
 hoer:[['Sie ist klein, gelb und schwarz. Sie fliegt von Blume zu Blume und macht Honig.|It is small, yellow and black. It flies from flower to flower and makes honey.','biene'],['Er hat lange Ohren und bringt zu Ostern die Eier.|He has long ears and brings the eggs at Easter.','osterhase'],['Man braucht ihn, wenn es regnet. Man hält ihn über den Kopf.|You need it when it rains. You hold it over your head.','regenschirm'],['Damit gießt man die Blumen im Garten.|You water the flowers in the garden with it.','giesskanne'],['Er hat sieben Farben. Man sieht ihn nach dem Regen am Himmel.|It has seven colours. You see it in the sky after the rain.','regenbogen'],['Darin liegen kleine blaue Eier. Ein Vogel hat es gebaut.|Small blue eggs lie in it. A bird built it.','nest']]},

{id:'sommer',title:'Im Sommer',en:'In summer',focus:'Temperatur · Freizeit · Imperativ',
 story:['Im Sommer ist es warm, oft sogar heiß.|In summer it is warm, often even hot.','Viele Leute gehen ins Freibad, essen Eis und liegen in der Sonne.|Many people go to the outdoor pool, eat ice cream and lie in the sun.','Aber Vorsicht: Am Nachmittag kommt manchmal ein Gewitter.|But be careful: in the afternoon a thunderstorm sometimes comes.'],
 hs:{
 _bg:['das Freibad|the outdoor pool','die Freibäder','Das Freibad ist im Sommer geöffnet.|The outdoor pool is open in summer.','er: Zwei Erwachsene und ein Kind, bitte.|Two adults and one child, please.','Ein Freibad ist draußen, ein Hallenbad ist drinnen.|An outdoor pool is outside, an indoor pool is inside.'],
 sonne:['die Sonne|the sun','','Die Sonne ist heute sehr stark.|The sun is very strong today.','sie: Bleib im Schatten! Die Sonne ist zu stark.|Stay in the shade! The sun is too strong.','Zwischen zwölf und drei Uhr ist die Sonne am stärksten.|Between twelve and three o’clock the sun is strongest.'],
 gewitter:['das Gewitter|the thunderstorm','die Gewitter','Dunkle Wolken, Blitz und Donner: Ein Gewitter kommt.|Dark clouds, lightning and thunder: a storm is coming.','er: Alle raus aus dem Wasser! Ein Gewitter kommt!|Everybody out of the water! A storm is coming!','Bei Gewitter muss man sofort aus dem Wasser gehen.|In a thunderstorm you must get out of the water at once.'],
 becken:['das Schwimmbecken|the swimming pool','die Schwimmbecken','Das Wasser im Becken ist blau und kühl.|The water in the pool is blue and cool.','kind: Das Wasser ist kalt! Aber super!|The water is cold! But great!','In Deutschland lernen Kinder oft in der Grundschule schwimmen.|In Germany children often learn to swim at primary school.'],
 sprungbrett:['das Sprungbrett|the diving board','die Sprungbretter','Vom Sprungbrett springt man ins Wasser.|You jump into the water from the diving board.','kind: Eins, zwei, drei … und los!|One, two, three … and go!','springen bildet das Perfekt mit „sein“: Ich bin ins Wasser gesprungen.|springen forms the perfect tense with "sein".'],
 bademeister:['der Bademeister|the lifeguard','die Bademeister','Der Bademeister passt auf alle auf.|The lifeguard watches everyone.','er: Bitte nicht vom Beckenrand springen!|Please don’t jump from the edge of the pool!','Der Bademeister hat eine Pfeife. Wenn er pfeift, muss man hören.|The lifeguard has a whistle. When he blows it, you must listen.'],
 sonnenschirm:['der Sonnenschirm|the parasol','die Sonnenschirme','Unter dem Sonnenschirm ist Schatten.|There is shade under the parasol.','sie: Komm unter den Sonnenschirm, hier ist es kühler.|Come under the parasol, it’s cooler here.','Komm unter den Schirm! Wohin? Akkusativ. Ich sitze unter dem Schirm. Wo? Dativ.|Come under the parasol (accusative). I sit under the parasol (dative).'],
 liegestuhl:['der Liegestuhl|the deckchair','die Liegestühle','Auf dem Liegestuhl kann man sich ausruhen.|You can rest on the deckchair.','er: Ah, jetzt erst mal ausruhen.|Ah, now first a little rest.','liegen und der Stuhl: der Liegestuhl.|lie + chair = deckchair.'],
 handtuch:['das Handtuch|the towel','die Handtücher','Das Handtuch liegt auf der Wiese.|The towel is lying on the grass.','sie: Vergiss dein Handtuch nicht!|Don’t forget your towel!','das Handtuch, die Handtücher: Aus u wird im Plural ü.|In the plural u becomes ü.'],
 sonnenbrille:['die Sonnenbrille|the sunglasses','die Sonnenbrillen','Die Sonnenbrille liegt auf dem Handtuch.|The sunglasses are lying on the towel.','kind: Wo ist meine Sonnenbrille?|Where are my sunglasses?','Achtung: „die Brille“ ist im Deutschen Singular. Auf Englisch sagt man „glasses“, im Plural.|Careful: "die Brille" is singular in German, "glasses" is plural in English.'],
 sonnencreme:['die Sonnencreme|the sun cream','','Die Sonnencreme schützt die Haut.|Sun cream protects the skin.','sie: Hast du dich schon eingecremt?|Have you put on sun cream yet?','Man soll sich alle zwei Stunden neu eincremen, besonders nach dem Schwimmen.|You should put on sun cream every two hours, especially after swimming.'],
 wassermelone:['die Wassermelone|the watermelon','die Wassermelonen','Die Wassermelone ist rot, süß und saftig.|The watermelon is red, sweet and juicy.','kind: Darf ich noch ein Stück Melone?|May I have another piece of melon?','Eine Wassermelone besteht zu über neunzig Prozent aus Wasser.|A watermelon is over ninety percent water.'],
 kiosk:['der Kiosk|the kiosk','die Kioske','Am Kiosk gibt es Eis, Pommes und Getränke.|At the kiosk there is ice cream, fries and drinks.','kind: Eine Portion Pommes mit Ketchup, bitte!|One portion of fries with ketchup, please!','Pommes kommt von „Pommes frites“. Das ist Französisch.|Pommes comes from the French "pommes frites".'],
 wasserball:['der Wasserball|the beach ball','die Wasserbälle','Der Wasserball schwimmt im Becken.|The beach ball is floating in the pool.','kind: Wirf den Ball zu mir!|Throw the ball to me!','werfen: ich werfe, du wirfst, er wirft. Der Imperativ ist: Wirf!|The imperative of werfen is: Wirf!'],
 schwimmreifen:['der Schwimmreifen|the swim ring','die Schwimmreifen','Das Kind schwimmt mit einem Schwimmreifen.|The child is swimming with a swim ring.','kind: Ich kann schon ein bisschen schwimmen!|I can already swim a little!','Kleine Kinder tragen oft Schwimmflügel an den Armen.|Small children often wear armbands.'],
 thermometer:['das Thermometer|the thermometer','die Thermometer','Das Thermometer zeigt zweiunddreißig Grad.|The thermometer shows thirty-two degrees.','er: Puh, zweiunddreißig Grad! Das ist ja eine Hitze!|Phew, thirty-two degrees! What heat!','In Deutschland misst man die Temperatur in Grad Celsius.|In Germany temperature is measured in degrees Celsius.'],
 },
 groups:[['Finde drei Dinge gegen die Sonne!|Find three things that protect against the sun!','sonnenschirm sonnenbrille sonnencreme'],['Finde zwei Dinge im Wasser!|Find two things in the water!','wasserball schwimmreifen'],['Finde zwei Dinge zum Liegen!|Find two things to lie on!','liegestuhl handtuch'],['Finde drei Dinge zum Wetter!|Find three weather things!','sonne gewitter thermometer']],
 tf:[['Im Sommer ist es in Deutschland oft heiß.|In summer it is often hot in Germany.',1,'thermometer'],['Bei Gewitter darf man weiter schwimmen.|In a thunderstorm you may keep swimming.',0,'gewitter','Nein. Bei Gewitter muss man sofort aus dem Wasser gehen.|No. In a thunderstorm you must get out of the water at once.'],['Die Sonnencreme schützt die Haut.|Sun cream protects the skin.',1,'sonnencreme'],['Ein Hallenbad ist draußen.|An indoor pool is outside.',0,'','Nein. Ein Hallenbad ist drinnen. Das Freibad ist draußen.|No. An indoor pool is inside. The outdoor pool is outside.'],['Eine Wassermelone besteht fast nur aus Wasser.|A watermelon is almost all water.',1,'wassermelone'],['Der Bademeister verkauft Eis.|The lifeguard sells ice cream.',0,'bademeister','Nein. Der Bademeister passt auf. Eis gibt es am Kiosk.|No. The lifeguard keeps watch. Ice cream is at the kiosk.'],['Unter dem Sonnenschirm ist Schatten.|There is shade under the parasol.',1,'sonnenschirm']],
 hoer:[['Er sitzt hoch oben und passt auf die Schwimmer auf.|He sits up high and watches the swimmers.','bademeister'],['Man trägt sie vor den Augen, wenn die Sonne scheint.|You wear them over your eyes when the sun shines.','sonnenbrille'],['Hier kann man Pommes, Eis und Getränke kaufen.|Here you can buy fries, ice cream and drinks.','kiosk'],['Es zeigt, wie warm oder kalt es ist. Heute zeigt es zweiunddreißig Grad.|It shows how warm or cold it is. Today it shows thirty-two degrees.','thermometer'],['Von hier springt man ins Wasser. Es ist hoch und lang.|You jump into the water from here. It is high and long.','sprungbrett'],['Sie ist groß, grün und rund. Innen ist sie rot und süß.|It is big, green and round. Inside it is red and sweet.','wassermelone']]},

{id:'herbst',title:'Im Herbst',en:'In autumn',focus:'Natur · Ernte · Sankt Martin',
 story:['Im Herbst werden die Tage kürzer und kühler.|In autumn the days get shorter and cooler.','Die Blätter werden bunt und fallen von den Bäumen. Auf den Feldern ist Erntezeit.|The leaves turn colourful and fall from the trees. In the fields it’s harvest time.','Viele Tiere sammeln jetzt Futter für den Winter.|Many animals now collect food for the winter.'],
 hs:{
 _bg:['die Wiese|the meadow','die Wiesen','Auf der Wiese liegen viele bunte Blätter.|Lots of colourful leaves are lying on the meadow.','er: Komm, wir machen einen Herbstspaziergang!|Come on, let’s go for an autumn walk!','Wenn im Oktober noch die Sonne scheint, sagt man: der goldene Oktober.|When the sun still shines in October, people say: golden October.'],
 zugvoegel:['der Zugvogel|the migratory bird','die Zugvögel','Die Zugvögel fliegen nach Süden.|The migratory birds fly south.','kind: Tschüss, Vögel! Bis zum Frühling!|Bye, birds! See you in spring!','Störche und Kraniche fliegen im Herbst nach Afrika. Dort ist es warm.|Storks and cranes fly to Africa in autumn. It’s warm there.'],
 wind:['der Wind|the wind','die Winde','Der Wind weht die Blätter durch die Luft.|The wind blows the leaves through the air.','sie: Heute ist es aber windig! Halt deine Mütze fest!|It’s really windy today! Hold on to your hat!','der Wind wird zu windig. Ein Sturm ist ein sehr starker Wind.|wind → windy. A storm is a very strong wind.'],
 nebel:['der Nebel|the fog','','Am Morgen liegt Nebel über dem Feld.|In the morning there is fog over the field.','er: Fahr vorsichtig! Bei Nebel sieht man nicht viel.|Drive carefully! In fog you can’t see much.','der Nebel wird zu neblig: Heute ist es neblig.|fog → foggy.'],
 baum:['der Baum|the tree','die Bäume','Der Baum hat rote, gelbe und orange Blätter.|The tree has red, yellow and orange leaves.','kind: Der Baum sieht aus wie Feuer!|The tree looks like fire!','Im Herbst bekommen die Bäume weniger Licht. Darum werden die Blätter bunt.|In autumn trees get less light. That’s why the leaves change colour.'],
 blaetter:['das Blatt|the leaf','die Blätter','Die Blätter liegen auf dem Boden.|The leaves are lying on the ground.','kind: Hurra! Ich springe in den Blätterhaufen!|Hooray! I’m jumping into the pile of leaves!','das Blatt, die Blätter. Ein Blatt Papier ist auch ein Blatt!|A sheet of paper is also a "Blatt"!'],
 eichhoernchen:['das Eichhörnchen|the squirrel','die Eichhörnchen','Das Eichhörnchen hat eine Nuss.|The squirrel has a nut.','kind: Schau, das Eichhörnchen versteckt Nüsse!|Look, the squirrel is hiding nuts!','Eichhörnchen verstecken im Herbst Nüsse. Im Winter suchen sie sie wieder.|Squirrels hide nuts in autumn and look for them again in winter.'],
 pilz:['der Pilz|the mushroom','die Pilze','Der Pilz ist rot mit weißen Punkten.|The mushroom is red with white dots.','sie: Nicht anfassen! Der Pilz ist giftig.|Don’t touch! The mushroom is poisonous.','Der rote Pilz mit Punkten heißt Fliegenpilz. Er ist giftig.|The red mushroom with dots is called fly agaric. It’s poisonous.'],
 kastanien:['die Kastanie|the chestnut','die Kastanien','Die Kastanien sind braun und glänzen.|The chestnuts are brown and shiny.','kind: Ich sammle Kastanien. Daraus bastle ich Tiere.|I’m collecting chestnuts. I make animals out of them.','Im Herbst basteln Kinder in Deutschland gern Figuren aus Kastanien.|In autumn German children like making figures out of chestnuts.'],
 igel:['der Igel|the hedgehog','die Igel','Der Igel hat viele Stacheln.|The hedgehog has lots of spines.','kind: Psst, leise! Da ist ein Igel.|Shh, quiet! There’s a hedgehog.','Igel schlafen im Winter. Das nennt man Winterschlaf.|Hedgehogs sleep through the winter. It’s called hibernation.'],
 kuerbis:['der Kürbis|the pumpkin','die Kürbisse','Die Kürbisse sind groß und orange.|The pumpkins are big and orange.','sie: Heute koche ich Kürbissuppe.|Today I’m making pumpkin soup.','der Kürbis, die Kürbisse: Nach kurzem i verdoppelt man das s im Plural.|In the plural the s is doubled.'],
 traktor:['der Traktor|the tractor','die Traktoren','Der Traktor fährt über das Feld.|The tractor drives across the field.','er: Die Ernte ist fast fertig.|The harvest is almost done.','Im Herbst feiern viele Dörfer Erntedank. Man sagt Danke für die Ernte.|In autumn many villages celebrate a harvest festival to say thank you for the harvest.'],
 kind:['das Kind|the child','die Kinder','Das Kind hält eine Laterne.|The child is holding a lantern.','kind: Laterne, Laterne, Sonne, Mond und Sterne!|Lantern, lantern, sun, moon and stars!','Das ist ein bekanntes Laternenlied. Kinder singen es an Sankt Martin.|That’s a well-known lantern song. Children sing it on St Martin’s Day.'],
 laterne:['die Laterne|the lantern','die Laternen','In der Laterne ist ein kleines Licht.|There is a small light in the lantern.','kind: Meine Laterne habe ich selbst gebastelt.|I made my lantern myself.','Am elften November ist Sankt Martin. Kinder gehen mit Laternen durch die Straßen.|On the eleventh of November it’s St Martin’s Day. Children walk through the streets with lanterns.'],
 apfelbaum:['der Apfelbaum|the apple tree','die Apfelbäume','Am Apfelbaum hängen rote Äpfel.|Red apples are hanging on the apple tree.','er: Die Äpfel sind reif. Wir können sie pflücken.|The apples are ripe. We can pick them.','Im Herbst ist Erntezeit: Äpfel, Birnen, Kürbisse und Kartoffeln.|Autumn is harvest time: apples, pears, pumpkins and potatoes.'],
 leiter:['die Leiter|the ladder','die Leitern','Die Leiter steht am Apfelbaum.|The ladder is leaning against the apple tree.','sie: Halt bitte die Leiter fest!|Please hold the ladder!','Achtung: die Leiter ist die Leiter zum Steigen. Der Leiter ist der Chef!|Careful: die Leiter = ladder, der Leiter = the boss!'],
 korb:['der Korb|the basket','die Körbe','Der Korb ist voller Äpfel.|The basket is full of apples.','er: Ein Korb voll Äpfel! Daraus backen wir einen Apfelkuchen.|A basket full of apples! We’ll bake an apple cake with them.','voller Äpfel heißt: voll mit Äpfeln.|"voller Äpfel" means full of apples.'],
 },
 groups:[['Finde drei Tiere!|Find three animals!','zugvoegel eichhoernchen igel'],['Finde zwei Dinge zum Wetter!|Find two weather things!','wind nebel'],['Was kann man im Wald sammeln? Finde drei Dinge!|What can you collect in the woods? Find three things!','pilz kastanien blaetter'],['Finde drei Dinge für die Apfelernte!|Find three things for the apple harvest!','apfelbaum leiter korb'],['Finde zwei Dinge für Sankt Martin!|Find two things for St Martin’s Day!','kind laterne']],

 hoer:[['Er ist klein und hat viele Stacheln. Im Winter hält er Winterschlaf.|It is small and has lots of spines. In winter it hibernates.','igel'],['Man steigt darauf, um die Äpfel oben am Baum zu pflücken.|You climb on it to pick the apples at the top of the tree.','leiter'],['Sie hat ein kleines Licht. Kinder tragen sie im November durch die Straßen.|It has a small light. Children carry it through the streets in November.','laterne'],['Er ist groß, rund und orange. Man kann Suppe daraus kochen.|It is big, round and orange. You can make soup from it.','kuerbis'],['Es hat einen langen, buschigen Schwanz und sammelt Nüsse.|It has a long bushy tail and collects nuts.','eichhoernchen'],['Er ist grau, und man sieht nicht weit. Am Morgen liegt er über dem Feld.|It is grey and you can’t see far. In the morning it lies over the field.','nebel']]},

{id:'winter',title:'Im Winter',en:'In winter',focus:'Kleidung · Feste · Akkusativ',
 story:['Im Winter ist es kalt. Manchmal schneit es.|In winter it is cold. Sometimes it snows.','Im Dezember gibt es in vielen Städten einen Weihnachtsmarkt.|In December many towns have a Christmas market.','Und an Silvester, am einunddreißigsten Dezember, feiert man mit Feuerwerk das neue Jahr.|And on New Year’s Eve, the thirty-first of December, people celebrate the new year with fireworks.'],
 hs:{
 _bg:['der Weihnachtsmarkt|the Christmas market','die Weihnachtsmärkte','Auf dem Weihnachtsmarkt riecht es nach Zimt und Plätzchen.|The Christmas market smells of cinnamon and biscuits.','sie: Wollen wir heute Abend auf den Weihnachtsmarkt gehen?|Shall we go to the Christmas market tonight?','Den Weihnachtsmarkt in Dresden gibt es schon seit fast sechshundert Jahren.|The Christmas market in Dresden has existed for almost six hundred years.'],
 weihnachtsbaum:['der Weihnachtsbaum|the Christmas tree','die Weihnachtsbäume','Der Weihnachtsbaum hat Kugeln, Lichter und einen Stern.|The Christmas tree has baubles, lights and a star.','kind: Oh, ist der Baum schön!|Oh, the tree is beautiful!','Der Weihnachtsbaum kommt aus Deutschland. Heute gibt es ihn auf der ganzen Welt.|The Christmas tree tradition comes from Germany. Today it is all over the world.'],
 geschenke:['das Geschenk|the present','die Geschenke','Unter dem Baum liegen Geschenke.|Presents are lying under the tree.','kind: Ist das Geschenk für mich?|Is the present for me? // sie: Ja, aber du darfst es erst an Heiligabend öffnen.|Yes, but you can only open it on Christmas Eve.','In Deutschland öffnet man die Geschenke meistens am Abend vom vierundzwanzigsten Dezember.|In Germany presents are usually opened on the evening of the twenty-fourth of December.'],
 schneemann:['der Schneemann|the snowman','die Schneemänner','Der Schneemann hat eine Karottennase.|The snowman has a carrot nose.','kind: Komm, wir bauen einen Schneemann!|Come on, let’s build a snowman!','der Mann, die Männer. Der Schneemann, die Schneemänner.|man → men, snowman → snowmen.'],
 schneeflocke:['die Schneeflocke|the snowflake','die Schneeflocken','Die Schneeflocken fallen leise vom Himmel.|The snowflakes fall quietly from the sky.','kind: Es schneit! Es schneit!|It’s snowing! It’s snowing!','Jede Schneeflocke hat sechs Spitzen.|Every snowflake has six points.'],
 stand:['die Bude|the stall','die Buden','In der Bude gibt es Plätzchen und Punsch.|There are biscuits and punch in the stall.','er: Was darf es sein?|What can I get you? // sie: Zwei Kinderpunsch, bitte.|Two children’s punches, please.','Auf dem Weihnachtsmarkt heißen die kleinen Holzhäuser Buden.|At the Christmas market the little wooden huts are called Buden.'],
 plaetzchen:['das Plätzchen|the Christmas biscuit','die Plätzchen','Die Plätzchen haben die Form von Sternen.|The biscuits are star-shaped.','kind: Darf ich ein Plätzchen probieren?|May I try a biscuit?','Im Advent backen viele Familien zusammen Plätzchen.|In Advent many families bake biscuits together.'],
 punsch:['der Kinderpunsch|the children’s punch','','Der Punsch ist heiß und süß.|The punch is hot and sweet.','sie: Vorsicht, heiß!|Careful, hot!','Erwachsene trinken oft Glühwein. Für Kinder gibt es Kinderpunsch ohne Alkohol.|Adults often drink mulled wine. For children there is punch without alcohol.'],
 adventskranz:['der Adventskranz|the Advent wreath','die Adventskränze','Der Adventskranz hat vier Kerzen.|The Advent wreath has four candles.','sie: Heute ist der zweite Advent. Wir zünden zwei Kerzen an.|Today is the second Sunday of Advent. We light two candles.','Der Advent sind die vier Sonntage vor Weihnachten. Jeden Sonntag brennt eine Kerze mehr.|Advent is the four Sundays before Christmas. Each Sunday one more candle burns.'],
 feuerwerk:['das Feuerwerk|the fireworks','die Feuerwerke','Das Feuerwerk ist bunt und laut.|The fireworks are colourful and loud.','er: Drei, zwei, eins … Frohes neues Jahr!|Three, two, one … Happy New Year!','An Silvester, am einunddreißigsten Dezember, feiert man um Mitternacht mit Feuerwerk.|On New Year’s Eve people celebrate at midnight with fireworks.'],
 kind:['das Kind|the child','die Kinder','Das Kind ist warm angezogen.|The child is dressed warmly.','kind: Mir ist überhaupt nicht kalt!|I’m not cold at all!','„Mir ist kalt“: Bei kalt und warm benutzt man den Dativ.|For feeling cold or warm German uses the dative: mir ist kalt.'],
 muetze:['die Mütze|the hat','die Mützen','Die Mütze ist rot und warm.|The hat is red and warm.','sie: Setz deine Mütze auf! Es ist kalt.|Put your hat on! It’s cold.','Kleidung im Akkusativ: Ich trage einen Schal, eine Mütze und ein Paar Handschuhe.|Clothes in the accusative: I wear a scarf, a hat and a pair of gloves.'],
 schal:['der Schal|the scarf','die Schals','Der Schal ist lang und gestreift.|The scarf is long and striped.','kind: Mama, mein Schal kratzt!|Mum, my scarf is itchy!','der Schal, die Schals: Einige Wörter bekommen im Plural ein s.|Some words get an s in the plural.'],
 handschuhe:['der Handschuh|the glove','die Handschuhe','Die Handschuhe halten die Hände warm.|The gloves keep the hands warm.','sie: Zieh die Handschuhe an, sonst frieren deine Finger.|Put your gloves on, otherwise your fingers will freeze.','die Hand und der Schuh: der Handschuh. Ein Schuh für die Hand!|hand + shoe = glove: a shoe for the hand!'],
 stiefel:['der Stiefel|the boot','die Stiefel','Die Stiefel sind warm und wasserdicht.|The boots are warm and waterproof.','kind: Meine Stiefel sind voller Schnee!|My boots are full of snow!','anziehen und ausziehen sind trennbar: Ich ziehe die Stiefel an. Ich ziehe sie aus.|anziehen and ausziehen are separable verbs.'],
 schlitten:['der Schlitten|the sledge','die Schlitten','Der Schlitten ist aus Holz.|The sledge is made of wood.','kind: Ich will Schlitten fahren! Zieh mich, bitte!|I want to go sledging! Pull me, please!','Man sagt „Schlitten fahren“, auch ohne Motor.|You say "Schlitten fahren" (drive a sledge), even without an engine.'],

function tone(kind){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seqs={tap:[[1046,.05]],ok:[[660,.09],[880,.09],[1320,.18]],no:[[220,.12],[165,.22]],win:[[523,.1],[659,.1],[784,.1],[1047,.32]],start:[[440,.08],[660,.08],[880,.14]]};
    let at=actx.currentTime;
    for(const [f,d] of seqs[kind]){const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='no'?'square':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(kind==='no'?.045:.13,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g).connect(actx.destination);o.start(at);o.stop(at+d+.03);at+=d*.9}
  }catch(e){}
}

function sayAs(text,spk,onend){
  let done=false,timer,checks=0;
  const fin=()=>{if(done)return;done=true;clearTimeout(timer);onend&&onend()};
  const arm=ms=>{timer=setTimeout(()=>{if('speechSynthesis' in window&&speechSynthesis.speaking&&checks++<30)arm(800);else fin()},ms)};
  arm(1800+text.length*90);   // fallback in case the browser never fires onend
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const v=SPK[spk]||SPK.erz,u=new SpeechSynthesisUtterance(speakable(text));
  u.lang='de-DE';if(deVoice)u.voice=deVoice;u.pitch=v[1];u.rate=v[2];u.onend=u.onerror=fin;speechSynthesis.speak(u);
}

   A line can be split into reusable pieces (L.say) so game sentences are built from clips.
   Any clip that fails to load falls back to the browser's own German voice for that line. */
const CLIP_DIR='audio/tipp/';
const clipKey=(spk,t)=>{const s=spk+'|'+speakable(t).replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};

function playClips(keys,onend,onfail){
  const tok=++PL.tok,el=PL.el;let i=0,timer;
  const stop=()=>{clearTimeout(timer);el.onended=el.onerror=el.onplaying=null};
  const fail=k=>{if(tok!==PL.tok)return;stop();PL.bad.add(k);onfail()};
  const step=()=>{
    if(tok!==PL.tok)return;
    if(i>=keys.length){stop();onend();return}
    const k=keys[i++];
    el.onended=step;el.onerror=()=>fail(k);el.onplaying=()=>clearTimeout(timer);
    clearTimeout(timer);timer=setTimeout(()=>fail(k),5000);   // never got going: use the browser voice
    el.src=CLIP_DIR+k+'.mp3';
    const p=el.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=='AbortError')fail(k)});
  };
  step();
}

  playClips(keys,onend,()=>sayAs(L.de,L.s,onend));
}

  const r=fig.getBoundingClientRect();let x,y;
  if(ev&&(ev.clientX||ev.clientY)){x=ev.clientX;y=ev.clientY}else{const b=el.getBoundingClientRect();x=Math.max(r.left,Math.min(r.right,b.left+b.width/2));y=Math.max(r.top,Math.min(r.bottom,b.top+b.height/2))}
  const s=document.createElement('span');s.className='ripple';s.style.left=(x-r.left)+'px';s.style.top=(y-r.top)+'px';fig.appendChild(s);setTimeout(()=>s.remove(),600);
}
function tipTap(el,ev){
  const sid=el.closest('svg').dataset.s,sc=scene(sid),id=el.dataset.h,h=sc.hs[id];if(!h)return;
  ripple(ev,el);flash(id,'hit');
  const fresh=markFound(sid,id);
  if(T.game&&T.game.sid!==sid)endGame();
  if(T.game){gameTap(id);return}
  tone('tap');
  const key=`${sid}.${id}.${T.mode}`,c=T.cnt[key]||0;T.cnt[key]=c+1;
  let lines;
  if(T.mode==='erzaehlen'||T.mode==='sagen')lines=h.e[c%h.e.length];
  else if(T.mode==='wissen')lines=[h.k[c%h.k.length]];
  else{const opts=[{s:'stift',de:h.w,en:h.en,w:1},...h.d];if(h.pl)opts.push({s:'stift',de:`${h.w}, ${h.pl}`,en:`${h.en} – one and many`,w:1});lines=[opts[c%opts.length]]}
  if(fresh&&countFound(sid)===totalOf(sid)){lines=[...lines,ln(SAYS.done,'stift')];setTimeout(()=>tone('win'),180)}
  speakSeq(lines,modeHead());
}
function refreshSyms(){
  document.querySelectorAll('.sym').forEach(b=>{const k=b.dataset.k,on=T.game?k==='g'+T.game.g:k===T.mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
}
function symTap(k,sid){
  if(k==='stopp'){penClose();return}
  if(k[0]==='g'){if(sid)startGame(sid,+k[1]);return}
  endGame();T.mode=k;refreshSyms();tone('tap');
  const intro=ln(MODES[k].intro,'stift');
  speakSeq(k===TB().storyMode&&sid?[intro,...scene(sid).story]:[intro],modeHead());
}

/* ---------- games ---------- */
function startGame(sid,slot){
  const sc=scene(sid),type=TB().games[slot-1],items=GAMES[type].items(sc);
  if(!items.length)return;
  stopSay();
  T.game={sid,g:slot,type,items,n:0,score:0,tries:0,asked:-1,used:new Set(),wait:false};
  refreshSyms();tone('start');
  speakSeq([ln(GAMES[type].intro,'stift')],gameHead(),ask);
}
function endGame(){if(T.game){T.game=null;refreshSyms()}}
function ask(){
  const G=T.game;if(!G)return;
  if(G.n>=G.items.length){finishGame();return}
  const it=G.items[G.n];
  if(G.type==='artikel'&&!it.art){const sc=scene(G.sid),left=['der','die','das'].filter(a=>nounsOf(sc).some(id=>ART(sc.hs[id].w)===a&&!G.used.has(id))),a=left[Math.random()*left.length|0];
    Object.assign(it,{art:a,q:`Finde etwas mit „${a}“!`,en:`Find something with "${a}"!`})}
  if(G.asked!==G.n){G.tries=0;G.asked=G.n}
  G.wait=true;
  if(G.type==='wahr'){it.a.forEach(id=>flash(id,'hit'));speakSeq([{s:'stift',de:it.q,en:it.en}],gameHead(),null,ANSWERS);return}
  speakSeq([{s:'stift',de:it.q,en:it.en,hide:G.type==='hoeren'}],gameHead());
}
const revealOf=it=>({s:'stift',de:it.q,en:it.en,mute:1});
function gameTap(id){
  const G=T.game;if(!G.wait){tone('tap');return}
  const sc=scene(G.sid),h=sc.hs[id],it=G.items[G.n],what=`Das ist ${h.w}.`,whatEn=`That is ${h.en}.`;
  if(G.type==='wahr'){speakSeq([ln(SAYS.tf,'stift')],gameHead(),null,ANSWERS);return}
  if(G.type==='sammeln'){
    if(it.a.includes(id)){
      if(it.got.has(id)){tone('no');speakSeq([ln(SAYS.have,'stift'),{s:'stift',de:it.q,en:it.en}],gameHead());return}
      it.got.add(id);tone('ok');const left=it.a.length-it.got.size;
      if(left>0){speakSeq([{s:'stift',de:`Ja! ${what} ${NOCH[left]}`,say:['Ja!',what,NOCH[left]],en:`Yes! ${whatEn} ${left} more!`,w:1}],gameHead());return}
      if(it.miss===0)G.score++;G.n++;G.wait=false;
      speakSeq([{s:'stift',de:`Ja! ${what}`,say:['Ja!',what],en:`Yes! ${whatEn}`,w:1},ln(SAYS.all,'stift')],gameHead(),ask);return}
    it.miss++;G.tries++;tone('no');
    if(G.tries<3){speakSeq([{s:'stift',de:`Nein. ${what} ${it.q}`,say:['Nein.',what,it.q],en:`No. ${whatEn} ${it.en}`,w:1}],gameHead());return}
    const rest=it.a.filter(x=>!it.got.has(x));rest.forEach(x=>flash(x,'hint'));G.n++;G.wait=false;
    speakSeq([{s:'stift',de:'Schau mal, hier!',en:'Look, here!'},...rest.map(x=>({s:'stift',de:`Das ist ${sc.hs[x].w}.`,en:`That is ${sc.hs[x].en}.`,w:1}))],gameHead(),ask);return;
  }
  let ok;
  if(G.type==='artikel'){ok=ART(h.w)===it.art;
    if(ok&&G.used.has(id)){tone('no');const a=`Finde etwas anderes mit „${it.art}“!`;speakSeq([{s:'stift',de:`Das hatten wir schon. ${a}`,say:['Das hatten wir schon.',a],en:`We already had that. Find something else with "${it.art}"!`}],gameHead());return}}
  else ok=it.a.includes(id);
  const reveal=G.type==='hoeren'?[revealOf(it)]:[];
  if(ok){
    if(G.tries===0)G.score++;
    G.used.add(id);G.n++;G.wait=false;tone('ok');
    const p=shuffle(PRAISE)[0];
    speakSeq([{s:'stift',de:`${p} ${what}`,say:[p,what],en:`Right! ${whatEn}`,w:1},...reveal],gameHead(),ask);
  }else{
    G.tries++;tone('no');
    if(G.tries<3)speakSeq([{s:'stift',de:`Nein. ${what} ${it.q}`,say:['Nein.',what,it.q],en:`No. ${whatEn} ${it.en}`,w:1,hide:G.type==='hoeren'}],gameHead());
    else{
      const ans=G.type==='artikel'?nounsOf(sc).find(x=>ART(sc.hs[x].w)===it.art&&!G.used.has(x)):it.a[0];
      G.used.add(ans);G.n++;G.wait=false;flash(ans,'hint');
      speakSeq([{s:'stift',de:`Schau mal, hier! Das ist ${sc.hs[ans].w}.`,say:['Schau mal, hier!',`Das ist ${sc.hs[ans].w}.`],en:`Look, here! That is ${sc.hs[ans].en}.`,w:1},...reveal],gameHead(),ask);
    }
  }
}
function wahrAnswer(yes){
  const G=T.game;if(!G||G.type!=='wahr'||!G.wait)return;
  const it=G.items[G.n],ok=yes===it.t;G.wait=false;G.n++;if(ok)G.score++;tone(ok?'ok':'no');
  const p=ok?{s:'stift',de:shuffle(PRAISE)[0],en:'Right!'}:ln(SAYS.nope,'stift');
  speakSeq([p,it.t?ln(SAYS.true,'stift'):it.why],gameHead(),ask);
}
function finishGame(){
  const G=T.game;T.game=null;refreshSyms();
  const k=`${G.sid}.${G.g}`,s=G.score,len=G.items.length,pct=Math.round(s/len*100);
  if(!(k in T.best)||pct>T.best[k]){T.best[k]=pct;store.set('a2.tip.best2',T.best)}
  const [de,en]=s===len?FINISH.all:s/len>=.6?FINISH.good:FINISH.ok,pts=ptsSay(s,len);
  tone('win');
  speakSeq([{s:'stift',de:`${de} ${pts}`,say:[de,pts],en:`${en} You got ${s} of ${len} points.`},ln(AGAIN,'stift')],
    pchip(`Spiel ${G.g} · ${GAMES[G.type].n}`,symOf('g'+G.g).c)+`<span class="pstars">${starStr(pct)}</span>`);
}

/* ---------- pages ----------
   A tip book is a row of spreads: cover, one per scene, album. Wide screens show a spread per page index;
   narrow screens show one half per index (cover reversed so the title comes first). */
function tipN(){return TB().scenes.length+2}
function tipLast(){return wideMQ.matches?tipN()-1:tipN()*2-1}
function tipAt(p,wide){if(wide)return [p,null];const sp=p>>1,first=!(p&1);return [sp,sp===0?(first?'R':'L'):(first?'L':'R')]}
function curSceneId(){const [sp]=tipAt(S.page,wideMQ.matches),n=TB().scenes.length;return sp>0&&sp<=n?TB().scenes[sp-1].id:null}
const symBtn=(s,sid)=>`<button class="sym" data-act="sym" data-k="${s.k}" data-s="${sid}" style="--k:${s.c}" aria-label="${s.k[0]==='g'?`${s.n}: ${GAMES[s.g].n}`:s.n}" title="${s.k[0]==='g'?`${s.n}: ${GAMES[s.g].n}`:s.n}"><span class="ic">${icoSvg(s.ic)}</span><span class="lb">${s.n}</span></button>`;
const strip=(sid,side)=>{const all=symsOf(TB());return `<div class="strip${side?'':' all'}">${(side==='L'?all.slice(0,3):side==='R'?all.slice(3):all).map(s=>symBtn(s,sid)).join('')}</div>`};
function tipFig(sc,half){
  const vb=half==='L'?'0 0 400 440':half==='R'?'400 0 400 440':'0 0 800 440';
  const body=TIPART[sc.id]().replace(/<g class="hs" data-h="(\w+)">/g,(m,id)=>`<g class="hs" data-h="${id}" tabindex="0" role="button" aria-label="${esc(sc.hs[id]?sc.hs[id].w:id)}">`);
  return `<div class="tipfig"><svg viewBox="${vb}" data-s="${sc.id}" role="group" aria-label="${esc(sc.title)}">${body}</svg></div>`}
function howtoHTML(){
  return `<div class="intro tiphow"><h3>So spielst du</h3><p>Der Zauberstift liest dir vor. Wähle oben auf der Seite ein Symbol und tippe dann auf das Bild. Hier kannst du jedes Symbol ausprobieren:</p>
    <div class="howlist">${symsOf(TB()).map(s=>`<button class="howrow" data-act="help" data-k="${s.k}" style="--k:${s.c}"><span class="ic">${icoSvg(s.ic)}</span><span><b>${s.k[0]==='g'?`${s.n}: ${GAMES[s.g].n}`:s.n}</b><small>${s.k[0]==='g'?GAMES[s.g].help:s.help}</small></span></button>`).join('')}</div></div>`}
function titleHTML(){const b=TB();
  return `<div class="titlepage"><div class="num">Tipp-Buch ${S.tip+1} · Niveau A2</div><h2 class="booktitle">${b.title}</h2><div class="sub">${b.titleEn}</div>
    <div class="figure">${TIPCOVERS[b.id]()}</div><button class="startbtn" data-act="start"><span class="ic">${icoSvg(IC.start)}</span>Start</button><div class="by">${b.by}</div></div>`}
function albumHTML(){
  const b=TB(),sc=b.scenes;let f=0,t=0,st=0;
  const rows=sc.map((s,i)=>{const a=countFound(s.id),n=totalOf(s.id);f+=a;t+=n;[1,2,3].forEach(g=>st+=starsOf(T.best[s.id+'.'+g]));
    return `<div class="arow"><div class="at"><b>${i+1} · ${s.title}</b><span>${a} / ${n}</span></div><div class="bar"><i style="width:${a/n*100}%"></i></div>
      <div class="astars">${b.games.map((g,j)=>`<span>${GAMES[g].n} <span class="st">${starStr(T.best[s.id+'.'+(j+1)])}</span></span>`).join('')}</div></div>`}).join('');
  const max=sc.length*9,done=f===t&&st>=sc.length*6;
  return `<h3>Mein Sammelalbum</h3><div class="album">${rows}</div>
    <div class="cert${done?' on':''}">${done?`<b>Urkunde</b>${b.cert} Herzlichen Glückwunsch!`:`<b>Deine Urkunde</b>Entdecke alles und hol in jedem Spiel zwei Sterne.<br>Entdeckt: ${f} / ${t} · Sterne: ${st} / ${max}`}</div>
    <div class="finish"><button class="btn" data-act="tipreset">Neu anfangen</button></div>`}
function wordsHTML(){
  return `<h3>Meine Wörter</h3><p class="wnote">Tippe auf ein Wort und hör zu. Neue Wörter findest du mit „Entdecken“.</p>${TB().scenes.map(sc=>`<div class="wgroup"><b>${sc.title}</b><div class="wchips">${nounsOf(sc).map(id=>{const h=sc.hs[id];
    return (T.found[sc.id]||[]).includes(id)?`<button class="wchip ${ART(h.w)}" data-act="sayw" data-t="${esc(h.w)}" data-e="${esc(h.en)}">${esc(h.w)}</button>`:'<span class="wchip lock" title="noch nicht entdeckt">? ? ?</span>'}).join('')}</div></div>`).join('')}
    <div class="finish"><button class="btn on" data-act="back">Zum Bücherregal</button></div>`}
function tipPage(sp,side,wide){
  const n=TB().scenes.length,p=S.page,last=tipLast();
  const prev=wide?side==='L'&&sp>0:p>0, next=wide?side==='R'&&sp<n+1:p<last;
  const corners=(prev?corner(-1):'')+(next?corner(1):'');
  if(sp===0)return (side==='L'?howtoHTML():titleHTML())+corners;
  if(sp===n+1)return (side==='L'?albumHTML():wordsHTML())+corners;
  const sc=TB().scenes[sp-1],L=side==='L';
  const head=`<div class="runhead">${L||!wide?`${sp} · ${sc.title}`:sc.en}</div>`;
  const foot=L?`<span class="chip">${sc.focus}</span>`:`<span class="chip"><b class="fnd" data-s="${sc.id}">${countFound(sc.id)}</b> / ${totalOf(sc.id)} entdeckt</span>`;
  return `<div class="tiphead">${head}${strip(sc.id,wide?side:null)}</div>${tipFig(sc,side)}<div class="tipfoot ${side}">${foot}</div>${pnum((sp-1)*2+(L?1:2))}${corners}`;
}
function renderTip(){
  const b=TB(),wide=wideMQ.matches,idx=S.page,[sp,side]=tipAt(idx,wide),last=tipLast();
  const pages=wide?`<div class="pg left tip">${tipPage(sp,'L',true)}</div><div class="pg right tip">${tipPage(sp,'R',true)}</div>`:`<div class="pg single tip">${tipPage(sp,side,false)}</div>`;
  app.innerHTML=`
    <div class="top" style="--c:${b.color}">
      <button class="btn" data-act="back">${ARROW(-1)} Bücherregal</button>
      <div class="tools">
        <button class="btn ${S.en?'on':''}" data-act="en" aria-pressed="${S.en}">Englisch</button>
        <button class="btn ${soundOn?'on':''}" data-act="sound" aria-pressed="${soundOn}">Ton</button>
      </div>
    </div>
    <div class="book tipbook ${wide?'wide':'narrow'}" style="--c:${b.color}" id="book"><div class="spread" id="spread">${pages}</div></div>
    <div class="nav" style="--c:${b.color}">
      <button class="round" data-act="prev" aria-label="Zurückblättern" ${idx===0?'disabled':''}>${ARROW(-1)}</button>
      <div class="dots">${[...Array(last+1)].map((_,j)=>`<button class="dot ${j===idx?'cur':''}" data-act="go" data-p="${j}" aria-label="Seite ${j+1}"></button>`).join('')}</div>
      <button class="round" data-act="next" aria-label="Umblättern" ${idx===last?'disabled':''}>${ARROW(1)}</button>
    </div>`;
  pen.style.setProperty('--c',b.color);
  // a hotspot that lies outside this half-page's viewBox leaves the tab order
  document.querySelectorAll('#spread svg[data-s]').forEach(svg=>{const [x0,,w]=svg.getAttribute('viewBox').split(' ').map(Number);
    svg.querySelectorAll('.hs').forEach(g=>{try{const bb=g.getBBox();if(bb.x+bb.width<x0+10||bb.x>x0+w-10)g.setAttribute('tabindex','-1')}catch(e){}})});
  refreshSyms();
}
function openTip(i){S.tip=i;S.story=null;S.page=0;T.mode=TB().modes[0];T.game=null;closeSheet();stopSay();penHide();renderTip();window.scrollTo(0,0)}
function tipShelf(){
  return `<section class="tipsec" aria-labelledby="tiph">
    <div class="sechead"><span class="pill">Neu · mit Zauberstift</span><h2 class="sectitle" id="tiph">Tipp-Bücher</h2>
      <p>Bücher zum Antippen: Wähle ein Symbol, tippe auf die Bilder und hör zu. Jedes Buch hat eigene Spiele.</p></div>
    <div class="shelf">${TIPBOOKS.map((b,i)=>`
      <button class="cover" data-act="opentip" data-i="${i}" style="--c:${b.color}">
        <span class="spine"></span>
        <span class="art">${TIPCOVERS[b.id]()}</span>
        <span class="label"><span class="num">Tipp-Buch ${i+1} · ${b.kind}</span><span class="t">${b.title}</span><span class="en">${b.titleEn}</span></span>
        <span class="chips"><span class="chip">${b.scenes.length} Bildseiten</span>${b.games.map(g=>`<span class="chip">${GAMES[g].n}</span>`).join('')}<span class="chip">${b.scenes.reduce((a,s)=>a+Object.keys(s.hs).length,0)} Dinge zum Antippen</span></span>
      </button>`).join('')}
      <div class="cover soon" aria-hidden="true"><span class="spine"></span><span class="label"><span class="num">Tipp-Buch ${TIPBOOKS.length+1}</span><span class="t">Kommt bald …</span></span></div>
    </div>
  </section>`}
function tipAct(act,b){
  if(act==='opentip')openTip(+b.dataset.i);
  else if(act==='sym')symTap(b.dataset.k,b.dataset.s);
  else if(act==='help'){const k=b.dataset.k;
    if(MODES[k])symTap(k,null);
    else if(k==='stopp'){penClose();speakSeq([ln(STOPSAY,'stift')],pchip('Stopp',STOP.c))}
    else{endGame();tone('tap');const s=symOf(k);speakSeq([ln(GAMES[s.g].intro,'stift')],pchip(`${s.n} · ${GAMES[s.g].n}`,s.c))}}
  else if(act==='start'){endGame();T.mode=TB().modes[0];refreshSyms();tone('start');
    speakSeq(['Hallo! Ich bin dein Zauberstift.|Hello! I am your magic pen.',`Wir lesen zusammen das Buch: ${TB().title}.|Let’s read the book together: ${TB().titleEn}.`,'Wähle oben auf der Seite ein Symbol und tippe dann auf die Bilder. Viel Spaß!|Choose a symbol at the top of the page and then tap the pictures. Have fun!'].map(x=>ln(x,'stift')),pchip('Start','var(--leaf)'))}
  else if(act==='sayw'){tone('tap');speakSeq([{s:'stift',de:b.dataset.t,en:b.dataset.e,w:1}],pchip('Meine Wörter'))}
  else if(act==='tipreset'){
    if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Wirklich alles löschen?';return true}
    T.found={};T.best={};store.set('a2.tip.found',{});store.set('a2.tip.best2',{});renderTip();
  }
  else return false;
  return true;
}
// after a page turn: a game keeps going while the same scene is open, otherwise it ends
function tipTurned(was){const now=curSceneId();if(now!==was){endGame();penHide()}else if(T.game)setTimeout(ask,350)}
S.en=!!store.get('a2.en');
library();
</script>
