 fenster:['das Fenster|the window','die Fenster','Das Fenster hat einen weißen Rahmen.|The window has a white frame.','Das Fenster ist im zweiten Stock, links.|The window is on the second floor, on the left.','Viele deutsche Fenster kann man auf zwei Arten öffnen: ganz auf oder gekippt.|Many German windows open two ways: fully or tilted.'],
 balkon:['der Balkon|the balcony','die Balkone','Auf dem Balkon wachsen rote und rosa Blumen.|Red and pink flowers grow on the balcony.','Der Balkon ist im ersten Stock, rechts.|The balcony is on the first floor, on the right.','Viele Deutsche haben Blumen auf dem Balkon, zum Beispiel Geranien.|Many Germans have flowers on the balcony, for example geraniums.'],
 haustuer:['die Haustür|the front door','die Haustüren','Die Haustür ist aus Holz. Die Hausnummer ist zwölf.|The front door is made of wood. The house number is twelve.','Die Haustür ist im Erdgeschoss, rechts neben der Klingel.|The front door is on the ground floor, to the right of the doorbell.','In Deutschland ist die Haustür oft abgeschlossen. Man braucht einen Schlüssel.|In Germany the front door is often locked. You need a key.'],
 klingel:['die Klingel|the doorbell','die Klingeln','An der Klingel stehen die Namen von allen Mietern.|The names of all the tenants are on the doorbell panel.','Die Klingel ist links neben der Haustür.|The doorbell is to the left of the front door.','klingeln: Ich klingle bei meiner Nachbarin. Ding, dong!|to ring: I ring my neighbour’s bell.'],
 umzugswagen:['der Umzugswagen|the removal van','die Umzugswagen','Im Umzugswagen sind Möbel und Kartons.|There is furniture and boxes in the removal van.','Der Umzugswagen steht rechts neben dem Haus.|The removal van is to the right of the building.','umziehen ist trennbar: Ich ziehe um. Ich bin umgezogen.|umziehen is separable: I move. I have moved.'],
 kartons:['der Umzugskarton|the moving box','die Umzugskartons','Auf dem Karton steht: Küche.|The box says: kitchen.','Die Kartons stehen auf dem Gehweg vor dem Haus.|The boxes are on the pavement in front of the building.','Schreib auf jeden Karton das Zimmer. Dann weißt du beim Auspacken, wohin er gehört.|Write the room on each box. Then you know where it goes when unpacking.'],
 mieter:['die Mieterin|the tenant','die Mieterinnen','Die neue Mieterin trägt einen Karton.|The new tenant is carrying a box.','Die Mieterin steht vor dem Haus, neben den Kartons.|The tenant is standing in front of the building, next to the boxes.','der Mieter, die Mieterin: Man zahlt jeden Monat Miete an den Vermieter.|You pay rent to the landlord every month.'],
 hausmeister:['der Hausmeister|the caretaker','die Hausmeister','Der Hausmeister fegt den Gehweg.|The caretaker is sweeping the pavement.','Der Hausmeister steht links vor dem Haus, unter dem Baum.|The caretaker stands on the left in front of the building, under the tree.','Der Hausmeister repariert Sachen im Haus und hält alles sauber.|The caretaker repairs things in the building and keeps everything clean.'],
 baum:['der Baum|the tree','die Bäume','Der Baum ist groß und grün.|The tree is big and green.','Der Baum steht links neben dem Haus.|The tree stands to the left of the building.','In vielen deutschen Städten stehen Bäume an der Straße. Sie geben im Sommer Schatten.|Many German streets have trees. They give shade in summer.'],
 },
 wohin:[['','keller','Wohin bringst du dein Fahrrad?|Where do you take your bike?','Das Fahrrad bringe ich in den Keller.|I take my bike down to the cellar.'],['','briefkaesten','Wohin wirft der Postbote die Briefe?|Where does the postman put the letters?','Der Postbote wirft die Briefe in den Briefkasten.|The postman puts the letters in the letterbox.'],['','dachboden','Wohin bringst du die alten Sachen?|Where do you take the old things?','Die alten Sachen bringe ich auf den Dachboden.|I take the old things up to the attic.'],['','balkon','Wohin stellst du die Blumen?|Where do you put the flowers?','Die Blumen stelle ich auf den Balkon.|I put the flowers on the balcony.'],['kartons','stock1','Wohin trägt die Mieterin die Kartons?|Where does the tenant carry the boxes?','Sie trägt die Kartons in den ersten Stock.|She carries the boxes to the first floor.'],['','klingel','Wohin schreibst du deinen Namen?|Where do you write your name?','Meinen Namen schreibe ich an die Klingel.|I write my name on the doorbell.']],
 dlg:[['er: Guten Tag! Sind Sie die neue Mieterin?|Hello! Are you the new tenant?',['Ja, ich wohne jetzt im ersten Stock.|Yes, I live on the first floor now.','Nein, ich habe keinen Hunger.|No, I’m not hungry.','Um halb acht.|At half past seven.']],['er: Brauchen Sie Hilfe mit den Kartons?|Do you need help with the boxes?',['Ja, gern! Das ist sehr nett.|Yes, please! That’s very kind.','Ja, die Kartons sind blau.|Yes, the boxes are blue.','Nein, ich heiße Anna.|No, my name is Anna.']],['sie: Herzlich willkommen im Haus!|Welcome to the building!',['Vielen Dank! Ich freue mich.|Thank you! I’m happy to be here.','Bis zum Bahnhof, bitte.|To the station, please.','Das kostet zehn Euro.|That costs ten euros.']],['er: Wo ist denn der Keller?|Where is the cellar?',['Unten, die Treppe hinunter.|Downstairs, down the stairs.','Am Montag um neun.|On Monday at nine.','Er ist sehr lecker.|It’s very tasty.']],['sie: Ihr Name steht noch nicht an der Klingel.|Your name isn’t on the doorbell yet.',['Danke, ich mache das heute noch.|Thanks, I’ll do it today.','Die Klingel ist grün.|The doorbell is green.','Ich trinke gern Tee.|I like drinking tea.']],['er: Wann kommt der Umzugswagen?|When is the removal van coming?',['Um zehn Uhr. Er steht schon vor dem Haus.|At ten. It’s already outside.','Im Keller, neben dem Fahrrad.|In the cellar, next to the bike.','Drei Zimmer und ein Bad.|Three rooms and a bathroom.']]]},

{id:'wohnzimmer',title:'Das Wohnzimmer',en:'The living room',focus:'stehen · liegen · hängen',
 story:['Das ist das Wohnzimmer. Hier sitzt man zusammen, liest oder sieht fern.|This is the living room. Here people sit together, read or watch TV.','Im Wohnzimmer gibt es ein Sofa, einen Sessel, einen Couchtisch und ein Regal.|There is a sofa, an armchair, a coffee table and a shelf.','Tippe auf die Möbel und lerne: stehen, liegen, hängen.|Tap the furniture and learn: stand, lie, hang.'],
 hs:{
 _bg:['das Wohnzimmer|the living room','die Wohnzimmer','Das Wohnzimmer ist hell und gemütlich.|The living room is bright and cosy.','Das Wohnzimmer hat ein großes Fenster an der linken Wand.|The living room has a big window on the left wall.','Bei Wohnungen zählt man die Zimmer. Küche und Bad zählt man nicht mit.|Flats are counted by rooms. The kitchen and bathroom don’t count.'],
 fenster:['das Fenster|the window','die Fenster','Durch das Fenster kommt viel Licht.|A lot of light comes through the window.','Das Fenster ist an der linken Wand.|The window is on the left wall.','Stoßlüften: Man öffnet das Fenster ein paar Minuten ganz und macht es dann wieder zu.|Airing: open the window wide for a few minutes, then close it again.'],
 vorhang:['der Vorhang|the curtain','die Vorhänge','Die Vorhänge sind rot.|The curtains are red.','Die Vorhänge hängen links und rechts neben dem Fenster.|The curtains hang to the left and right of the window.','Der Vorhang hängt am Fenster: Wo? Dativ. Ich hänge den Vorhang ans Fenster: Wohin? Akkusativ.|hängen: where? dative. Where to? accusative.'],
 heizung:['die Heizung|the radiator','die Heizungen','Die Heizung ist weiß und warm.|The radiator is white and warm.','Die Heizung ist an der Wand, hinter dem Sofa.|The radiator is on the wall, behind the sofa.','In Mietwohnungen bezahlt man die Heizung oft extra. Das sind die Nebenkosten.|In rented flats heating is often paid extra, as service charges.'],
 lichtschalter:['der Lichtschalter|the light switch','die Lichtschalter','Mit dem Lichtschalter macht man das Licht an und aus.|You turn the light on and off with the switch.','Der Lichtschalter ist an der Wand, neben der Heizung.|The light switch is on the wall next to the radiator.','das Licht anmachen, das Licht ausmachen: Beide Verben sind trennbar.|to turn the light on and off: both verbs are separable.'],
 bild:['das Bild|the picture','die Bilder','Auf dem Bild sieht man Berge und einen See.|The picture shows mountains and a lake.','Das Bild hängt über dem Sofa.|The picture hangs above the sofa.','In Mietwohnungen darf man meistens Löcher für Bilder bohren. Beim Auszug macht man sie wieder zu.|In rented flats you can usually drill holes for pictures, but you fill them when you move out.'],
 regal:['das Regal|the shelf','die Regale','Das Regal ist aus Holz und hat fünf Fächer.|The shelf is made of wood and has five compartments.','Das Regal steht rechts an der Wand, neben der Stehlampe.|The shelf stands against the wall on the right, next to the floor lamp.','Viele Leute kaufen Möbel im Möbelhaus und bauen sie zu Hause selbst auf.|Many people buy furniture at a store and assemble it themselves.'],
 buecher:['das Buch|the book','die Bücher','Im Regal stehen viele bunte Bücher.|There are lots of colourful books on the shelf.','Die Bücher stehen im Regal. Ein Buch steht schief.|The books stand on the shelf. One book is leaning.','Ein Buch steht, wenn es hoch ist. Es liegt, wenn es flach ist.|A book stands when upright and lies when flat.'],
 stehlampe:['die Stehlampe|the floor lamp','die Stehlampen','Die Stehlampe gibt warmes Licht.|The floor lamp gives warm light.','Die Stehlampe steht zwischen dem Sofa und dem Regal.|The floor lamp stands between the sofa and the shelf.','stehen und die Lampe: die Stehlampe. Die Lampe oben heißt Deckenlampe.|The lamp on the ceiling is a Deckenlampe.'],
 sofa:['das Sofa|the sofa','die Sofas','Das Sofa ist blau und bequem.|The sofa is blue and comfortable.','Das Sofa steht an der Wand, unter dem Bild.|The sofa stands against the wall, under the picture.','Man sagt Sofa oder Couch. Beide Wörter sind richtig.|You can say Sofa or Couch.'],
 kissen:['das Kissen|the cushion','die Kissen','Auf dem Sofa liegen zwei Kissen: ein gelbes und ein orangefarbenes.|There are two cushions on the sofa: a yellow one and an orange one.','Die Kissen liegen auf dem Sofa.|The cushions are lying on the sofa.','das Kissen, die Kissen: Wörter auf -en haben im Plural oft keine Endung.|Words ending in -en often have no plural ending.'],
 kommode:['die Kommode|the sideboard','die Kommoden','Die Kommode hat drei Schubladen.|The sideboard has three drawers.','Die Kommode steht an der rechten Wand, unter dem Fernseher.|The sideboard stands against the right wall, under the TV.','In der Schublade liegen oft Kabel, Batterien und Kerzen.|Drawers often hold cables, batteries and candles.'],
 fernseher:['der Fernseher|the TV','die Fernseher','Der Fernseher ist groß und schwarz.|The TV is big and black.','Der Fernseher hängt an der rechten Wand, über der Kommode.|The TV hangs on the right wall, above the sideboard.','In Deutschland zahlt jede Wohnung einen Rundfunkbeitrag für Fernsehen und Radio.|In Germany every household pays a broadcasting fee.'],
 deckenlampe:['die Deckenlampe|the ceiling lamp','die Deckenlampen','Die Deckenlampe ist weiß und rund.|The ceiling lamp is white and round.','Die Deckenlampe hängt in der Mitte an der Decke.|The ceiling lamp hangs from the middle of the ceiling.','Die Decke ist oben im Zimmer. Aber die Decke ist auch das warme Ding zum Zudecken!|Decke is the ceiling, but also a blanket!'],
 teppich:['der Teppich|the rug','die Teppiche','Der Teppich ist rot und hat ein Muster.|The rug is red and has a pattern.','Der Teppich liegt auf dem Boden, vor dem Sofa.|The rug lies on the floor in front of the sofa.','Der Teppich liegt auf dem Boden: Dativ. Ich lege den Teppich auf den Boden: Akkusativ.|liegen + dative, legen + accusative.'],
 couchtisch:['der Couchtisch|the coffee table','die Couchtische','Der Couchtisch ist niedrig und aus Holz.|The coffee table is low and made of wood.','Der Couchtisch steht auf dem Teppich.|The coffee table stands on the rug.','die Couch und der Tisch: der Couchtisch. Der letzte Teil bestimmt den Artikel.|The last part decides the article.'],
 vase:['die Vase|the vase','die Vasen','In der Vase sind bunte Blumen.|There are colourful flowers in the vase.','Die Vase steht auf dem Couchtisch.|The vase stands on the coffee table.','Wenn man eingeladen ist, bringt man oft Blumen mit. Die stellt man in eine Vase.|When invited, people often bring flowers, which go in a vase.'],
 fernbedienung:['die Fernbedienung|the remote control','die Fernbedienungen','Die Fernbedienung ist klein und schwarz.|The remote control is small and black.','Die Fernbedienung liegt auf dem Couchtisch, neben der Vase.|The remote control lies on the coffee table next to the vase.','Mit der Fernbedienung macht man den Fernseher an und aus.|You turn the TV on and off with the remote.'],
 sessel:['der Sessel|the armchair','die Sessel','Der Sessel ist rot und weich.|The armchair is red and soft.','Der Sessel steht rechts vorne, vor der Kommode.|The armchair is at the front right, in front of the sideboard.','Ein Sessel ist für eine Person. Ein Sofa ist für zwei oder drei Personen.|An armchair is for one person, a sofa for two or three.'],
 decke:['die Decke|the blanket','die Decken','Die Decke ist weich und gestreift.|The blanket is soft and striped.','Die Decke liegt auf dem Sessel.|The blanket lies on the armchair.','Achtung: die Decke zum Zudecken und die Decke oben im Zimmer. Ein Wort, zwei Bedeutungen!|Careful: one word, two meanings!'],
 pflanze:['die Zimmerpflanze|the houseplant','die Zimmerpflanzen','Die Zimmerpflanze ist groß und hat grüne Blätter.|The houseplant is big and has green leaves.','Die Pflanze steht vorne links, vor dem Fenster.|The plant is at the front left, in front of the window.','Zimmerpflanzen gießt man ein- oder zweimal pro Woche.|You water houseplants once or twice a week.'],

 wohin:[['buecher','regal','Wohin stellst du die Bücher?|Where do you put the books?','Die Bücher stelle ich ins Regal.|I put the books on the shelf.'],['kissen','sofa','Wohin legst du die Kissen?|Where do you put the cushions?','Die Kissen lege ich aufs Sofa.|I put the cushions on the sofa.'],['vase','couchtisch','Wohin stellst du die Vase?|Where do you put the vase?','Die Vase stelle ich auf den Couchtisch.|I put the vase on the coffee table.'],['decke','sessel','Wohin legst du die Decke?|Where do you put the blanket?','Die Decke lege ich auf den Sessel.|I put the blanket on the armchair.'],['pflanze','fenster','Wohin stellst du die Pflanze? Sie braucht viel Licht.|Where do you put the plant? It needs lots of light.','Die Pflanze stelle ich ans Fenster.|I put the plant by the window.'],['fernbedienung','couchtisch','Wohin legst du die Fernbedienung?|Where do you put the remote control?','Die Fernbedienung lege ich auf den Couchtisch.|I put the remote control on the coffee table.']],
 dlg:[['sie: Wie groß ist das Wohnzimmer?|How big is the living room?',['Ungefähr fünfundzwanzig Quadratmeter.|About twenty-five square metres.','Es ist blau und grün.|It is blue and green.','Am Wochenende.|At the weekend.']],['er: Darf ich mich setzen?|May I sit down?',['Natürlich, setz dich aufs Sofa!|Of course, sit on the sofa!','Nein, das ist mein Fahrrad.|No, that’s my bike.','Ich wohne in Berlin.|I live in Berlin.']],['sie: Möchtest du etwas trinken?|Would you like something to drink?',['Ja, gern ein Glas Wasser.|Yes, a glass of water, please.','Ich lese ein Buch.|I’m reading a book.','Das Regal ist neu.|The shelf is new.']],['er: Die Lampe ist schön! Wo hast du sie gekauft?|The lamp is nice! Where did you buy it?',['Im Möbelhaus. Sie war im Angebot.|At the furniture store. It was on offer.','Seit zwei Jahren.|For two years.','Mit dem Zug.|By train.']],['sie: Kannst du bitte das Fenster aufmachen?|Can you open the window, please?',['Klar, kein Problem.|Sure, no problem.','Das Fenster ist ein Möbelstück.|The window is a piece of furniture.','Ich mache Hausaufgaben.|I’m doing homework.']],['er: Was machst du am Abend?|What do you do in the evening?',['Ich sehe fern oder lese.|I watch TV or read.','Unter dem Tisch.|Under the table.','Fünf Euro.|Five euros.']]]},

{id:'kueche',title:'Die Küche',en:'The kitchen',focus:'Geräte · Wohin + Akkusativ',
 story:['Das ist die Küche. Hier kocht man, isst man und spült ab.|This is the kitchen. Here people cook, eat and wash up.','Viele deutsche Küchen sind Einbauküchen: Herd, Spüle und Schränke sind in einer Reihe.|Many German kitchens are fitted kitchens: cooker, sink and cupboards in a row.','Unter der Spüle ist der Mülleimer mit drei Fächern für die Mülltrennung.|Under the sink is the bin with three compartments for sorting waste.'],
 hs:{
 _bg:['die Küche|the kitchen','die Küchen','Die Küche ist hell und hat Fliesen auf dem Boden.|The kitchen is bright and has tiles on the floor.','In der Küche stehen ein Tisch und zwei Stühle.|There is a table with two chairs in the kitchen.','Wenn man umzieht, nimmt man in Deutschland die Küche oft mit!|In Germany people often take their kitchen with them when they move!'],
 tuer:['die Tür|the door','die Türen','Die Tür ist aus Holz und hat einen Griff.|The door is wooden and has a handle.','Die Tür ist an der linken Wand.|The door is on the left wall.','die Tür aufmachen, die Tür zumachen: Beide Verben sind trennbar.|to open and close the door: both verbs are separable.'],
 kuehlschrank:['der Kühlschrank|the fridge','die Kühlschränke','Der Kühlschrank ist groß und weiß. Oben ist das Gefrierfach.|The fridge is big and white. At the top is the freezer.','Der Kühlschrank steht links in der Ecke.|The fridge stands in the corner on the left.','Im Kühlschrank sind es etwa sieben Grad. Im Gefrierfach sind es minus achtzehn Grad.|It’s about seven degrees in the fridge and minus eighteen in the freezer.'],
 schrank:['der Hängeschrank|the wall cupboard','die Hängeschränke','In den Hängeschränken sind Teller, Tassen und Gläser.|Plates, cups and glasses are in the wall cupboards.','Die Hängeschränke hängen oben an der Wand.|The wall cupboards hang high on the wall.','hängen und der Schrank: der Hängeschrank. Unten stehen die Unterschränke.|The lower cupboards are Unterschränke.'],
 fenster:['das Fenster|the window','die Fenster','Auf der Fensterbank steht ein Topf mit Kräutern.|A pot of herbs is on the windowsill.','Das Fenster ist über der Spüle.|The window is above the sink.','Beim Kochen öffnet man das Fenster oder macht die Dunstabzugshaube an.|When cooking, open the window or turn on the cooker hood.'],
 spuele:['die Spüle|the sink','die Spülen','In der Spüle wäscht man das Geschirr ab.|You wash the dishes in the sink.','Die Spüle ist unter dem Fenster.|The sink is under the window.','spülen heißt abwaschen. Die Spülmaschine spült für dich!|spülen means to wash up. The dishwasher does it for you!'],
 wasserhahn:['der Wasserhahn|the tap','die Wasserhähne','Aus dem Wasserhahn kommt kaltes und warmes Wasser.|Cold and warm water come out of the tap.','Der Wasserhahn ist an der Spüle.|The tap is on the sink.','Das Leitungswasser in Deutschland kann man trinken. Es wird sehr gut kontrolliert.|You can drink tap water in Germany. It is checked very carefully.'],
 spuelmaschine:['die Spülmaschine|the dishwasher','die Spülmaschinen','Die Spülmaschine wäscht die Teller und Tassen.|The dishwasher washes the plates and cups.','Die Spülmaschine ist unter der Arbeitsplatte, links neben dem Mülleimer.|The dishwasher is under the worktop, to the left of the bin.','Man sagt Spülmaschine oder Geschirrspüler. Beides ist richtig.|You can say Spülmaschine or Geschirrspüler.'],
 muelleimer:['der Mülleimer|the bin','die Mülleimer','Der Mülleimer hat drei Fächer: gelb, braun und grau.|The bin has three compartments: yellow, brown and grey.','Der Mülleimer ist im Schrank unter der Spüle.|The bin is in the cupboard under the sink.','Gelb ist für Verpackungen, braun für Bioabfall und grau für Restmüll.|Yellow is for packaging, brown for organic waste and grey for other rubbish.'],
 herd:['der Herd|the cooker','die Herde','Der Herd hat vier Kochplatten.|The cooker has four rings.','Der Herd ist rechts neben dem Wasserkocher.|The cooker is to the right of the kettle.','Ein Herd aus Glas heißt Ceranfeld. Man darf ihn nicht mit Metall kratzen.|A glass hob is called a Ceranfeld. Don’t scratch it with metal.'],
 pfanne:['die Pfanne|the frying pan','die Pfannen','In der Pfanne sind zwei Spiegeleier.|There are two fried eggs in the pan.','Die Pfanne steht auf dem Herd.|The pan is on the cooker.','Das Spiegelei heißt so, weil das Ei aussieht wie ein kleiner Spiegel.|A fried egg is called a mirror egg because it looks like a little mirror.'],
 backofen:['der Backofen|the oven','die Backöfen','Im Backofen backt man Kuchen, Brot oder Pizza.|You bake cake, bread or pizza in the oven.','Der Backofen ist unter dem Herd.|The oven is under the cooker.','Der Backofen braucht viel Strom. Darum soll man ihn nicht zu lange vorheizen.|The oven uses a lot of electricity, so don’t preheat it too long.'],
 dunstabzug:['die Dunstabzugshaube|the cooker hood','die Dunstabzugshauben','Die Dunstabzugshaube saugt den Dampf ab.|The cooker hood draws away the steam.','Die Dunstabzugshaube hängt über dem Herd.|The cooker hood hangs above the cooker.','Ein langes Wort: der Dunst, der Abzug und die Haube. Der Artikel kommt vom letzten Wort.|A long compound: the article comes from the last word.'],
 mikrowelle:['die Mikrowelle|the microwave','die Mikrowellen','Mit der Mikrowelle macht man Essen schnell warm.|You heat food quickly in the microwave.','Die Mikrowelle steht links auf der Arbeitsplatte.|The microwave is on the left on the worktop.','In die Mikrowelle darf kein Metall. Das ist gefährlich!|No metal in the microwave. That’s dangerous!'],
 wasserkocher:['der Wasserkocher|the kettle','die Wasserkocher','Der Wasserkocher ist rot.|The kettle is red.','Der Wasserkocher steht zwischen dem Geschirr und dem Herd.|The kettle is between the dishes and the cooker.','Mit dem Wasserkocher kocht man Wasser für Tee. Das spart Strom.|Boil tea water in the kettle. It saves electricity.'],
 geschirr:['das Geschirr|the dishes','','Die sauberen Teller stehen im Abtropfgitter.|The clean plates stand in the drying rack.','Das Geschirr steht rechts neben der Spüle.|The dishes are to the right of the sink.','Geschirr ist ein Sammelwort für Teller, Tassen und Schüsseln. Es hat keinen Plural.|Geschirr is a collective word with no plural.'],
 toaster:['der Toaster|the toaster','die Toaster','Im Toaster wird das Brot knusprig.|In the toaster the bread gets crispy.','Der Toaster steht rechts auf der Arbeitsplatte.|The toaster is on the right on the worktop.','Manche Wörter sind im Deutschen und Englischen gleich: der Toaster, der Computer, das Baby.|Some words are the same in German and English.'],
 gewuerze:['das Gewürz|the spice','die Gewürze','Im Gewürzregal stehen fünf Gläser.|There are five jars on the spice rack.','Das Gewürzregal hängt an der rechten Wand.|The spice rack hangs on the right wall.','Salz und Pfeffer findet man in jeder deutschen Küche.|Salt and pepper are in every German kitchen.'],
 tisch:['der Tisch|the table','die Tische','Der Tisch ist aus Holz.|The table is made of wood.','Der Tisch steht rechts vorne in der Küche.|The table is at the front right of the kitchen.','den Tisch decken: Teller, Besteck und Gläser auf den Tisch stellen.|to set the table: put plates, cutlery and glasses on the table.'],
 stuhl:['der Stuhl|the chair','die Stühle','Am Tisch stehen zwei Stühle.|There are two chairs at the table.','Die Stühle stehen hinter dem Tisch.|The chairs are behind the table.','der Stuhl, die Stühle: Im Plural kommt ein Umlaut dazu.|In the plural an umlaut is added.'],

 gipfelkreuz:['das Gipfelkreuz|the summit cross','die Gipfelkreuze','Auf dem Gipfel steht ein Kreuz aus Holz.|There is a wooden cross on the summit.','Ein Gipfelkreuz ist ein Kreuz, das auf dem höchsten Punkt eines Berges steht.|A summit cross is a cross that stands on the highest point of a mountain.','Am Gipfelkreuz liegt oft ein Gipfelbuch, in das sich die Wanderer eintragen.|There is often a summit book at the cross in which hikers write their names.'],
 gletscher:['der Gletscher|the glacier','die Gletscher','Der Gletscher ist eine dicke Schicht aus uraltem Eis.|The glacier is a thick layer of ancient ice.','Ein Gletscher ist eine große Masse aus Eis, die sich langsam den Berg hinunter bewegt.|A glacier is a large mass of ice that slowly moves down the mountain.','Wegen des Klimawandels werden die Gletscher in den Alpen jedes Jahr kleiner.|Because of climate change, the glaciers in the Alps get smaller every year.'],
 seilbahn:['die Seilbahn|the cable car','die Seilbahnen','Die rote Gondel fährt bis zur Bergstation hinauf.|The red gondola goes up to the mountain station.','Eine Seilbahn ist eine Bahn, die an einem Seil hängt und Menschen auf den Berg bringt.|A cable car is a railway that hangs on a cable and takes people up the mountain.','Wer nicht laufen möchte, fährt mit der Seilbahn. Die Fahrt dauert oft nur wenige Minuten.|If you don’t want to walk, take the cable car. The ride often lasts only a few minutes.'],
 huette:['die Berghütte|the mountain hut','die Berghütten','Die Hütte hat einen Balkon mit roten Blumen und eine sonnige Terrasse.|The hut has a balcony with red flowers and a sunny terrace.','Eine Berghütte ist ein Haus in den Bergen, in dem Wanderer essen und übernachten können.|A mountain hut is a house in the mountains where hikers can eat and stay overnight.','In vielen Hütten schläft man im Matratzenlager, also mit vielen Leuten in einem Raum.|In many huts you sleep in a dormitory, with many people in one room.'],
 see:['der Bergsee|the mountain lake','die Bergseen','Im klaren Wasser des Sees spiegeln sich die Berge.|The mountains are reflected in the clear water of the lake.','Ein Bergsee ist ein See, der hoch oben in den Bergen liegt.|A mountain lake is a lake that lies high up in the mountains.','Bergseen sind auch im Sommer sehr kalt, weil ihr Wasser vom Schnee kommt.|Mountain lakes are very cold even in summer because their water comes from the snow.'],
 wasserfall:['der Wasserfall|the waterfall','die Wasserfälle','Der Wasserfall stürzt über die Felsen in den See.|The waterfall plunges over the rocks into the lake.','Ein Wasserfall ist eine Stelle, an der Wasser fast senkrecht nach unten fällt.|A waterfall is a place where water falls almost straight down.','Das Wasser fällt mit so viel Kraft, dass man es schon von Weitem hört.|The water falls with such force that you can hear it from far away.'],
 wald:['der Nadelwald|the conifer forest','die Nadelwälder','An den Hängen wachsen dunkle Tannen und Fichten.|Dark firs and spruces grow on the slopes.','Ein Nadelwald ist ein Wald, in dem Bäume mit Nadeln statt Blättern wachsen.|A conifer forest is a forest in which trees with needles instead of leaves grow.','Der Bergwald schützt die Dörfer im Tal vor Lawinen.|The mountain forest protects the villages in the valley from avalanches.'],
 wanderweg:['der Wanderweg|the hiking trail','die Wanderwege','Der Weg führt am See vorbei bis zur Hütte.|The trail leads past the lake to the hut.','Ein Wanderweg ist ein Weg, der für Wanderer markiert ist.|A hiking trail is a path that is marked for hikers.','Man sollte auf den markierten Wegen bleiben, damit man sich nicht verläuft.|You should stay on the marked trails so that you don’t get lost.'],
 wegweiser:['der Wegweiser|the signpost','die Wegweiser','Auf den gelben Schildern steht, wie lange man bis zum Ziel braucht.|The yellow signs say how long it takes to reach the destination.','Ein Wegweiser ist ein Schild, das zeigt, in welche Richtung man gehen muss.|A signpost is a sign that shows which direction you have to go.','In den Alpen steht auf den Schildern meistens keine Entfernung, sondern die Gehzeit.|In the Alps the signs usually show the walking time, not the distance.'],
 rucksack:['der Rucksack|the backpack','die Rucksäcke','Der Rucksack lehnt am Wegweiser, an der Seite steckt eine Trinkflasche.|The backpack leans against the signpost, with a water bottle at the side.','Ein Rucksack ist eine Tasche, die man auf dem Rücken trägt.|A backpack is a bag that you carry on your back.','In den Rucksack gehören Wasser, eine Regenjacke, Sonnencreme und ein Erste-Hilfe-Set.|Water, a rain jacket, sun cream and a first-aid kit belong in the backpack.'],
 kuh:['die Kuh|the cow','die Kühe','Die Kühe grasen auf der Alm und tragen große Glocken.|The cows graze on the alpine pasture and wear big bells.','Eine Alm ist eine Wiese in den Bergen, auf der die Kühe im Sommer leben.|An Alm is a mountain meadow where the cows live in summer.','Im Herbst werden die geschmückten Kühe ins Tal gebracht. Das nennt man Almabtrieb.|In autumn the decorated cows are brought down to the valley. This is called the Almabtrieb.'],
 murmeltier:['das Murmeltier|the marmot','die Murmeltiere','Das Murmeltier sitzt aufrecht auf einem Felsen und beobachtet uns.|The marmot sits upright on a rock and watches us.','Ein Murmeltier ist ein Tier, das in den Bergen lebt und laut pfeift, wenn Gefahr droht.|A marmot is an animal that lives in the mountains and whistles loudly when there is danger.','Murmeltiere halten bis zu sechs Monate Winterschlaf.|Marmots hibernate for up to six months.'],
 adler:['der Adler|the eagle','die Adler','Der Adler kreist hoch über den Gipfeln.|The eagle circles high above the summits.','Ein Adler ist ein großer Greifvogel, der sehr gut sieht und andere Tiere jagt.|An eagle is a large bird of prey that sees very well and hunts other animals.','Der Adler ist das Wappentier Deutschlands. Man sieht ihn zum Beispiel auf den Euromünzen.|The eagle is Germany’s heraldic animal. You see it on the euro coins, for example.'],
 enzian:['der Enzian|the gentian','die Enziane','Der Enzian blüht leuchtend blau zwischen den Gräsern.|The gentian blooms bright blue among the grasses.','Der Enzian ist eine Blume, die vor allem in den Alpen wächst.|Gentian is a flower that grows mainly in the Alps.','Viele Alpenblumen stehen unter Naturschutz. Man darf sie nicht pflücken.|Many alpine flowers are protected. You must not pick them.'],
 wanderin:['die Wanderin|the hiker','die Wanderinnen','Die Wanderin trägt einen Sonnenhut und Wanderstöcke.|The hiker wears a sun hat and uses walking poles.','Eine Wanderin ist eine Frau, die in ihrer Freizeit gern lange Strecken zu Fuß geht.|A hiker is a woman who likes walking long distances in her free time.','Obwohl die Sonne scheint, hat sie eine Regenjacke dabei. Das Wetter in den Bergen ändert sich schnell.|Although the sun is shining, she has a rain jacket with her. Mountain weather changes quickly.'],
 wanderer:['der Wanderer|the hiker','die Wanderer','Der Wanderer hat einen großen Rucksack und feste Schuhe.|The hiker has a big backpack and sturdy shoes.','Wanderschuhe sind feste Schuhe, mit denen man auf steinigen Wegen nicht umknickt.|Hiking boots are sturdy shoes with which you don’t twist your ankle on stony paths.','Vor einer Tour sollte man den Wetterbericht lesen und jemandem sagen, wohin man geht.|Before a tour you should check the weather report and tell someone where you are going.'],
 },
 luecke:[['Weil wir müde waren, sind wir mit der ___ auf den Berg gefahren.|Because we were tired, we took the ___ up the mountain.','Seilbahn','seilbahn'],['Am Abend haben wir in einer ___ übernachtet.|In the evening we stayed overnight in a ___.','Berghütte','huette'],['Auf dem ___ stand ein großes Kreuz aus Holz.|There was a big wooden cross on the ___.','Gipfel','gipfel gipfelkreuz'],['Das Wasser im ___ war so kalt, dass niemand schwimmen wollte.|The water in the ___ was so cold that nobody wanted to swim.','Bergsee','see'],['Die ___ tragen große Glocken um den Hals.|The ___ wear big bells around their necks.','Kühe','kuh'],['Auf dem gelben ___ steht, dass wir noch zwei Stunden laufen müssen.|The yellow ___ says we still have to walk for two hours.','Wegweiser','wegweiser'],['Ein ___ ist eine riesige Masse aus Eis, die langsam schmilzt.|A ___ is a huge mass of ice that is slowly melting.','Gletscher','gletscher']],
 satz:['Wir wandern zur Hütte, / weil / das Wetter / heute / schön / ist.|We hike to the hut because the weather is nice today.','Obwohl / es / regnet, / gehen / wir / auf den Gipfel.|Although it is raining, we go up to the summit.','Wir nehmen / eine Regenjacke / mit, / damit / wir / nicht nass werden.|We take a rain jacket so that we don’t get wet.','Wenn / ich / mehr Zeit hätte, / würde / ich / länger / bleiben.|If I had more time, I would stay longer.','Das ist / der See, / in dem / wir / gestern / geschwommen sind.|That is the lake in which we swam yesterday.'],
 quiz:[['Wie heißt der höchste Berg Deutschlands?|What is Germany’s highest mountain called?',['die Zugspitze|the Zugspitze','der Brocken|the Brocken','der Feldberg|the Feldberg'],'Die Zugspitze ist 2962 Meter hoch und liegt in Bayern.|The Zugspitze is 2962 metres high and lies in Bavaria.'],['Was macht ein Murmeltier, wenn Gefahr droht?|What does a marmot do when there is danger?',['Es pfeift laut.|It whistles loudly.','Es singt ein Lied.|It sings a song.','Es klettert auf einen Baum.|It climbs a tree.'],'Mit einem lauten Pfiff warnt es die anderen Murmeltiere.|With a loud whistle it warns the other marmots.'],['Was steht meistens auf den Wegweisern in den Alpen?|What is usually written on the signposts in the Alps?',['die Gehzeit|the walking time','der Preis|the price','eine Telefonnummer|a phone number'],'Man liest, wie viele Stunden oder Minuten man noch gehen muss.|You read how many hours or minutes you still have to walk.'],['Was bedeutet „Almabtrieb“?|What does “Almabtrieb” mean?',['Die Kühe kommen im Herbst ins Tal.|The cows come down to the valley in autumn.','Man fährt Ski.|People go skiing.','Man kauft Käse.|People buy cheese.'],'Im Herbst werden die geschmückten Kühe von der Alm ins Tal gebracht.|In autumn the decorated cows are brought down from the pasture.'],['Warum werden die Gletscher kleiner?|Why are the glaciers getting smaller?',['wegen des Klimawandels|because of climate change','wegen der Kühe|because of the cows','wegen der Seilbahn|because of the cable car'],'Durch die steigenden Temperaturen schmilzt jedes Jahr mehr Eis.|Rising temperatures melt more ice every year.'],['Wo schläft man in vielen Berghütten?|Where do you sleep in many mountain huts?',['im Matratzenlager|in a dormitory','im Zelt|in a tent','im Auto|in the car'],'Im Matratzenlager schlafen viele Wanderer zusammen in einem Raum.|In a dormitory many hikers sleep together in one room.']]},

{id:'meer',title:'An der Ostsee',en:'At the Baltic Sea',focus:'Konjunktiv II · Präteritum',
 story:['Die Ostsee liegt im Norden von Deutschland. Anders als an der Nordsee gibt es hier kaum Ebbe und Flut.|The Baltic Sea is in the north of Germany. Unlike the North Sea, there is hardly any tide here.','Im Sommer kommen viele Urlauber, um zu baden, zu segeln oder einfach im Strandkorb zu entspannen.|In summer many holidaymakers come to swim, sail or simply relax in a beach chair.','Typisch für die Ostseebäder sind lange Seebrücken und rot-weiße Leuchttürme.|Long piers and red-and-white lighthouses are typical of the Baltic resorts.'],
 hs:{
 _bg:['der Strand|the beach','die Strände','Der Sand ist fein und warm.|The sand is fine and warm.','Ein Strand ist ein Ufer aus Sand, an dem man liegen und baden kann.|A beach is a sandy shore where you can lie and swim.','An vielen Stränden bezahlt man im Sommer eine Kurtaxe.|At many beaches you pay a visitor’s tax in summer.'],
 meer:['die Ostsee|the Baltic Sea','','Das Wasser glitzert in der Sonne.|The water glitters in the sun.','Die Ostsee ist ein Meer, das zwischen Deutschland, Skandinavien und dem Baltikum liegt.|The Baltic is a sea that lies between Germany, Scandinavia and the Baltic states.','Die Ostsee hat weniger Salz als die Nordsee. Deshalb schmeckt das Wasser nicht so salzig.|The Baltic has less salt than the North Sea, so the water doesn’t taste as salty.'],
 welle:['die Welle|the wave','die Wellen','Die Wellen rollen sanft an den Strand.|The waves roll gently onto the beach.','Eine Welle ist Wasser, das sich durch den Wind auf und ab bewegt.|A wave is water that moves up and down because of the wind.','Wenn eine rote Flagge weht, ist das Baden wegen starker Wellen verboten.|When a red flag flies, swimming is forbidden because of strong waves.'],
 seebruecke:['die Seebrücke|the pier','die Seebrücken','Die Seebrücke führt weit hinaus aufs Meer.|The pier leads far out to sea.','Eine Seebrücke ist eine lange Brücke, die vom Strand ins Meer hinausführt.|A pier is a long bridge that leads from the beach out into the sea.','Früher legten an den Seebrücken Schiffe mit Badegästen an. Heute spaziert man dort.|In the past ships with holidaymakers docked at the piers. Today people stroll there.'],
 leuchtturm:['der Leuchtturm|the lighthouse','die Leuchttürme','Der Leuchtturm ist rot und weiß gestreift.|The lighthouse has red and white stripes.','Ein Leuchtturm ist ein Turm, dessen Licht den Schiffen nachts den Weg zeigt.|A lighthouse is a tower whose light shows ships the way at night.','Manche Leuchttürme kann man besteigen. Von oben hat man einen herrlichen Blick.|You can climb some lighthouses. From the top the view is wonderful.'],
 segelboot:['das Segelboot|the sailing boat','die Segelboote','Das Boot gleitet mit zwei Segeln über das Wasser.|The boat glides across the water with two sails.','Ein Segelboot ist ein Boot, das vom Wind angetrieben wird.|A sailing boat is a boat that is driven by the wind.','Kiel ist berühmt für die Kieler Woche, ein großes Segelfest im Juni.|Kiel is famous for Kiel Week, a big sailing festival in June.'],
 moewe:['die Möwe|the seagull','die Möwen','Die Möwen fliegen kreischend über den Strand.|The gulls fly screeching over the beach.','Eine Möwe ist ein Seevogel, der gern Fisch frisst.|A gull is a seabird that likes eating fish.','Vorsicht mit Fischbrötchen! Möwen klauen manchmal das Essen direkt aus der Hand.|Careful with fish rolls! Gulls sometimes steal food right out of your hand.'],
 strandkorb:['der Strandkorb|the beach chair','die Strandkörbe','In einem der Strandkörbe sitzt eine Frau und liest.|A woman sits reading in one of the beach chairs.','Ein Strandkorb ist ein Sitz aus Korb mit einem Dach, das vor Wind und Sonne schützt.|A beach chair is a wicker seat with a roof that protects against wind and sun.','Der Strandkorb wurde 1882 in Rostock erfunden. Man kann ihn für einen Tag mieten.|The beach chair was invented in Rostock in 1882. You can rent one for a day.'],
 duene:['die Düne|the dune','die Dünen','Auf der Düne wächst hartes Gras.|Tough grass grows on the dune.','Eine Düne ist ein Hügel aus Sand, den der Wind aufgeschüttet hat.|A dune is a hill of sand that the wind has piled up.','Die Dünen schützen das Land vor dem Meer. Deshalb darf man sie nicht betreten.|The dunes protect the land from the sea. That’s why you mustn’t walk on them.'],
 kiosk:['der Fischbrötchenstand|the fish roll stand','die Fischbrötchenstände','Am Stand gibt es Brötchen mit Hering, Lachs oder Krabben.|The stand sells rolls with herring, salmon or shrimps.','Ein Fischbrötchen ist ein Brötchen, das mit Fisch belegt ist.|A fish roll is a bread roll that is topped with fish.','Wer an der Ostsee ist, sollte unbedingt ein Fischbrötchen probieren.|Anyone at the Baltic should definitely try a fish roll.'],
 sandburg:['die Sandburg|the sandcastle','die Sandburgen','Die Sandburg hat drei Türme und eine kleine Fahne.|The sandcastle has three towers and a little flag.','Eine Sandburg ist eine Burg, die Kinder am Strand aus nassem Sand bauen.|A sandcastle is a castle that children build from wet sand on the beach.','Mit nassem Sand hält die Burg besser, weil das Wasser die Körner zusammenklebt.|With wet sand the castle holds better because the water sticks the grains together.'],
 kind:['das Kind|the child','die Kinder','Das Kind hat die Sandburg gebaut und ist stolz darauf.|The child built the sandcastle and is proud of it.','Ein Kind ist ein junger Mensch, der noch nicht erwachsen ist.|A child is a young person who is not yet grown up.','Wäre das Wetter schlecht, würde das Kind lieber ins Schwimmbad gehen.|If the weather were bad, the child would rather go to the swimming pool.'],
 eimer:['der Eimer|the bucket','die Eimer','Neben dem Eimer liegt eine gelbe Schaufel.|A yellow spade lies next to the bucket.','Ein Eimer ist ein Gefäß mit einem Griff, in dem man Wasser oder Sand trägt.|A bucket is a container with a handle in which you carry water or sand.','Eimer und Schaufel sind die wichtigsten Spielsachen am Strand.|A bucket and spade are the most important beach toys.'],
 muschel:['die Muschel|the shell','die Muscheln','Am Strand liegen bunte Muscheln.|Colourful shells lie on the beach.','Eine Muschel ist die harte Schale, in der ein kleines Meerestier lebt.|A shell is the hard case in which a small sea creature lives.','An der Ostsee findet man mit etwas Glück auch Bernstein, ein goldgelbes, sehr altes Harz.|With a bit of luck you can also find amber on the Baltic, a golden, very old resin.'],
 qualle:['die Qualle|the jellyfish','die Quallen','Die Qualle liegt durchsichtig im nassen Sand.|The jellyfish lies see-through on the wet sand.','Eine Qualle ist ein Meerestier, das fast nur aus Wasser besteht.|A jellyfish is a sea creature that consists almost entirely of water.','Die meisten Quallen in der Ostsee sind harmlos, trotzdem sollte man sie nicht anfassen.|Most jellyfish in the Baltic are harmless, but you still shouldn’t touch them.'],
 rettungsturm:['der Rettungsturm|the lifeguard tower','die Rettungstürme','Vom Turm aus beobachten die Rettungsschwimmer das Wasser.|The lifeguards watch the water from the tower.','Ein Rettungsschwimmer ist jemand, der Menschen hilft, die beim Baden in Gefahr geraten.|A lifeguard is someone who helps people who get into danger while swimming.','Die gelb-rote Flagge bedeutet: Der Strand wird bewacht und man darf baden.|The yellow and red flag means the beach is guarded and swimming is allowed.'],
 },
 luecke:[['Am Nachmittag haben wir einen ___ gemietet und gelesen.|In the afternoon we rented a ___ and read.','Strandkorb','strandkorb'],['Wir sind über die lange ___ bis weit aufs Meer hinausgegangen.|We walked along the long ___ far out to sea.','Seebrücke','seebruecke'],['Nachts zeigt der ___ den Schiffen den Weg.|At night the ___ shows ships the way.','Leuchtturm','leuchtturm'],['Eine freche ___ hat mir mein Fischbrötchen geklaut!|A cheeky ___ stole my fish roll!','Möwe','moewe'],['Die Kinder haben eine ___ mit drei Türmen gebaut.|The children built a ___ with three towers.','Sandburg','sandburg kind'],['Man darf die ___ nicht betreten, weil sie das Land schützen.|You mustn’t walk on the ___ because they protect the land.','Dünen','duene']],
 satz:['Wenn / ich / mehr Urlaub / hätte, / würde / ich / an die Ostsee fahren.|If I had more holiday, I would go to the Baltic Sea.','Gestern / saßen / wir / den ganzen Tag / im Strandkorb.|Yesterday we sat in the beach chair all day.','Das ist / der Leuchtturm, / den / wir / gestern / besichtigt haben.|That is the lighthouse that we visited yesterday.','Wir haben / Sonnencreme / mitgenommen, / damit / wir / keinen Sonnenbrand bekommen.|We took sun cream so that we don’t get sunburnt.','Obwohl / das Wasser / kalt / war, / sind / wir / geschwommen.|Although the water was cold, we swam.'],
 quiz:[['Wo wurde der Strandkorb erfunden?|Where was the beach chair invented?',['in Rostock|in Rostock','in München|in Munich','in Köln|in Cologne'],'Der erste Strandkorb wurde 1882 in Rostock gebaut.|The first beach chair was built in Rostock in 1882.'],['Warum darf man die Dünen nicht betreten?|Why may you not walk on the dunes?',['Sie schützen das Land.|They protect the land.','Sie sind zu heiß.|They are too hot.','Dort wohnen Möwen.|Gulls live there.'],'Die Dünen sind ein natürlicher Schutz gegen Sturmfluten.|The dunes are a natural protection against storm floods.'],['Was ist Bernstein?|What is amber?',['ein sehr altes Harz|a very old resin','ein Fisch|a fish','ein Boot|a boat'],'Bernstein ist versteinertes Harz von Bäumen und Millionen Jahre alt.|Amber is fossilised tree resin and millions of years old.'],['Was bedeutet eine rote Flagge am Strand?|What does a red flag on the beach mean?',['Baden verboten|No swimming','Hier gibt es Eis|Ice cream here','Hier ist ein Kiosk|There is a kiosk here'],'Bei einer roten Flagge ist das Baden zu gefährlich.|With a red flag, swimming is too dangerous.'],['Was ist typisch für die Ostsee im Vergleich zur Nordsee?|What is typical of the Baltic compared with the North Sea?',['kaum Ebbe und Flut|hardly any tide','mehr Salz|more salt','wärmeres Wasser im Winter|warmer water in winter'],'In der Ostsee gibt es fast keine Gezeiten.|There are almost no tides in the Baltic.'],['Was ist die Kieler Woche?|What is Kiel Week?',['ein großes Segelfest|a big sailing festival','eine Schulwoche|a school week','ein Fischmarkt|a fish market'],'Die Kieler Woche ist eines der größten Segelfeste der Welt.|Kiel Week is one of the biggest sailing festivals in the world.']]},

{id:'altstadt',title:'In der Altstadt',en:'In the old town',focus:'Passiv · Genitiv · dass-Sätze',
 story:['Viele deutsche Städte haben eine Altstadt mit engen Gassen, Fachwerkhäusern und einem Marktplatz.|Many German towns have an old town with narrow lanes, half-timbered houses and a market square.','Bei einer Stadtführung erfährt man, wann die Häuser gebaut wurden und wer früher darin wohnte.|On a city tour you learn when the houses were built and who used to live in them.','Danach kann man in einem Straßencafé sitzen und die Atmosphäre genießen.|Afterwards you can sit in a street café and enjoy the atmosphere.'],
 hs:{
 _bg:['der Marktplatz|the market square','die Marktplätze','Der Marktplatz ist mit alten Steinen gepflastert.|The market square is paved with old stones.','Ein Marktplatz ist ein großer Platz in der Mitte einer Stadt, auf dem früher Markt war.|A market square is a large square in the middle of a town where the market used to be held.','Das Kopfsteinpflaster ist oft mehrere hundert Jahre alt. Mit hohen Schuhen läuft man hier schlecht.|The cobblestones are often several hundred years old. It’s hard to walk on them in high heels.'],
 dom:['der Dom|the cathedral','die Dome','Hinter den Dächern sieht man die zwei Türme des Doms.|Behind the roofs you can see the cathedral’s two towers.','Ein Dom ist eine große, wichtige Kirche, in der oft ein Bischof seinen Sitz hat.|A cathedral is a large, important church which is often the seat of a bishop.','Am Kölner Dom wurde über 600 Jahre lang gebaut.|Cologne Cathedral was under construction for over 600 years.'],
 rathaus:['das Rathaus|the town hall','die Rathäuser','Das Rathaus hat einen Giebel mit Stufen und einen kleinen Turm.|The town hall has a stepped gable and a small tower.','Ein Rathaus ist das Gebäude, in dem die Stadtverwaltung arbeitet.|A town hall is the building in which the town administration works.','In vielen Rathäusern kann man auch heiraten, weil dort das Standesamt ist.|In many town halls you can also get married because the registry office is there.'],
 uhr:['die Rathausuhr|the town hall clock','die Rathausuhren','Die Uhr zeigt kurz vor zwölf.|The clock shows just before twelve.','Eine Turmuhr ist eine große Uhr, die man von Weitem sehen kann.|A tower clock is a big clock that you can see from far away.','Bei manchen Rathausuhren tanzen zu jeder vollen Stunde Figuren, zum Beispiel in München.|At some town hall clocks figures dance every hour, for example in Munich.'],
 fachwerkhaus:['das Fachwerkhaus|the half-timbered house','die Fachwerkhäuser','Die Holzbalken der Häuser sind dunkelbraun.|The wooden beams of the houses are dark brown.','Ein Fachwerkhaus ist ein Haus, dessen Wände aus Holzbalken und Lehm gebaut sind.|A half-timbered house is a house whose walls are built from wooden beams and clay.','Viele Fachwerkhäuser wurden vor über 400 Jahren gebaut und werden heute sorgfältig restauriert.|Many half-timbered houses were built over 400 years ago and are carefully restored today.'],
 souvenir:['der Souvenirladen|the souvenir shop','die Souvenirläden','Vor dem Laden steht ein Ständer mit Postkarten.|There is a postcard stand in front of the shop.','Ein Souvenir ist ein kleines Geschenk, das an eine Reise erinnert.|A souvenir is a small gift that reminds you of a trip.','Beliebte Souvenirs sind Postkarten, Magnete und Spezialitäten aus der Region.|Popular souvenirs are postcards, magnets and regional specialities.'],
 cafe:['das Straßencafé|the street café','die Straßencafés','Vor dem Café stehen Tische unter Sonnenschirmen.|In front of the café there are tables under parasols.','Ein Straßencafé ist ein Café, das seine Tische draußen auf die Straße stellt.|A street café is a café that puts its tables outside on the street.','Kaffee und Kuchen am Nachmittag ist in Deutschland eine alte Tradition.|Coffee and cake in the afternoon is an old tradition in Germany.'],
 kellner:['der Kellner|the waiter','die Kellner','Der Kellner bringt ein Tablett mit einer Tasse.|The waiter brings a tray with a cup.','Ein Kellner ist jemand, der in einem Restaurant oder Café das Essen bringt.|A waiter is someone who brings the food in a restaurant or café.','Man bezahlt meistens am Tisch und gibt etwa zehn Prozent Trinkgeld.|You usually pay at the table and tip about ten percent.'],
 info:['die Touristeninformation|the tourist information','die Touristeninformationen','Am Haus hängt ein grünes Schild mit einem „i“.|A green sign with an “i” hangs on the building.','Eine Touristeninformation ist ein Büro, in dem Besucher Stadtpläne und Tipps bekommen.|A tourist information is an office where visitors get maps and tips.','Dort kann man auch Stadtführungen buchen, oft sogar auf Englisch.|You can also book city tours there, often even in English.'],
 tor:['das Stadttor|the city gate','die Stadttore','Durch das alte Tor kommt man in die Altstadt.|You enter the old town through the old gate.','Ein Stadttor ist ein Tor in der Stadtmauer, durch das man früher in die Stadt kam.|A city gate is a gate in the town wall through which you used to enter the town.','Im Mittelalter wurden die Stadttore nachts geschlossen, damit keine Feinde hereinkamen.|In the Middle Ages the gates were closed at night so that no enemies could get in.'],
 brunnen:['der Brunnen|the fountain','die Brunnen','Aus dem Brunnen sprudelt Wasser in ein großes Becken.|Water bubbles from the fountain into a big basin.','Ein Brunnen ist ein Ort, an dem Wasser aus der Erde oder aus einer Leitung kommt.|A fountain is a place where water comes out of the ground or a pipe.','Früher holten die Menschen ihr Wasser am Brunnen. Heute ist er ein beliebter Treffpunkt.|People used to fetch their water at the fountain. Today it is a popular meeting place.'],
 laterne:['die Laterne|the street lamp','die Laternen','Die alte Laterne hat ein schwarzes Gestell.|The old street lamp has a black frame.','Eine Laterne ist eine Lampe, die nachts die Straße beleuchtet.|A street lamp is a lamp that lights the street at night.','Früher wurden die Laternen mit Gas betrieben und jeden Abend von Hand angezündet.|In the past the lamps ran on gas and were lit by hand every evening.'],
 tauben:['die Taube|the pigeon','die Tauben','Drei Tauben suchen Krümel zwischen den Steinen.|Three pigeons look for crumbs between the stones.','Eine Taube ist ein grauer Vogel, der oft in Städten lebt.|A pigeon is a grey bird that often lives in towns.','In vielen Städten ist es verboten, Tauben zu füttern.|In many towns it is forbidden to feed pigeons.'],
 stadtfuehrerin:['die Stadtführerin|the tour guide','die Stadtführerinnen','Die Stadtführerin hält einen gelben Schirm hoch, damit die Gruppe sie sieht.|The guide holds up a yellow umbrella so that the group can see her.','Eine Stadtführerin ist eine Frau, die Touristen die Sehenswürdigkeiten einer Stadt zeigt.|A tour guide is a woman who shows tourists the sights of a town.','Sie erzählt, dass der Marktplatz im fünfzehnten Jahrhundert angelegt wurde.|She tells us that the market square was laid out in the fifteenth century.'],
 reisegruppe:['die Reisegruppe|the tour group','die Reisegruppen','Die Gruppe hört gut zu und macht Fotos.|The group listens carefully and takes photos.','Eine Reisegruppe ist eine Gruppe von Menschen, die zusammen eine Reise machen.|A tour group is a group of people who travel together.','Ein Mann fotografiert das Rathaus, weil er es seiner Familie zeigen möchte.|A man photographs the town hall because he wants to show it to his family.'],
 musiker:['der Straßenmusiker|the street musician','die Straßenmusiker','Der Musiker spielt Akkordeon, und vor ihm liegt ein Hut.|The musician plays the accordion, and a hat lies in front of him.','Ein Straßenmusiker ist jemand, der auf der Straße Musik macht und dafür Geld bekommt.|A street musician is someone who makes music in the street and gets money for it.','In manchen Städten braucht man eine Genehmigung, um auf der Straße zu spielen.|In some towns you need a permit to play in the street.'],
 },
 luecke:[['Die Stadtführerin hält einen gelben ___ hoch.|The guide holds up a yellow ___.','Schirm','stadtfuehrerin'],['Das ___ wurde im fünfzehnten Jahrhundert gebaut.|The ___ was built in the fifteenth century.','Rathaus','rathaus uhr'],['Wir haben uns am ___ in der Mitte des Platzes getroffen.|We met at the ___ in the middle of the square.','Brunnen','brunnen'],['In der ___ haben wir einen Stadtplan bekommen.|At the ___ we got a city map.','Touristeninformation','info'],['Die Häuser mit den dunklen Holzbalken heißen ___.|The houses with the dark wooden beams are called ___.','Fachwerkhäuser','fachwerkhaus'],['Nach der Führung haben wir im ___ Kuchen gegessen.|After the tour we ate cake at the ___.','Straßencafé','cafe kellner'],['Durch das alte ___ kam man früher in die Stadt.|In the past you entered the town through the old ___.','Stadttor','tor']],
 satz:['Das Rathaus / wurde / vor 500 Jahren / gebaut.|The town hall was built 500 years ago.','Die Führung, / die / wir / gemacht haben, / war / sehr interessant.|The tour that we did was very interesting.','Wegen / des schlechten Wetters / blieben / wir / im Café.|Because of the bad weather we stayed in the café.','Ich frage, / ob / die Führung / auch / auf Englisch / ist.|I ask whether the tour is also in English.','Die Stadtführerin / erzählte, / dass / die Stadt / sehr alt / ist.|The guide told us that the town is very old.'],
 quiz:[['Woraus bestehen die Wände eines Fachwerkhauses?|What are the walls of a half-timbered house made of?',['aus Holzbalken und Lehm|wooden beams and clay','aus Glas|glass','aus Beton|concrete'],'Das Holz bildet das Gerüst, und die Felder dazwischen wurden mit Lehm gefüllt.|The wood forms the frame and the spaces in between were filled with clay.'],['Wie lange wurde am Kölner Dom gebaut?|How long was Cologne Cathedral under construction?',['über 600 Jahre|over 600 years','zehn Jahre|ten years','ein Jahr|one year'],'Der Bau begann 1248 und war erst 1880 fertig.|Construction began in 1248 and was only finished in 1880.'],['Was bedeutet das „i“ an einem Gebäude?|What does the “i” on a building mean?',['Touristeninformation|tourist information','Imbiss|snack bar','Internetcafé|internet café'],'Dort bekommt man Informationen und Stadtpläne.|There you get information and city maps.'],['Warum wurden die Stadttore nachts geschlossen?|Why were the city gates closed at night?',['zum Schutz vor Feinden|for protection from enemies','weil es kalt war|because it was cold','wegen der Tauben|because of the pigeons'],'Die Stadtmauer und die Tore schützten die Bewohner.|The town wall and gates protected the inhabitants.'],['Wie viel Trinkgeld gibt man in Deutschland ungefähr?|About how much do you tip in Germany?',['etwa zehn Prozent|about ten percent','gar nichts|nothing at all','fünfzig Prozent|fifty percent'],'Üblich sind fünf bis zehn Prozent, wenn man zufrieden war.|Five to ten percent is usual if you were happy.'],['Wie wurden alte Laternen früher betrieben?|How were old street lamps powered?',['mit Gas|with gas','mit Batterien|with batteries','mit Solarstrom|with solar power'],'Ein Laternenanzünder zündete sie jeden Abend an.|A lamplighter lit them every evening.']]},

{id:'rhein',title:'Am Rhein',en:'On the Rhine',focus:'Konnektoren · Plusquamperfekt',
 story:['Der Rhein ist einer der wichtigsten Flüsse Europas. Er fließt von der Schweiz bis in die Niederlande.|The Rhine is one of Europe’s most important rivers. It flows from Switzerland to the Netherlands.','Zwischen Bingen und Koblenz stehen auf den Hügeln viele Burgen, und an den Hängen wächst Wein.|Between Bingen and Koblenz many castles stand on the hills, and vines grow on the slopes.','Deshalb gehört das Obere Mittelrheintal zum Welterbe der UNESCO.|That’s why the Upper Middle Rhine Valley is a UNESCO World Heritage Site.'],
 hs:{
 _bg:['das Rheintal|the Rhine valley','die Rheintäler','Das Tal ist eng, und die Hänge sind steil.|The valley is narrow and the slopes are steep.','Ein Tal ist ein tiefes Gebiet zwischen Bergen, durch das oft ein Fluss fließt.|A valley is a low area between mountains through which a river often flows.','Das Obere Mittelrheintal ist seit 2002 Welterbe der UNESCO.|The Upper Middle Rhine Valley has been a UNESCO World Heritage Site since 2002.'],
 rhein:['der Rhein|the Rhine','','Auf dem Rhein fahren Ausflugsschiffe und Frachtschiffe.|Excursion boats and cargo ships sail on the Rhine.','Ein Fluss ist ein großes fließendes Gewässer, das ins Meer mündet.|A river is a large flowing body of water that flows into the sea.','Der Rhein ist etwa 1230 Kilometer lang.|The Rhine is about 1230 kilometres long.'],
 burg:['die Burg|the castle','die Burgen','Die Burg steht hoch oben auf dem Berg.|The castle stands high up on the hill.','Eine Burg ist ein befestigtes Gebäude aus dem Mittelalter, in dem Ritter wohnten.|A castle is a fortified building from the Middle Ages in which knights lived.','Viele Burgen am Rhein wurden zerstört und im neunzehnten Jahrhundert wieder aufgebaut.|Many Rhine castles were destroyed and rebuilt in the nineteenth century.'],
 weinberg:['der Weinberg|the vineyard','die Weinberge','An den steilen Hängen wachsen lange Reihen von Reben.|Long rows of vines grow on the steep slopes.','Ein Weinberg ist ein Hang, an dem Weintrauben angebaut werden.|A vineyard is a slope on which grapes are grown.','Weil die Hänge so steil sind, muss vieles noch von Hand gemacht werden.|Because the slopes are so steep, a lot still has to be done by hand.'],
 trauben:['die Weintraube|the grape','die Weintrauben','Die Trauben sind dunkelblau und reif.|The grapes are dark blue and ripe.','Eine Weintraube ist eine Frucht, aus der man Wein oder Saft macht.|A grape is a fruit from which you make wine or juice.','Am Rhein wird vor allem Riesling angebaut, ein Weißwein.|Above all Riesling, a white wine, is grown on the Rhine.'],
 winzer:['der Winzer|the winegrower','die Winzer','Der Winzer trägt einen Korb voller Trauben auf dem Rücken.|The winegrower carries a basket full of grapes on his back.','Ein Winzer ist jemand, der Wein anbaut und selbst herstellt.|A winegrower is someone who grows and makes wine himself.','Die Weinlese findet im September und Oktober statt.|The grape harvest takes place in September and October.'],
 schiff:['das Ausflugsschiff|the excursion boat','die Ausflugsschiffe','Auf dem Sonnendeck sitzen viele Fahrgäste.|Many passengers sit on the sun deck.','Ein Ausflugsschiff ist ein Schiff, mit dem Touristen kurze Fahrten machen.|An excursion boat is a boat on which tourists take short trips.','Das Schiff fährt an der Loreley vorbei, einem berühmten Felsen aus einer Sage.|The boat sails past the Loreley, a famous rock from a legend.'],
 frachter:['das Frachtschiff|the cargo ship','die Frachtschiffe','Das Frachtschiff ist lang und flach.|The cargo ship is long and flat.','Ein Frachtschiff ist ein Schiff, das Waren wie Kohle oder Container transportiert.|A cargo ship is a ship that transports goods such as coal or containers.','Der Rhein ist eine der meistbefahrenen Wasserstraßen Europas.|The Rhine is one of the busiest waterways in Europe.'],
 faehre:['die Fähre|the ferry','die Fähren','Die Fähre bringt Autos auf die andere Seite.|The ferry takes cars to the other side.','Eine Fähre ist ein Boot, das Menschen und Autos über einen Fluss bringt.|A ferry is a boat that takes people and cars across a river.','Zwischen Bingen und Koblenz gibt es keine Brücke über den Rhein. Deshalb braucht man Fähren.|There is no bridge over the Rhine between Bingen and Koblenz, so you need ferries.'],
 dorf:['das Weindorf|the wine village','die Weindörfer','Die kleinen Häuser stehen direkt am Ufer.|The little houses stand right on the riverbank.','Ein Dorf ist ein kleiner Ort auf dem Land, in dem nur wenige Menschen leben.|A village is a small place in the countryside where only a few people live.','Im Herbst feiern viele Weindörfer ein Weinfest mit Musik.|In autumn many wine villages celebrate a wine festival with music.'],
 kirche:['die Kirche|the church','die Kirchen','Der spitze Kirchturm ist das höchste Gebäude im Dorf.|The pointed church tower is the tallest building in the village.','Eine Kirche ist ein Gebäude, in dem Christen beten und Gottesdienste feiern.|A church is a building in which Christians pray and hold services.','Am Sonntagmorgen läuten die Glocken.|On Sunday morning the bells ring.'],
 zug:['der Zug|the train','die Züge','Der rote Regionalzug fährt am Ufer entlang.|The red regional train runs along the riverbank.','Ein Regionalzug ist ein Zug, der auch an kleinen Bahnhöfen hält.|A regional train is a train that also stops at small stations.','Die Bahnstrecken am Rhein gehören zu den schönsten in Deutschland.|The railway lines along the Rhine are among the most beautiful in Germany.'],
 radfahrerin:['die Radfahrerin|the cyclist','die Radfahrerinnen','Die Radfahrerin macht eine Pause am Fluss.|The cyclist takes a break by the river.','Ein Radweg ist ein Weg, auf dem nur Fahrräder fahren dürfen.|A cycle path is a path on which only bicycles may ride.','Der Rheinradweg ist über 1200 Kilometer lang.|The Rhine cycle route is over 1200 kilometres long.'],
 felsen:['der Felsen|the rock','die Felsen','Der Felsen ragt steil über dem Fluss auf.|The rock rises steeply above the river.','Die Loreley ist ein Felsen, über den es eine bekannte Sage gibt.|The Loreley is a rock about which there is a famous legend.','Der Sage nach saß dort eine schöne Frau, deren Gesang die Schiffer ablenkte.|According to legend a beautiful woman sat there whose singing distracted the boatmen.'],
 weinstube:['die Weinstube|the wine tavern','die Weinstuben','Vor der Weinstube hängt ein Schild: Weinprobe.|A sign hangs outside the wine tavern: wine tasting.','Bei einer Weinprobe probiert man Weine, die der Winzer selbst gemacht hat.|At a wine tasting you try wines that the winegrower has made himself.','Bei einer Weinprobe trinkt man oft nur kleine Schlucke und isst Brot dazu.|At a wine tasting you often take only small sips and eat bread with it.'],
 anleger:['die Anlegestelle|the landing stage','die Anlegestellen','An der Anlegestelle warten Fahrgäste auf das Schiff.|Passengers wait for the boat at the landing stage.','Eine Anlegestelle ist ein Platz am Ufer, an dem Schiffe halten.|A landing stage is a place on the bank where boats stop.','Die Fahrkarte für das Schiff kann man oft direkt an der Anlegestelle kaufen.|You can often buy the boat ticket right at the landing stage.'],
 },
 luecke:[['Auf dem Berg steht eine alte ___ aus dem Mittelalter.|On the hill stands an old ___ from the Middle Ages.','Burg','burg'],['Der ___ trägt einen Korb voller Trauben auf dem Rücken.|The ___ carries a basket full of grapes on his back.','Winzer','winzer'],['Mit der ___ sind wir auf die andere Seite des Flusses gefahren.|We crossed to the other side of the river on the ___.','Fähre','faehre'],['Wir haben eine Fahrt mit dem ___ gemacht und die Burgen bewundert.|We took a trip on the ___ and admired the castles.','Ausflugsschiff','schiff'],['Über die ___ gibt es eine berühmte Sage.|There is a famous legend about the ___.','Loreley','felsen'],['In der ___ haben wir drei verschiedene Weine probiert.|In the ___ we tried three different wines.','Weinstube','weinstube']],
 satz:['Wir fuhren / mit dem Schiff, / weil / die Aussicht / vom Wasser / schöner ist.|We went by boat because the view is nicer from the water.','Die Burg, / die / man / vom Schiff / sieht, / ist / 800 Jahre alt.|The castle that you can see from the boat is 800 years old.','Nachdem / wir / die Burg / besichtigt hatten, / gingen / wir / zur Weinprobe.|After we had visited the castle, we went to the wine tasting.','Der Winzer / erklärte, / wie / der Wein / gemacht wird.|The winegrower explained how the wine is made.','Entweder / nehmen / wir / den Zug, / oder / wir / fahren mit dem Rad.|Either we take the train or we cycle.'],
 quiz:[['Wo fließt der Rhein ins Meer?|Where does the Rhine flow into the sea?',['in den Niederlanden|in the Netherlands','in Italien|in Italy','in Polen|in Poland'],'Der Rhein mündet in den Niederlanden in die Nordsee.|The Rhine flows into the North Sea in the Netherlands.'],['Welcher Wein wird am Rhein vor allem angebaut?|Which wine is mainly grown on the Rhine?',['Riesling|Riesling','Champagner|champagne','Portwein|port'],'Riesling ist ein Weißwein, der am Rhein besonders gut wächst.|Riesling is a white wine that grows especially well on the Rhine.'],['Warum gibt es im Mittelrheintal viele Fähren?|Why are there many ferries in the Middle Rhine Valley?',['weil es dort keine Brücken gibt|because there are no bridges','weil es billiger ist|because it is cheaper','weil Autos verboten sind|because cars are banned'],'Zwischen Bingen und Koblenz führt keine Brücke über den Rhein.|No bridge crosses the Rhine between Bingen and Koblenz.'],['Wann ist die Weinlese?|When is the grape harvest?',['im September und Oktober|in September and October','im Januar|in January','im Mai|in May'],'Im Herbst sind die Trauben reif und werden geerntet.|In autumn the grapes are ripe and are harvested.'],['Was ist die Loreley?|What is the Loreley?',['ein Felsen mit einer Sage|a rock with a legend','eine Burg|a castle','ein Schiff|a ship'],'Der Sage nach lenkte dort eine schöne Frau die Schiffer mit ihrem Gesang ab.|According to legend a beautiful woman distracted the boatmen there with her singing.'],['Seit wann ist das Obere Mittelrheintal Welterbe?|Since when has the Upper Middle Rhine Valley been a World Heritage Site?',['seit 2002|since 2002','seit 1950|since 1950','seit 2020|since 2020'],'Die Landschaft mit Burgen und Weinbergen ist einzigartig.|The landscape with castles and vineyards is unique.']]},

{id:'museum',title:'Im Museum',en:'At the museum',focus:'indirekte Fragen · Passiv',
 story:['Bei schlechtem Wetter ist ein Museum ein perfektes Ausflugsziel.|In bad weather a museum is a perfect place for a day out.','In diesem Naturkundemuseum werden Dinosaurier, Kristalle und Kunstwerke ausgestellt.|In this natural history museum dinosaurs, crystals and works of art are exhibited.','Mit einem Audioguide oder bei einer Führung erfährt man, wie alt die Stücke sind und woher sie kommen.|With an audio guide or on a tour you learn how old the exhibits are and where they come from.'],
 hs:{
 _bg:['das Museum|the museum','die Museen','Der Saal ist hoch und hell.|The hall is high and bright.','Ein Museum ist ein Gebäude, in dem wertvolle oder interessante Dinge ausgestellt werden.|A museum is a building in which valuable or interesting things are exhibited.','Am Internationalen Museumstag ist der Eintritt in vielen Museen kostenlos.|On International Museum Day entry to many museums is free.'],
 oberlicht:['das Oberlicht|the skylight','die Oberlichter','Durch das Oberlicht fällt Tageslicht in den Saal.|Daylight falls into the hall through the skylight.','Ein Oberlicht ist ein Fenster, das in die Decke eingebaut ist.|A skylight is a window that is built into the ceiling.','Zu viel Sonne kann Gemälde beschädigen. Deshalb wird das Licht in Museen genau kontrolliert.|Too much sun can damage paintings, so the light in museums is carefully controlled.'],
 gemaelde:['das Gemälde|the painting','die Gemälde','Das große Gemälde zeigt Berge im Abendlicht.|The big painting shows mountains in the evening light.','Ein Gemälde ist ein Bild, das ein Künstler mit Farbe gemalt hat.|A painting is a picture that an artist has painted with paint.','Unter jedem Bild hängt ein kleines Schild, auf dem steht, wer es gemalt hat.|Under every picture there is a small label that says who painted it.'],
 dinosaurier:['der Dinosaurier|the dinosaur','die Dinosaurier','Das Skelett ist fast so lang wie ein Bus.|The skeleton is almost as long as a bus.','Ein Skelett ist das Gerüst aus Knochen, das einen Körper stützt.|A skeleton is the frame of bones that supports a body.','Der Tyrannosaurus Rex lebte vor etwa 66 Millionen Jahren.|Tyrannosaurus rex lived about 66 million years ago.'],
 schild:['das Schild|the sign','die Schilder','Auf dem Schild steht: Bitte nicht berühren!|The sign says: please do not touch!','Ein Schild ist eine Tafel, auf der eine Information oder eine Regel steht.|A sign is a board on which there is information or a rule.','Man darf die Ausstellungsstücke nicht anfassen, weil sie sonst beschädigt werden könnten.|You mustn’t touch the exhibits because they could otherwise be damaged.'],
 vitrine:['die Vitrine|the display case','die Vitrinen','In der Vitrine liegen glitzernde Steine.|Glittering stones lie in the display case.','Eine Vitrine ist ein Schrank aus Glas, in dem wertvolle Dinge gezeigt werden.|A display case is a glass cabinet in which valuable things are shown.','Viele Vitrinen sind mit einer Alarmanlage gesichert.|Many display cases are protected by an alarm.'],
 kristall:['der Kristall|the crystal','die Kristalle','Die Kristalle sind rosa, weiß und lila.|The crystals are pink, white and purple.','Ein Kristall ist ein Stein, der von Natur aus eine regelmäßige Form hat.|A crystal is a stone that naturally has a regular shape.','Der lila Kristall heißt Amethyst. Er wird oft für Schmuck verwendet.|The purple crystal is called amethyst. It is often used for jewellery.'],
 skulptur:['die Skulptur|the sculpture','die Skulpturen','Die Büste ist aus weißem Marmor.|The bust is made of white marble.','Eine Skulptur ist ein Kunstwerk, das aus Stein, Holz oder Metall geformt wurde.|A sculpture is a work of art that was shaped from stone, wood or metal.','Eine Büste zeigt nur den Kopf und die Schultern eines Menschen.|A bust shows only a person’s head and shoulders.'],
 globus:['der Globus|the globe','die Globen','Auf dem Globus sieht man die Kontinente und die Meere.|On the globe you can see the continents and the seas.','Ein Globus ist eine Kugel, die die Erde im Kleinen zeigt.|A globe is a ball that shows the earth in miniature.','Der älteste erhaltene Globus der Welt wurde 1492 in Nürnberg gebaut.|The oldest surviving globe in the world was made in Nuremberg in 1492.'],
 lageplan:['der Lageplan|the floor plan','die Lagepläne','Auf dem Plan sieht man, wo welche Ausstellung ist.|The plan shows where each exhibition is.','Ein Lageplan ist eine Karte, die zeigt, wo sich die Räume eines Gebäudes befinden.|A floor plan is a map that shows where the rooms of a building are.','Wer sich verlaufen hat, findet auf dem Plan den Punkt „Sie sind hier“.|If you’re lost, you find the “You are here” point on the plan.'],
 shop:['der Museumsshop|the museum shop','die Museumsshops','Im Shop gibt es Bücher, Postkarten und Spielsachen.|The shop sells books, postcards and toys.','Ein Museumsshop ist ein Laden, in dem man Andenken an das Museum kaufen kann.|A museum shop is a shop where you can buy souvenirs of the museum.','In vielen Museen führt der Ausgang direkt durch den Shop.|In many museums the exit leads straight through the shop.'],
 kasse:['die Kasse|the ticket desk','die Kassen','An der Kasse kauft man die Eintrittskarten.|You buy the tickets at the ticket desk.','Die Kasse ist der Ort, an dem man bezahlt.|The cash desk is the place where you pay.','Schüler, Studenten und Rentner bekommen oft eine Ermäßigung.|Pupils, students and pensioners often get a discount.'],
 eintrittskarte:['die Eintrittskarte|the ticket','die Eintrittskarten','Die Eintrittskarte kostet acht Euro.|The ticket costs eight euros.','Eine Eintrittskarte ist ein Ticket, mit dem man hineingehen darf.|A ticket is something that allows you to go in.','Viele Museen verkaufen ihre Tickets inzwischen auch online.|Many museums now also sell their tickets online.'],
 bank:['die Bank|the bench','die Bänke','Auf der Bank kann man sich ausruhen.|You can rest on the bench.','Eine Bank ist ein langer Sitz, auf dem mehrere Personen Platz haben.|A bench is a long seat with room for several people.','Nach einer Stunde im Museum sind viele Besucher müde. Eine kurze Pause hilft.|After an hour in a museum many visitors are tired. A short break helps.'],
 besucherin:['die Besucherin|the visitor','die Besucherinnen','Die Besucherin hört sich die Erklärungen an.|The visitor listens to the explanations.','Eine Besucherin ist eine Frau, die einen Ort besucht, zum Beispiel ein Museum.|A visitor is a woman who visits a place, for example a museum.','Sie möchte wissen, wie alt der Dinosaurier ist.|She wants to know how old the dinosaur is.'],
 audioguide:['der Audioguide|the audio guide','die Audioguides','Mit dem Audioguide hört man Erklärungen über Kopfhörer.|With the audio guide you hear explanations through headphones.','Ein Audioguide ist ein Gerät, das Informationen über die Ausstellung vorliest.|An audio guide is a device that reads out information about the exhibition.','Man tippt die Nummer ein, die neben dem Kunstwerk steht.|You type in the number that is next to the artwork.'],
 fuehrer:['der Museumsführer|the museum guide','die Museumsführer','Der Museumsführer erklärt der Klasse das Skelett.|The museum guide explains the skeleton to the class.','Ein Museumsführer ist jemand, der Besuchergruppen durch das Museum führt.|A museum guide is someone who leads groups of visitors through the museum.','Er erzählt, wo das Skelett gefunden wurde und wie lange die Ausgrabung dauerte.|He tells where the skeleton was found and how long the excavation took.'],
 schulklasse:['die Schulklasse|the school class','die Schulklassen','Die Kinder schauen staunend nach oben.|The children look up in amazement.','Eine Schulklasse ist eine Gruppe von Schülern, die zusammen unterrichtet werden.|A school class is a group of pupils who are taught together.','Viele Klassen machen einmal im Jahr einen Ausflug ins Museum.|Many classes go on a trip to a museum once a year.'],
 aufsicht:['die Aufsicht|the attendant','die Aufsichten','Die Aufsicht passt auf, dass niemand etwas anfasst.|The attendant makes sure that nobody touches anything.','Eine Aufsicht ist eine Person, die im Museum auf die Kunstwerke aufpasst.|An attendant is a person who looks after the artworks in a museum.','Große Taschen und Rucksäcke muss man oft an der Garderobe abgeben.|You often have to leave big bags and backpacks at the cloakroom.'],
 },
 luecke:[['Das ___ des Dinosauriers ist fast so lang wie ein Bus.|The dinosaur’s ___ is almost as long as a bus.','Skelett','dinosaurier'],['Mit dem ___ hört man Erklärungen zu jedem Bild.|With the ___ you hear explanations about every picture.','Audioguide','audioguide besucherin'],['An der ___ haben wir zwei Eintrittskarten gekauft.|At the ___ we bought two tickets.','Kasse','kasse eintrittskarte'],['In der ___ liegen wertvolle Kristalle.|Valuable crystals lie in the ___.','Vitrine','vitrine kristall'],['Auf dem ___ steht, dass man nichts anfassen darf.|The ___ says that you mustn’t touch anything.','Schild','schild'],['Im ___ haben wir Postkarten und ein Buch gekauft.|In the ___ we bought postcards and a book.','Museumsshop','shop']],
 satz:['Können Sie mir sagen, / wann / das Museum / heute / schließt?|Can you tell me when the museum closes today?','Ich möchte wissen, / ob / es / eine Ermäßigung / für Studenten / gibt.|I’d like to know whether there is a discount for students.','Das Skelett / wurde / vor hundert Jahren / in Amerika / gefunden.|The skeleton was found in America a hundred years ago.','Das ist / das Bild, / das / mir / am besten / gefällt.|That is the picture that I like best.','Wir gehen / ins Museum, / weil / es / draußen / regnet.|We go to the museum because it is raining outside.'],
