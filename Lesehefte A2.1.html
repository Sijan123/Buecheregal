 modes:['entdecken','regeln','wissen'],games:['reaktion','darf','pruefung'],storyMode:'wissen',voice:'stift',cert:'Du bist fit für die Straße und für die Führerscheinprüfung!',
scenes:[
{id:'fahrschule',title:'In der Fahrschule',en:'At the driving school',focus:'Modalverben · Prüfung',
 story:['Wer in Deutschland Auto fahren will, braucht einen Führerschein. Dafür geht man in eine Fahrschule.|Anyone who wants to drive in Germany needs a licence. For that you go to a driving school.','Zuerst lernt man die Regeln im Theorieunterricht. Dann übt man mit dem Fahrlehrer im Auto.|First you learn the rules in theory lessons. Then you practise in the car with the instructor.','Am Ende macht man zwei Prüfungen: die Theorieprüfung am Computer und die praktische Prüfung im Auto.|At the end there are two tests: the theory test on a computer and the practical test in the car.'],
 hs:{
 _bg:['die Fahrschule|the driving school','die Fahrschulen','In der Fahrschule lernt man Auto fahren.|At the driving school you learn to drive.','Du musst mindestens vierzehn Doppelstunden Theorie besuchen.|You must attend at least fourteen double lessons of theory.','Mit siebzehn darf man schon mit einer Begleitperson fahren. Das heißt Begleitetes Fahren.|At seventeen you may already drive with a companion. This is called accompanied driving.'],
 schilder:['das Verkehrszeichen|the traffic sign','die Verkehrszeichen','Auf dem Plakat sind sechs wichtige Verkehrszeichen.|The poster shows six important traffic signs.','Die Verkehrszeichen musst du kennen, bevor du losfährst.|You must know the traffic signs before you set off.','Ein roter Rand bedeutet meistens ein Verbot. Blaue Schilder sind ein Gebot oder ein Hinweis.|A red border usually means a ban. Blue signs are an instruction or information.'],
 tafel:['die Tafel|the whiteboard','die Tafeln','An der Tafel zeigt der Fahrlehrer eine Kreuzung.|On the whiteboard the instructor shows a junction.','Wenn kein Schild da ist, gilt rechts vor links: Das Auto von rechts darf zuerst fahren.|If there is no sign, right before left applies: the car from the right may go first.','Rechts vor links ist eine der wichtigsten Regeln in Deutschland.|Right before left is one of the most important rules in Germany.'],
 fahrlehrer:['der Fahrlehrer|the driving instructor','die Fahrlehrer','Der Fahrlehrer erklärt die Vorfahrt.|The instructor explains right of way.','In der Fahrstunde sitzt der Fahrlehrer neben dir. Er hat auch eine Bremse.|In a lesson the instructor sits next to you. He has a brake too.','Eine Fahrstunde dauert meistens fünfundvierzig Minuten.|A driving lesson usually lasts forty-five minutes.'],
 fahrschulauto:['das Fahrschulauto|the learner car','die Fahrschulautos','Auf dem Dach steht: Fahrschule.|The roof sign says: driving school.','Im Fahrschulauto darfst du nur mit dem Fahrlehrer fahren.|In the learner car you may only drive with the instructor.','Man muss auch Sonderfahrten machen: auf der Autobahn, auf der Landstraße und in der Nacht.|You also have to do special drives: on the motorway, on country roads and at night.'],
 beamer:['der Beamer|the projector','die Beamer','Der Beamer hängt an der Decke.|The projector hangs from the ceiling.','Im Unterricht darfst du Fragen stellen, wenn du etwas nicht verstehst.|In class you may ask questions if you don’t understand something.','Beamer klingt englisch, aber auf Englisch sagt man projector.|Beamer sounds English, but in English it’s a projector.'],
 sehtest:['der Sehtest|the eye test','die Sehtests','Oben stehen große Buchstaben, unten kleine.|Big letters at the top, small ones at the bottom.','Für den Führerschein musst du einen Sehtest machen.|For the licence you must take an eye test.','Den Sehtest kann man beim Optiker machen. Er kostet nur wenige Euro.|You can take the eye test at an optician. It costs only a few euros.'],
 verbandskasten:['der Verbandskasten|the first-aid kit','die Verbandskästen','Der Verbandskasten ist grün und hat ein weißes Kreuz.|The first-aid kit is green with a white cross.','In jedem Auto muss ein Verbandskasten sein.|Every car must have a first-aid kit.','Vor dem Führerschein musst du einen Erste-Hilfe-Kurs machen.|Before the licence you must take a first-aid course.'],
 pruefung:['die Theorieprüfung|the theory test','die Theorieprüfungen','Am Computer beantwortet man dreißig Fragen.|You answer thirty questions on the computer.','In der Prüfung darfst du nicht mit anderen sprechen.|In the test you must not talk to others.','Man darf höchstens zehn Fehlerpunkte haben. Die Prüfung gibt es auch auf Englisch.|You may have at most ten error points. The test is also available in English.'],
 schueler:['die Fahrschülerin|the learner driver','die Fahrschülerinnen','Drei Fahrschüler sitzen im Unterricht.|Three learners are sitting in class.','Im Unterricht sollst du dein Handy ausschalten.|In class you should switch off your phone.','Viele Fahrschüler sind siebzehn oder achtzehn, aber man kann auch später den Führerschein machen.|Many learners are seventeen or eighteen, but you can also get your licence later.'],
 lehrbuch:['das Lehrbuch|the textbook','die Lehrbücher','Das Lehrbuch liegt offen auf dem Tisch.|The textbook lies open on the table.','Zu Hause solltest du die Fragen üben, am besten mit einer App.|At home you should practise the questions, ideally with an app.','Für die Theorie gibt es über tausend offizielle Fragen.|There are over a thousand official theory questions.'],
 fragebogen:['der Fragebogen|the question sheet','die Fragebögen','Auf dem Fragebogen sind Kästchen zum Ankreuzen.|The sheet has boxes to tick.','Bei manchen Fragen musst du mehrere Antworten ankreuzen.|For some questions you must tick several answers.','Achtung: Oft sind zwei oder drei Antworten richtig.|Careful: often two or three answers are correct.'],
 brille:['die Brille|the glasses','die Brillen','Auf dem Tisch liegt eine Brille.|A pair of glasses is on the table.','Wenn du eine Brille brauchst, musst du sie beim Fahren immer tragen.|If you need glasses, you must always wear them when driving.','Das steht dann auch im Führerschein, als Zahl null eins.|This is then noted in the licence as the number 01.'],

 react:[['Achtung, Prüfung! Tippe schnell auf den Computer!|Test time! Quickly tap the computer!','pruefung'],['Du brauchst deinen Führerschein. Schnell, wo ist er?|You need your licence. Quick, where is it?','fuehrerschein'],['Jemand hat sich verletzt! Wo ist der Verbandskasten?|Someone is hurt! Where is the first-aid kit?','verbandskasten'],['Du kannst nichts sehen! Wo ist deine Brille?|You can’t see anything! Where are your glasses?','brille'],['Der Fahrlehrer wartet schon im Auto. Schnell, wo ist es?|The instructor is waiting in the car. Quick, where is it?','fahrschulauto'],['Wer erklärt die Vorfahrt? Tippe schnell!|Who explains right of way? Tap quickly!','fahrlehrer']],
 darf:[['Mit siebzehn mit Begleitung Auto fahren.|Drive with a companion at seventeen.','darf','Mit siebzehn darf man mit einer Begleitperson fahren.|At seventeen you may drive with an accompanying person.'],['Ohne Führerschein Auto fahren.|Drive without a licence.','nicht','Das ist verboten und eine Straftat.|That is forbidden and a criminal offence.'],['Vor dem Führerschein einen Erste-Hilfe-Kurs machen.|Take a first-aid course before the licence.','muss','Der Kurs ist Pflicht.|The course is compulsory.'],['In der Theorieprüfung mit dem Nachbarn sprechen.|Talk to your neighbour in the theory test.','nicht','Dann ist die Prüfung sofort vorbei.|Then the test is over immediately.'],['Mit Brille fahren, wenn man schlecht sieht.|Drive with glasses if you don’t see well.','muss','Wer schlecht sieht, muss beim Fahren eine Brille tragen.|Anyone who doesn’t see well must wear glasses when driving.'],['Die Theorieprüfung auf Englisch machen.|Take the theory test in English.','darf','Die Prüfung gibt es in vielen Sprachen.|The test is available in many languages.']],
 pruef:[['Was brauchen Sie für den Antrag auf einen Führerschein?|What do you need to apply for a licence?',['einen Sehtest|an eye test','einen Erste-Hilfe-Kurs|a first-aid course','ein eigenes Auto|your own car'],'0 1','Sehtest und Erste-Hilfe-Kurs sind Pflicht. Ein eigenes Auto braucht man nicht.|An eye test and a first-aid course are compulsory. You don’t need your own car.'],['Was müssen Sie beim Fahren dabeihaben?|What must you carry when driving?',['den Führerschein|the licence','den Fahrzeugschein|the vehicle registration','den Reisepass|the passport'],'0 1','Führerschein und Fahrzeugschein muss man immer mitnehmen.|You must always take the licence and the vehicle registration.'],['An einer Kreuzung ohne Schilder kommt ein Auto von rechts. Was tun Sie?|At a junction without signs a car comes from the right. What do you do?',['Ich lasse es zuerst fahren.|I let it go first.','Ich fahre schnell zuerst.|I quickly go first.','Ich hupe.|I honk.'],'0','Es gilt rechts vor links.|Right before left applies.'],['Wie viele Fehlerpunkte darf man in der Theorieprüfung höchstens haben?|How many error points may you have at most in the theory test?',['zehn|ten','zwanzig|twenty','null|zero'],'0','Mit mehr als zehn Fehlerpunkten ist man durchgefallen.|With more than ten error points you have failed.'],['Was muss in jedem Auto sein?|What must be in every car?',['ein Verbandskasten|a first-aid kit','ein Warndreieck|a warning triangle','ein Kühlschrank|a fridge'],'0 1','Auch eine Warnweste ist Pflicht.|A hi-vis vest is also compulsory.']]},

{id:'kreuzung',title:'An der Kreuzung',en:'At the junction',focus:'Vorfahrt · dürfen und müssen',
 story:['An einer Kreuzung treffen sich zwei Straßen. Hier muss man besonders gut aufpassen.|At a junction two roads meet. You have to be especially careful here.','Ampeln, Schilder und Markierungen sagen, wer zuerst fahren darf.|Traffic lights, signs and road markings say who may go first.','Auch Fußgänger und Radfahrer haben Regeln. Alle müssen Rücksicht nehmen.|Pedestrians and cyclists have rules too. Everyone has to be considerate.'],
 hs:{

 ampel:['die Ampel|the traffic light','die Ampeln','Die Ampel ist rot.|The traffic light is red.','Bei Rot musst du anhalten. Bei Gelb sollst du bremsen, wenn es noch sicher geht.|At red you must stop. At amber you should brake if it is still safe.','Wer bei Rot fährt, zahlt mindestens neunzig Euro und bekommt einen Punkt in Flensburg.|Anyone who runs a red light pays at least ninety euros and gets a penalty point in Flensburg.'],

 zebrastreifen:['der Zebrastreifen|the zebra crossing','die Zebrastreifen','Der Zebrastreifen hat breite weiße Streifen.|The zebra crossing has wide white stripes.','Am Zebrastreifen musst du anhalten, wenn ein Fußgänger über die Straße gehen will.|At a zebra crossing you must stop if a pedestrian wants to cross.','Auf dem Zebrastreifen haben Fußgänger Vorrang.|Pedestrians have priority on a zebra crossing.'],

 vorfahrt:['die Vorfahrtstraße|the priority road','die Vorfahrtstraßen','Das gelbe Schild sieht aus wie eine Raute.|The yellow sign looks like a diamond.','Auf der Vorfahrtstraße darfst du zuerst fahren.|On the priority road you may go first.','Wenn das Schild durchgestrichen ist, endet die Vorfahrtstraße.|When the sign is crossed out, the priority road ends.'],
 einbahnstrasse:['die Einbahnstraße|the one-way street','die Einbahnstraßen','Das blaue Schild hat einen weißen Pfeil.|The blue sign has a white arrow.','In einer Einbahnstraße darfst du nur in eine Richtung fahren.|In a one-way street you may only drive in one direction.','Radfahrer dürfen manchmal in die andere Richtung fahren. Das zeigt ein Zusatzschild.|Cyclists may sometimes ride the other way. An extra sign shows this.'],
 halteverbot:['das Halteverbot|the no-stopping zone','die Halteverbote','Das Schild ist blau mit einem roten Kreuz.|The sign is blue with a red cross.','Hier darfst du nicht halten, auch nicht kurz.|You may not stop here, not even briefly.','Das Schild mit nur einem roten Strich bedeutet Parkverbot. Dort darf man kurz halten.|The sign with just one red stripe means no parking. You may stop briefly there.'],
 warnschild:['das Warnschild|the warning sign','die Warnschilder','Auf dem Schild sieht man zwei Kinder.|The sign shows two children.','Wenn du dieses Schild siehst, musst du langsam fahren und bremsbereit sein.|When you see this sign, you must drive slowly and be ready to brake.','Warnschilder sind Dreiecke mit einem roten Rand.|Warning signs are triangles with a red border.'],
 tempo30:['die Tempo-30-Zone|the 30 zone','die Tempo-30-Zonen','Hier darf man höchstens dreißig Kilometer pro Stunde fahren.|Here you may drive at most thirty kilometres per hour.','In der Tempo-30-Zone darfst du nicht schneller als dreißig fahren.|In the 30 zone you may not drive faster than thirty.','In der Stadt gilt sonst meistens Tempo fünfzig.|Otherwise the limit in town is usually fifty.'],
 falschparker:['der Falschparker|the illegally parked car','die Falschparker','Das gelbe Auto steht im Halteverbot.|The yellow car is in the no-stopping zone.','Wer falsch parkt, muss ein Bußgeld zahlen. Manchmal wird das Auto abgeschleppt.|If you park illegally, you must pay a fine. Sometimes the car is towed away.','Das Ordnungsamt kontrolliert, ob Autos richtig parken.|The public order office checks whether cars are parked correctly.'],
 auto:['das Auto|the car','die Autos','Das blaue Auto kommt auf uns zu.|The blue car is coming towards us.','Im Auto müssen alle einen Sicherheitsgurt tragen.|Everyone in the car must wear a seatbelt.','Kleine Kinder brauchen einen Kindersitz.|Small children need a child seat.'],
 radweg:['der Radweg|the cycle lane','die Radwege','Der Radweg ist rot.|The cycle lane is red.','Auf dem Radweg dürfen Autos nicht fahren und nicht parken.|Cars may not drive or park on the cycle lane.','Wenn es einen Radweg mit blauem Schild gibt, müssen Radfahrer ihn benutzen.|If there is a cycle lane with a blue sign, cyclists must use it.'],
 radfahrer:['der Radfahrer|the cyclist','die Radfahrer','Der Radfahrer trägt einen roten Helm.|The cyclist is wearing a red helmet.','Erwachsene dürfen nicht auf dem Gehweg Rad fahren. Kleine Kinder dürfen das.|Adults may not cycle on the pavement. Small children may.','Ein Helm ist in Deutschland keine Pflicht, aber er schützt den Kopf.|A helmet is not compulsory in Germany, but it protects your head.'],
 fussgaenger:['der Fußgänger|the pedestrian','die Fußgänger','Eine Mutter und ihr Kind warten am Zebrastreifen.|A mother and her child are waiting at the zebra crossing.','Als Fußgänger musst du nach links und rechts schauen, bevor du über die Straße gehst.|As a pedestrian you must look left and right before you cross the road.','Kinder lernen in der Schule, wie man sicher über die Straße geht.|Children learn at school how to cross the road safely.'],
 polizistin:['die Polizistin|the police officer','die Polizistinnen','Die Polizistin trägt eine blaue Uniform.|The police officer wears a blue uniform.','Wenn die Polizei ein Zeichen gibt, musst du es befolgen. Das ist wichtiger als die Ampel.|If the police give a signal, you must follow it. It overrides the traffic light.','Die Polizei erreicht man unter der Nummer einhundertzehn.|You can reach the police at the number one-one-zero.'],

 react:[['Achtung! Gleich wird es rot. Wohin musst du schauen? Schnell!|Careful! It’s about to turn red. Where must you look? Quick!','ampel'],['Ein Kind will über die Straße. Wo kann es sicher hinübergehen?|A child wants to cross. Where can it cross safely?','zebrastreifen'],['Welches Schild sagt: ganz anhalten? Schnell!|Which sign says: stop completely? Quick!','stoppschild'],['Vorsicht, neben dir ist ein Radfahrer! Wo ist er?|Careful, there is a cyclist next to you! Where is he?','radfahrer'],['Hier darfst du nicht halten. Wo ist das Schild?|You may not stop here. Where is the sign?','halteverbot'],['Die Ampel ist kaputt. Wer regelt den Verkehr?|The traffic light is broken. Who directs the traffic?','polizistin']],
 darf:[['Bei Rot über die Ampel fahren.|Drive through a red light.','nicht','Bei Rot muss man anhalten.|At red you must stop.'],['Am Stoppschild ganz anhalten.|Stop completely at a stop sign.','muss','Auch wenn niemand kommt.|Even if nobody is coming.'],['In der Tempo-30-Zone dreißig fahren.|Drive thirty in the 30 zone.','darf','Dreißig ist erlaubt, aber nicht schneller.|Thirty is allowed, but no faster.'],['Auf dem Radweg parken.|Park on the cycle lane.','nicht','Der Radweg ist nur für Fahrräder.|The cycle lane is only for bicycles.'],['Am Zebrastreifen für Fußgänger anhalten.|Stop for pedestrians at a zebra crossing.','muss','Fußgänger haben dort Vorrang.|Pedestrians have priority there.'],['In einer Einbahnstraße in beide Richtungen fahren.|Drive both ways in a one-way street.','nicht','Man darf nur in eine Richtung fahren.|You may only drive in one direction.'],['Mit dem Fahrrad bei Rot über die Ampel fahren.|Cycle through a red light.','nicht','Die Ampel gilt auch für Radfahrer.|The traffic light applies to cyclists too.']],
 pruef:[['An einer Kreuzung ohne Schilder und ohne Ampel: Wer darf zuerst fahren?|At a junction without signs or lights: who may go first?',['das Fahrzeug von rechts|the vehicle from the right','das schnellere Fahrzeug|the faster vehicle','das größere Fahrzeug|the bigger vehicle'],'0','Es gilt rechts vor links.|Right before left applies.'],['Was bedeutet gelbes Licht an der Ampel?|What does an amber light mean?',['Anhalten, wenn es noch sicher geht.|Stop if it is still safe.','Schneller fahren.|Drive faster.','Hupen.|Honk.'],'0','Bei Gelb soll man vor der Kreuzung halten, wenn das ohne Gefahr möglich ist.|At amber you should stop before the junction if that is possible without danger.'],['Ein Fußgänger wartet am Zebrastreifen. Was tun Sie?|A pedestrian is waiting at a zebra crossing. What do you do?',['Ich halte an.|I stop.','Ich lasse ihn über die Straße gehen.|I let him cross.','Ich fahre schnell vorbei.|I drive past quickly.'],'0 1','Fußgänger haben am Zebrastreifen Vorrang.|Pedestrians have priority at a zebra crossing.'],['Welche Schilder verbieten etwas?|Which signs prohibit something?',['ein runder Kreis mit rotem Rand|a round sign with a red border','das Stoppschild|the stop sign','ein blaues Schild mit P|a blue sign with a P'],'0 1','Rote Ränder bedeuten meistens ein Verbot. Das blaue P zeigt einen Parkplatz.|Red borders usually mean a ban. The blue P shows a car park.'],['Wie schnell dürfen Sie in der Stadt normalerweise fahren?|How fast may you normally drive in town?',['50 km/h|50 km/h','80 km/h|80 km/h','100 km/h|100 km/h'],'0','Innerorts gilt fünfzig, wenn kein anderes Schild steht.|In town the limit is fifty unless another sign says otherwise.']]},

 scheibenwischer:['der Scheibenwischer|the windscreen wiper','die Scheibenwischer','Die Scheibenwischer sind schwarz.|The wipers are black.','Wenn es regnet, musst du die Scheibenwischer anmachen.|When it rains, you must switch on the wipers.','Bei Regen sollte man auch das Licht einschalten.|In rain you should also switch on the lights.'],
 rueckspiegel:['der Rückspiegel|the rear-view mirror','die Rückspiegel','Im Rückspiegel sieht man die Straße hinter dem Auto.|In the rear-view mirror you see the road behind the car.','Vor dem Bremsen und Abbiegen musst du in den Rückspiegel schauen.|Before braking and turning you must look in the rear-view mirror.','In der Prüfung achtet der Prüfer genau auf den Blick in die Spiegel.|In the test the examiner watches closely whether you check the mirrors.'],
 aussenspiegel:['der Außenspiegel|the side mirror','die Außenspiegel','Links und rechts ist ein Außenspiegel.|There is a side mirror on the left and the right.','Vor dem Spurwechsel musst du in den Außenspiegel schauen und über die Schulter blicken.|Before changing lanes you must check the side mirror and look over your shoulder.','Den Blick über die Schulter nennt man Schulterblick. Ohne ihn fällt man oft durch die Prüfung.|Looking over your shoulder is called the shoulder check. Without it you often fail the test.'],
 auto:['das Auto|the car','die Autos','Vor uns fährt ein rotes Auto.|A red car is driving in front of us.','Halte genug Abstand zum Auto vor dir!|Keep enough distance from the car in front of you!','Eine einfache Regel: Abstand ist halber Tacho. Bei fünfzig also fünfundzwanzig Meter.|A simple rule: distance is half the speedometer. At fifty, that’s twenty-five metres.'],
 schild:['das Verkehrsschild|the road sign','die Verkehrsschilder','Auf dem runden Schild steht fünfzig.|The round sign says fifty.','Hier darfst du höchstens fünfzig fahren.|Here you may drive at most fifty.','Wer zu schnell fährt, wird oft geblitzt und muss zahlen.|Anyone who speeds is often caught on camera and has to pay.'],
 lenkrad:['das Lenkrad|the steering wheel','die Lenkräder','Das Lenkrad ist rund und schwarz.|The steering wheel is round and black.','Halte das Lenkrad mit beiden Händen fest!|Hold the steering wheel firmly with both hands!','Viele Fahrlehrer sagen: Hände auf Viertel vor drei.|Many instructors say: hands at a quarter to three.'],
 hupe:['die Hupe|the horn','die Hupen','Die Hupe ist in der Mitte vom Lenkrad.|The horn is in the middle of the steering wheel.','Du darfst nur hupen, wenn Gefahr droht.|You may only honk when there is danger.','In der Stadt ohne Grund zu hupen ist verboten und kostet Geld.|Honking in town without a reason is forbidden and costs money.'],
 tacho:['der Tacho|the speedometer','die Tachos','Der Tacho zeigt die Geschwindigkeit in Kilometern pro Stunde.|The speedometer shows the speed in kilometres per hour.','Schau oft auf den Tacho, damit du nicht zu schnell fährst.|Check the speedometer often so that you don’t drive too fast.','Neben dem Tacho ist der Drehzahlmesser. Er zeigt, wie schnell der Motor dreht.|Next to the speedometer is the rev counter. It shows how fast the engine is turning.'],
 tankanzeige:['die Tankanzeige|the fuel gauge','die Tankanzeigen','Der Tank ist noch halb voll.|The tank is still half full.','Wenn die Lampe leuchtet, musst du bald tanken.|When the light comes on, you must refuel soon.','Auf der Autobahn ohne Benzin stehen zu bleiben kann ein Bußgeld kosten.|Running out of fuel on the motorway can cost a fine.'],
 blinker:['der Blinker|the indicator','die Blinker','Der Blinkerhebel ist links am Lenkrad.|The indicator stalk is to the left of the steering wheel.','Bevor du abbiegst, musst du blinken.|Before you turn, you must indicate.','Mit dem Blinker zeigt man den anderen, wohin man fährt.|With the indicator you show others where you are going.'],
 navi:['das Navi|the sat nav','die Navis','Das Navi zeigt: In dreihundert Metern rechts abbiegen.|The sat nav shows: in three hundred metres turn right.','Während der Fahrt darfst du das Navi nicht mit der Hand bedienen.|While driving you may not operate the sat nav by hand.','In der Prüfung muss man oft eine Zeit lang nach Navi oder nach Schildern fahren.|In the test you often have to follow the sat nav or the signs for a while.'],
 warnblinker:['der Warnblinker|the hazard lights','die Warnblinker','Der Knopf hat ein rotes Dreieck.|The button has a red triangle.','Bei einer Panne oder am Ende von einem Stau musst du den Warnblinker anmachen.|In a breakdown or at the end of a traffic jam you must switch on the hazard lights.','Dann blinken alle vier Blinker gleichzeitig.|Then all four indicators flash at the same time.'],
 schaltung:['die Gangschaltung|the gear stick','die Gangschaltungen','Der Schalthebel ist zwischen den Sitzen.|The gear stick is between the seats.','Zum Anfahren musst du den ersten Gang einlegen.|To pull away you must put it in first gear.','Viele neue Autos haben eine Automatik. Dann gibt es keine Kupplung.|Many new cars are automatic. Then there is no clutch.'],
 handbremse:['die Handbremse|the handbrake','die Handbremsen','Die Handbremse ist neben dem Schalthebel.|The handbrake is next to the gear stick.','Wenn du parkst, musst du die Handbremse anziehen.|When you park, you must apply the handbrake.','Am Berg hilft die Handbremse, damit das Auto nicht zurückrollt.|On a hill the handbrake stops the car from rolling back.'],
 gurt:['der Sicherheitsgurt|the seatbelt','die Sicherheitsgurte','Das Gurtschloss hat einen roten Knopf.|The buckle has a red button.','Vor dem Losfahren musst du dich anschnallen.|Before setting off you must fasten your seatbelt.','Seit 1976 muss man sich in Deutschland vorne anschnallen.|Since 1976 you have had to wear a seatbelt in the front in Germany.'],
 kupplung:['die Kupplung|the clutch','die Kupplungen','Die Kupplung ist das linke Pedal.|The clutch is the left pedal.','Beim Schalten musst du die Kupplung ganz treten.|When changing gear you must press the clutch all the way down.','Das Anfahren übt man am Anfang auf einem großen Parkplatz.|At the beginning you practise pulling away in a big car park.'],
 bremse:['die Bremse|the brake','die Bremsen','Die Bremse ist das mittlere Pedal.|The brake is the middle pedal.','Bei Gefahr musst du stark bremsen.|In danger you must brake hard.','In der Prüfung macht man oft eine Gefahrbremsung.|In the test you often have to do an emergency stop.'],
 gaspedal:['das Gaspedal|the accelerator','die Gaspedale','Das Gaspedal ist rechts und schmal.|The accelerator is on the right and narrow.','Gib vorsichtig Gas, wenn du losfährst!|Accelerate gently when you set off!','Wer sanft Gas gibt, spart Benzin und Geld.|Gentle acceleration saves fuel and money.'],
 pruefer:['der Prüfer|the examiner','die Prüfer','Der Prüfer hat ein Klemmbrett und schreibt mit.|The examiner has a clipboard and takes notes.','In der Prüfung musst du genau tun, was der Prüfer sagt.|In the test you must do exactly what the examiner says.','Die praktische Prüfung dauert für Klasse B etwa fünfundfünfzig Minuten.|The practical test for class B lasts about fifty-five minutes.'],
 },
 react:[['Das Auto vor dir bremst! Schnell, tippe auf die Bremse!|The car in front is braking! Quick, tap the brake!','bremse'],['Du willst abbiegen. Was musst du jetzt benutzen?|You want to turn. What must you use now?','blinker'],['Ein Kind läuft auf die Straße! Warne mit der Hupe!|A child runs onto the road! Warn with the horn!','hupe'],['Wie schnell fährst du? Schau schnell nach!|How fast are you going? Check quickly!','tacho'],['Ein Auto will dich überholen. Wo siehst du es?|A car wants to overtake you. Where do you see it?','aussenspiegel rueckspiegel'],['Panne! Mach schnell den Warnblinker an!|Breakdown! Quickly switch on the hazard lights!','warnblinker']],
 darf:[['Ohne Gurt losfahren.|Set off without a seatbelt.','nicht','Man muss sich immer anschnallen.|You must always fasten your seatbelt.'],['Beim Fahren das Handy in die Hand nehmen.|Hold your phone while driving.','nicht','Das Handy darf man beim Fahren nicht in der Hand halten.|You may not hold your phone while driving.'],['Vor dem Abbiegen blinken.|Indicate before turning.','muss','Blinken ist Pflicht.|Indicating is compulsory.'],['Nach dem Parken die Handbremse anziehen.|Apply the handbrake after parking.','muss','Sonst kann das Auto wegrollen.|Otherwise the car can roll away.'],['Mit einer Freisprechanlage telefonieren.|Phone with a hands-free kit.','darf','Mit Freisprechanlage ist es erlaubt.|With a hands-free kit it is allowed.'],['Ohne Grund in der Stadt hupen.|Honk in town for no reason.','nicht','Hupen darf man nur bei Gefahr.|You may only honk when there is danger.']],
 pruef:[['Was machen Sie, bevor Sie losfahren?|What do you do before setting off?',['den Gurt anlegen|fasten the seatbelt','die Spiegel einstellen|adjust the mirrors','das Radio laut machen|turn up the radio'],'0 1','Sitz, Spiegel und Gurt kommen vor dem Losfahren.|Seat, mirrors and seatbelt come before setting off.'],['Wann müssen Sie den Warnblinker einschalten?|When must you switch on the hazard lights?',['bei einer Panne|in a breakdown','am Ende eines Staus|at the end of a traffic jam','beim Einparken|when parking'],'0 1','Der Warnblinker warnt andere vor Gefahr.|The hazard lights warn others of danger.'],['Wie groß soll der Abstand bei 100 km/h ungefähr sein?|About how big should the distance be at 100 km/h?',['etwa 50 Meter|about 50 metres','etwa 10 Meter|about 10 metres','etwa 1 Meter|about 1 metre'],'0','Faustregel: halber Tacho. Bei hundert also fünfzig Meter.|Rule of thumb: half the speedometer. At a hundred, that’s fifty metres.'],['Was machen Sie vor einem Spurwechsel?|What do you do before changing lanes?',['in den Spiegel schauen|look in the mirror','blinken|indicate','Schulterblick|shoulder check'],'0 1 2','Spiegel, Blinker, Schulterblick: Diese Reihenfolge lernt man in der Fahrschule.|Mirror, indicator, shoulder check: you learn this order at driving school.'],['Welches Pedal ist die Kupplung?|Which pedal is the clutch?',['das linke|the left one','das mittlere|the middle one','das rechte|the right one'],'0','Links die Kupplung, in der Mitte die Bremse, rechts das Gas.|Clutch on the left, brake in the middle, accelerator on the right.']]},

{id:'autobahn',title:'Auf der Autobahn',en:'On the motorway',focus:'wenn-Sätze · Notfall',
 story:['Auf vielen Abschnitten der Autobahn gibt es kein festes Tempolimit. Empfohlen sind aber hundertdreißig Kilometer pro Stunde.|On many motorway sections there is no fixed speed limit, but a hundred and thirty km/h is recommended.','Heute ist Stau. Alle Autos bilden eine Rettungsgasse, damit der Krankenwagen durchfahren kann.|Today there is a traffic jam. All cars form an emergency corridor so the ambulance can get through.','Auf dem Standstreifen hat ein Auto eine Panne. Der Fahrer trägt eine Warnweste und hat das Warndreieck aufgestellt.|On the hard shoulder a car has broken down. The driver is wearing a hi-vis vest and has set up the warning triangle.'],
 hs:{
 _bg:['die Autobahn|the motorway','die Autobahnen','Die Autobahn hat drei Spuren in jede Richtung.|The motorway has three lanes in each direction.','Auf der Autobahn darfst du nicht wenden und nicht rückwärts fahren.|On the motorway you may not turn around or reverse.','Das deutsche Autobahnnetz ist über dreizehntausend Kilometer lang.|The German motorway network is over thirteen thousand kilometres long.'],
 gegenfahrbahn:['die Gegenfahrbahn|the opposite carriageway','die Gegenfahrbahnen','Auf der Gegenfahrbahn kommen uns Autos entgegen.|On the opposite carriageway cars come towards us.','Die Mittelleitplanke trennt die Fahrbahnen. Du darfst sie nie überqueren.|The central barrier separates the carriageways. You may never cross it.','Wer auf der falschen Seite fährt, heißt Geisterfahrer. Das ist sehr gefährlich.|Someone driving on the wrong side is called a ghost driver. That is very dangerous.'],
 bruecke:['die Brücke|the bridge','die Brücken','Die Brücke führt über die Autobahn.|The bridge crosses the motorway.','Auf der Autobahn darfst du nirgends halten, auch nicht unter einer Brücke.|You may not stop anywhere on the motorway, not even under a bridge.','Im Winter ist es auf Brücken oft zuerst glatt.|In winter bridges are often the first to get icy.'],
 schild:['das Autobahnschild|the motorway sign','die Autobahnschilder','Das blaue Schild zeigt die A 7 nach Hamburg und die Ausfahrt Kassel.|The blue sign shows the A 7 to Hamburg and the Kassel exit.','Wenn du die Ausfahrt nimmst, musst du rechtzeitig nach rechts fahren und blinken.|If you take the exit, you must move to the right in good time and indicate.','Autobahnschilder sind blau. Wegweiser auf Landstraßen sind gelb.|Motorway signs are blue. Direction signs on country roads are yellow.'],
 richtgeschwindigkeit:['die Richtgeschwindigkeit|the recommended speed','die Richtgeschwindigkeiten','Auf dem blauen Schild steht hundertdreißig.|The blue sign says a hundred and thirty.','Hundertdreißig ist eine Empfehlung. Wo ein rundes Schild steht, darfst du nicht schneller fahren.|A hundred and thirty is a recommendation. Where there is a round sign, you may not drive faster.','Bei Regen, Nebel oder Schnee muss man langsamer fahren.|In rain, fog or snow you must drive more slowly.'],
 raststaette:['der Rasthof|the service area','die Rasthöfe','Das Schild zeigt eine Tankstelle und ein Restaurant.|The sign shows a petrol station and a restaurant.','Wenn du müde bist, musst du eine Pause machen.|If you are tired, you must take a break.','Experten empfehlen alle zwei Stunden eine Pause.|Experts recommend a break every two hours.'],
 leitplanke:['die Leitplanke|the crash barrier','die Leitplanken','Die Leitplanken sind aus Metall.|The crash barriers are made of metal.','Bei einer Panne sollst du hinter die Leitplanke gehen.|In a breakdown you should go behind the crash barrier.','Leitplanken halten Autos auf der Straße, wenn ein Unfall passiert.|Crash barriers keep cars on the road when an accident happens.'],
 stau:['der Stau|the traffic jam','die Staus','Viele Autos stehen hintereinander.|Many cars are standing one behind the other.','Wenn du einen Stau siehst, musst du den Warnblinker einschalten.|When you see a traffic jam, you must switch on the hazard lights.','In den Sommerferien gibt es auf den Autobahnen besonders viele Staus.|During the summer holidays there are especially many jams on the motorways.'],
 rettungsgasse:['die Rettungsgasse|the emergency corridor','die Rettungsgassen','Zwischen der linken und der mittleren Spur ist Platz frei.|There is space between the left and the middle lane.','Im Stau musst du sofort eine Rettungsgasse bilden: Ganz links nach links, alle anderen nach rechts.|In a jam you must form an emergency corridor at once: the far left lane moves left, all others move right.','Wer keine Rettungsgasse bildet, muss bis zu dreihundertzwanzig Euro zahlen.|Anyone who doesn’t form a corridor pays up to three hundred and twenty euros.'],
 krankenwagen:['der Krankenwagen|the ambulance','die Krankenwagen','Der Krankenwagen hat blaue Lichter.|The ambulance has blue lights.','Wenn du Blaulicht und Martinshorn hörst, musst du sofort Platz machen.|When you see blue lights and hear the siren, you must make way at once.','Den Notruf für Rettungsdienst und Feuerwehr erreicht man unter einhundertzwölf.|You reach the emergency number for ambulance and fire brigade at one-one-two.'],
 lkw:['der Lastwagen|the lorry','die Lastwagen','Der Lastwagen ist groß und weiß.|The lorry is big and white.','Große Lastwagen dürfen auf der Autobahn höchstens achtzig fahren.|Big lorries may drive at most eighty on the motorway.','Am Sonntag dürfen große Lastwagen meistens nicht fahren.|On Sundays big lorries are usually not allowed to drive.'],
 standstreifen:['der Standstreifen|the hard shoulder','die Standstreifen','Der Standstreifen ist ganz rechts.|The hard shoulder is on the far right.','Auf dem Standstreifen darfst du nur bei einer Panne halten.|You may only stop on the hard shoulder in a breakdown.','Man nennt ihn auch Seitenstreifen.|It is also called the side strip.'],
 panne:['die Panne|the breakdown','die Pannen','Das blaue Auto hat eine Panne. Die Warnblinker leuchten.|The blue car has broken down. The hazard lights are on.','Bei einer Panne musst du zuerst die Warnweste anziehen und dann das Warndreieck aufstellen.|In a breakdown you must first put on the vest and then set up the warning triangle.','Hilfe bekommt man zum Beispiel von einem Automobilclub oder von der Versicherung.|You can get help from an automobile club or from your insurance, for example.'],
 warndreieck:['das Warndreieck|the warning triangle','die Warndreiecke','Das Warndreieck ist rot und weiß.|The warning triangle is red and white.','Auf der Autobahn musst du das Warndreieck etwa hundert Meter hinter dem Auto aufstellen.|On the motorway you must place the triangle about a hundred metres behind the car.','In der Stadt reichen etwa fünfzig Meter.|In town about fifty metres is enough.'],
 warnweste:['die Warnweste|the hi-vis vest','die Warnwesten','Der Mann trägt eine gelbe Warnweste und telefoniert.|The man is wearing a yellow hi-vis vest and is on the phone.','Steig bei einer Panne nie ohne Warnweste aus!|Never get out without a hi-vis vest when you break down!','In jedem Auto muss mindestens eine Warnweste sein.|Every car must have at least one hi-vis vest.'],
 notrufsaeule:['die Notrufsäule|the emergency phone','die Notrufsäulen','Die Notrufsäule ist orange.|The emergency phone is orange.','Wenn du kein Handy hast, kannst du an der Notrufsäule Hilfe rufen.|If you have no phone, you can call for help at the emergency phone.','Kleine Pfeile an den Pfosten zeigen den Weg zur nächsten Notrufsäule.|Small arrows on the posts show the way to the nearest emergency phone.'],
 },
 react:[['Ein Krankenwagen kommt! Wo ist er? Schnell!|An ambulance is coming! Where is it? Quick!','krankenwagen'],['Panne! Wo musst du warten? Tippe schnell!|Breakdown! Where must you wait? Tap quickly!','warnweste leitplanke'],['Achtung, Stau! Tippe schnell auf den Stau!|Careful, traffic jam! Quickly tap the jam!','stau'],['Du bist müde. Wo kannst du eine Pause machen?|You are tired. Where can you take a break?','raststaette'],['Du hast kein Handy. Wo kannst du Hilfe rufen?|You have no phone. Where can you call for help?','notrufsaeule'],['Wo steht das Warndreieck? Schnell!|Where is the warning triangle? Quick!','warndreieck']],
 darf:[['Auf der Autobahn wenden.|Turn around on the motorway.','nicht','Das ist streng verboten.|That is strictly forbidden.'],['Im Stau eine Rettungsgasse bilden.|Form an emergency corridor in a jam.','muss','Sofort, auch wenn noch kein Krankenwagen kommt.|At once, even if no ambulance is coming yet.'],['Auf dem Standstreifen eine Pause machen.|Take a break on the hard shoulder.','nicht','Nur bei einer Panne. Für Pausen gibt es Rastplätze.|Only in a breakdown. There are rest areas for breaks.'],['Hundertdreißig fahren, wenn kein Schild da ist.|Drive a hundred and thirty if there is no sign.','darf','Das ist erlaubt und sogar empfohlen.|That is allowed and even recommended.'],['Bei einer Panne eine Warnweste anziehen.|Put on a hi-vis vest in a breakdown.','muss','Sonst sehen dich die anderen nicht gut.|Otherwise others can’t see you well.'],['Auf der Autobahn rechts überholen.|Overtake on the right on the motorway.','nicht','Auf der Autobahn überholt man links.|On the motorway you overtake on the left.']],
 pruef:[['Sie kommen in einen Stau. Was tun Sie?|You come into a traffic jam. What do you do?',['den Warnblinker einschalten|switch on the hazard lights','eine Rettungsgasse bilden|form an emergency corridor','auf dem Standstreifen vorbeifahren|drive past on the hard shoulder'],'0 1','Den Standstreifen darf man nicht benutzen.|You may not use the hard shoulder.'],['Wo bilden Sie bei drei Spuren die Rettungsgasse?|Where do you form the corridor with three lanes?',['zwischen der linken und der mittleren Spur|between the left and the middle lane','zwischen der mittleren und der rechten Spur|between the middle and the right lane','auf dem Standstreifen|on the hard shoulder'],'0','Wer ganz links fährt, fährt nach links. Alle anderen fahren nach rechts.|The far left lane moves left. All others move right.'],['Was tun Sie bei einer Panne auf der Autobahn?|What do you do when you break down on the motorway?',['die Warnweste anziehen|put on the hi-vis vest','das Warndreieck aufstellen|set up the warning triangle','im Auto sitzen bleiben|stay sitting in the car'],'0 1','Danach wartet man hinter der Leitplanke auf Hilfe.|Then you wait for help behind the crash barrier.'],['Wie weit hinter dem Auto stellen Sie das Warndreieck auf der Autobahn auf?|How far behind the car do you place the triangle on the motorway?',['etwa 100 Meter|about 100 metres','etwa 5 Meter|about 5 metres','etwa 1 Kilometer|about 1 kilometre'],'0','Auf der Autobahn etwa hundert Meter, in der Stadt etwa fünfzig.|About a hundred metres on the motorway, about fifty in town.'],['Welche Nummer wählen Sie bei einem Unfall mit Verletzten?|Which number do you call for an accident with injuries?',['112|112','118|118','0800|0800'],'0','Unter einhundertzwölf erreicht man Rettungsdienst und Feuerwehr, unter einhundertzehn die Polizei.|One-one-two reaches the ambulance and fire brigade, one-one-zero the police.']]},

{id:'zug',title:'Im Zug',en:'On the train',focus:'Höflichkeit · sollen',
 story:['Wer kein Auto hat, fährt mit dem Zug. Mit dem Deutschlandticket fährt man im Nahverkehr durch ganz Deutschland.|If you don’t have a car, you take the train. With the Deutschlandticket you can use local transport all over Germany.','Im Fernzug, zum Beispiel im ICE, braucht man eine normale Fahrkarte und kann einen Sitzplatz reservieren.|On a long-distance train like the ICE you need a normal ticket and can reserve a seat.','Auch im Zug gibt es Regeln: Im Ruhebereich soll man leise sein, und das Gepäck gehört in die Ablage.|There are rules on the train too: in the quiet zone you should be quiet, and luggage belongs on the rack.'],
 hs:{
 _bg:['der Wagen|the carriage','die Wagen','Der Wagen ist lang und hat viele blaue Sitze.|The carriage is long and has many blue seats.','Im Zug sollst du dein Gepäck nicht in den Gang stellen.|On the train you shouldn’t put your luggage in the aisle.','Ein ICE kann bis zu dreihundert Kilometer pro Stunde fahren.|An ICE can go up to three hundred kilometres per hour.'],
 anzeige:['die Anzeige|the display','die Anzeigen','Die Anzeige zeigt den nächsten Halt: Kassel.|The display shows the next stop: Kassel.','Achte auf die Anzeige, damit du deinen Halt nicht verpasst.|Watch the display so that you don’t miss your stop.','Bei einer Verspätung von sechzig Minuten oder mehr bekommt man Geld zurück.|With a delay of sixty minutes or more you get money back.'],
 tuer:['die Tür|the door','die Türen','Die Tür ist am Ende vom Wagen.|The door is at the end of the carriage.','Solange der Zug fährt, darfst du die Tür nicht öffnen.|As long as the train is moving, you may not open the door.','Man drückt auf den grünen Knopf, dann öffnet sich die Tür.|You press the green button, then the door opens.'],
 ruhebereich:['der Ruhebereich|the quiet zone','die Ruhebereiche','Das Schild zeigt ein durchgestrichenes Telefon.|The sign shows a crossed-out phone.','Im Ruhebereich darfst du nicht telefonieren und sollst leise sprechen.|In the quiet zone you may not make calls and should speak quietly.','Wer arbeiten oder schlafen möchte, reserviert gern im Ruhebereich.|People who want to work or sleep like to reserve in the quiet zone.'],
 notbremse:['die Notbremse|the emergency brake','die Notbremsen','Die Notbremse ist rot.|The emergency brake is red.','Die Notbremse darfst du nur bei echter Gefahr ziehen.|You may only pull the emergency brake in real danger.','Wer die Notbremse ohne Grund zieht, muss viel Geld zahlen.|Anyone who pulls it without a reason has to pay a lot of money.'],
 zugbegleiterin:['die Zugbegleiterin|the conductor','die Zugbegleiterinnen','Die Zugbegleiterin kontrolliert die Fahrkarten.|The conductor checks the tickets.','Wenn sie fragt, musst du deine Fahrkarte zeigen.|When she asks, you must show your ticket.','Ohne Fahrkarte muss man mindestens sechzig Euro zahlen.|Without a ticket you have to pay at least sixty euros.'],
 fahrgast:['der Fahrgast|the passenger','die Fahrgäste','Der Fahrgast zeigt sein Ticket auf dem Handy.|The passenger shows his ticket on his phone.','Wenn dein Ticket persönlich ist, sollst du einen Ausweis dabeihaben.|If your ticket is personal, you should carry ID.','Fahrgäste nennt man auch Reisende.|Passengers are also called travellers.'],
 handyticket:['das Handyticket|the mobile ticket','die Handytickets','Auf dem Handy ist ein schwarzweißer Code.|There is a black-and-white code on the phone.','Dein Akku muss voll genug sein, damit du das Ticket zeigen kannst.|Your battery must be charged enough so that you can show the ticket.','Viele Menschen kaufen ihre Fahrkarte heute in der App.|Many people buy their ticket in the app today.'],
 gepaeckablage:['die Gepäckablage|the luggage rack','die Gepäckablagen','Die Gepäckablage ist über den Fenstern.|The luggage rack is above the windows.','Schwere Koffer sollst du nicht nach oben legen, sondern zwischen die Sitze stellen.|You shouldn’t put heavy suitcases up there, but between the seats.','Große Koffer kann man auch am Ende vom Wagen abstellen.|You can also leave big suitcases at the end of the carriage.'],
 koffer:['der Koffer|the suitcase','die Koffer','Oben liegt ein blauer Koffer.|A blue suitcase lies up on the rack.','Lass dein Gepäck nie allein!|Never leave your luggage unattended!','Vergessene Koffer landen im Fundbüro der Bahn.|Forgotten suitcases end up in the railway’s lost property office.'],
 fenster:['das Fenster|the window','die Fenster','Draußen sieht man Felder und ein Windrad.|Outside you can see fields and a wind turbine.','Die Fenster im ICE darfst du nicht öffnen. Man kann es auch gar nicht.|You may not open the windows on the ICE. In fact you can’t.','Viele Leute reservieren gern einen Fensterplatz.|Many people like to reserve a window seat.'],

 _bg:['die Küche|the kitchen','die Küchen','In der Küche ist es warm und es riecht gut.|It’s warm in the kitchen and it smells good.','Heute ist Backtag bei Familie Bär.|Today is baking day at the bear family’s home.','backen, Perfekt: Wir haben gebacken.|“backen”, perfect tense: Wir haben gebacken.'],
 rezept:['das Rezept|the recipe','die Rezepte','Das Rezept liegt offen auf dem Tisch.|The recipe is lying open on the table.',['mama: Hört zu: Nehmt zweihundert Gramm Mehl und drei Eier.|Listen: take two hundred grams of flour and three eggs.'],'Im Rezept steht der Imperativ: Nimm! Rühr! Gib! Für zwei Personen: Nehmt! Rührt!|Recipes use the imperative: Nimm! Rühr! Gib! For two people: Nehmt! Rührt!'],
 mehl:['das Mehl|the flour','','Das Mehl ist in einer Tüte. Es ist weiß.|The flour is in a bag. It is white.','mila: Zweihundert Gramm Mehl. Ich wiege es ab.|Two hundred grams of flour. I’ll weigh it.','Mehl hat keinen Plural: ein Kilo Mehl, zweihundert Gramm Mehl.|“Mehl” has no plural: a kilo of flour, two hundred grams of flour.'],
 zucker:['der Zucker|the sugar','','Der Zucker ist in einem Glas.|The sugar is in a jar.','mama: Gib bitte hundertfünfzig Gramm Zucker dazu.|Please add a hundred and fifty grams of sugar.','dazugeben ist trennbar: Gib den Zucker dazu!|“dazugeben” is separable: Gib den Zucker dazu!'],
 eier:['das Ei|the egg','die Eier','Im Eierkarton sind noch drei Eier.|There are still three eggs in the egg box.','ben: Darf ich die Eier aufschlagen?|May I crack the eggs?','das Ei, die Eier. Zwölf Eier sind ein Dutzend.|das Ei, die Eier. Twelve eggs are a dozen.'],
 butter:['die Butter|the butter','','Die Butter liegt auf einem Teller.|The butter is on a plate.','mama: Die Butter muss weich sein.|The butter must be soft.','weich und hart: Die Butter aus dem Kühlschrank ist hart.|soft and hard: butter from the fridge is hard.'],
 milch:['die Milch|the milk','','Die Milch ist in einer Flasche.|The milk is in a bottle.','mama: Jetzt noch hundert Milliliter Milch.|Now another hundred millilitres of milk.','Für Flüssigkeiten sagt man Liter und Milliliter: ein Liter Milch.|For liquids you say litres and millilitres: a litre of milk.'],
 schokolade:['die Schokolade|the chocolate','','Die Schokolade ist dunkel. Ein Stück fehlt schon!|The chocolate is dark. One piece is already missing!',['ben: Mmh, ich probiere nur ein kleines Stück …|Mmm, I’m just trying a little piece …','mama: Ben! Die Schokolade ist für den Kuchen!|Ben! The chocolate is for the cake!'],'eine Tafel Schokolade, ein Stück Schokolade: So zählt man Schokolade.|a bar of chocolate, a piece of chocolate: that’s how you count chocolate.'],
 schuessel:['die Schüssel|the bowl','die Schüsseln','Die Schüssel ist groß und gelb.|The bowl is big and yellow.','ben: Darf ich nachher die Schüssel auslecken?|May I lick out the bowl afterwards?','In die Schüssel: Wohin? Akkusativ. In der Schüssel: Wo? Dativ.|Into the bowl: where to? Accusative. In the bowl: where? Dative.'],
 kochloeffel:['der Kochlöffel|the wooden spoon','die Kochlöffel','Ben rührt mit einem Kochlöffel.|Ben is stirring with a wooden spoon.','ben: Ich rühre ganz schnell!|I’m stirring really fast!','Rühr den Teig! Der Teig ist die Masse für den Kuchen.|Stir the batter! “Der Teig” is the mixture for the cake.'],
 waage:['die Küchenwaage|the kitchen scales','die Küchenwaagen','Auf der Waage steht: zweihundert Gramm.|The scales show two hundred grams.','mila: Genau zweihundert Gramm! Fertig.|Exactly two hundred grams! Done.','Ein Kilo hat tausend Gramm. Ein Pfund hat fünfhundert Gramm.|A kilo has a thousand grams. A pound (Pfund) has five hundred grams.'],
 backform:['die Backform|the cake tin','die Backformen','Die Backform ist rund.|The cake tin is round.','mama: Jetzt kommt der Teig in die Backform.|Now the batter goes into the cake tin.','rund, eckig, oval: Die Backform ist rund.|round, square, oval: the cake tin is round.'],
 backofen:['der Backofen|the oven','die Backöfen','Der Backofen ist an. Er hat hundertachtzig Grad.|The oven is on. It is at a hundred and eighty degrees.','mama: Der Kuchen bleibt fünfzig Minuten im Ofen.|The cake stays in the oven for fifty minutes.','Backofen oder Ofen: Beide Wörter sind richtig.|“Backofen” or “Ofen”: both words are correct.'],
 schuerze:['die Schürze|the apron','die Schürzen','Mila trägt eine Schürze mit Punkten.|Mila is wearing an apron with dots.','mila: Mit der Schürze bleibt mein Kleid sauber.|With the apron my dress stays clean.','tragen: ich trage, du trägst, sie trägt eine Schürze.|“tragen”: I wear, you wear, she wears an apron.'],
 kerzen:['die Kerze|the candle','die Kerzen','Auf dem Tisch liegen zwei Kerzen: eine Sieben und eine Null.|Two candles are lying on the table: a seven and a zero.','mila: Siebzig! Die Kerzen kommen später auf den Kuchen.|Seventy! The candles go on the cake later.','Achtung: siebzehn ist 17, siebzig ist 70.|Watch out: siebzehn is 17, siebzig is 70.'],
 mama:['Mama Bär|Mum Bear','','Mama liest das Rezept.|Mum is reading the recipe.',['mama: Zuerst die Butter und den Zucker, dann die Eier.|First the butter and the sugar, then the eggs.'],'zuerst, dann, danach, zum Schluss: So sagt man die Reihenfolge.|first, then, after that, finally: that’s how you give the order.'],
 mila:['Mila','','Mila wiegt das Mehl.|Mila is weighing the flour.',['mila: Mama, ist das genug Mehl?|Mum, is that enough flour?'],'genug: Ist das genug? Nein, wir brauchen noch mehr.|“genug”: is that enough? No, we need some more.'],
 ben:['Ben','','Ben rührt den Teig. Er hat Mehl auf der Nase.|Ben is stirring the batter. He has flour on his nose.',['ben: Hatschi! Mehl in der Nase!|Atchoo! Flour in my nose!','mama: Gesundheit, Ben!|Bless you, Ben!'],'Wenn jemand niest, sagt man: Gesundheit!|When someone sneezes, you say: Gesundheit!'],
 },
 dlg:[['mama: Kannst du mir bitte die Eier geben?|Can you give me the eggs please?',['Ja, klar. Hier sind die Eier.|Sure. Here are the eggs.','Nein, ich habe Durst.|No, I’m thirsty.','Die Eier sind am Sonntag.|The eggs are on Sunday.']],
  ['mila: Wie viel Mehl brauchen wir?|How much flour do we need?',['Zweihundert Gramm.|Two hundred grams.','Um zwei Uhr.|At two o’clock.','Mit dem Bus.|By bus.']],

  ['ben: Darf ich die Schüssel auslecken?|May I lick out the bowl?',['Ja, aber erst nach dem Backen.|Yes, but only after baking.','Ja, sie ist rund.|Yes, it’s round.','Nein, ich bin Mila.|No, I’m Mila.']],
  ['mama: Riechst du das?|Can you smell that?',['Ja! Es riecht nach Schokolade.|Yes! It smells of chocolate.','Ja, es ist kalt.|Yes, it’s cold.','Nein, das ist mein Ball.|No, that’s my ball.']],
  ['mila: Ist der Kuchen schon fertig?|Is the cake ready yet?',['Noch nicht. Noch zehn Minuten.|Not yet. Ten more minutes.','Ja, er ist blau.|Yes, it’s blue.','Ich wohne in Berlin.|I live in Berlin.']]],
 tf:[['In den Kuchen kommt Schokolade.|The cake has chocolate in it.',1,'schokolade'],['Mila wiegt zweihundert Gramm Mehl.|Mila weighs two hundred grams of flour.',1,'waage'],['Der Backofen hat hundert Grad.|The oven is at a hundred degrees.',0,'backofen','Nein. Der Backofen hat hundertachtzig Grad.|No. The oven is at a hundred and eighty degrees.'],

  ['Die Backform ist eckig.|The cake tin is square.',0,'backform','Nein. Die Backform ist rund.|No. The cake tin is round.'],['Mila trägt eine Schürze.|Mila is wearing an apron.',1,'schuerze']]},

{id:'ueberraschung',title:'Überraschung!',en:'Surprise!',focus:'Wo? hinter, vor, neben + Dativ',
 story:['Um drei Uhr fährt Familie Bär zu Oma. Herr Igel öffnet leise das Gartentor.|At three o’clock the bear family drives to Grandma’s. Mr Hedgehog quietly opens the garden gate.','Mila klingelt, und alle verstecken sich schnell hinter der Hecke.|Mila rings the bell and everyone quickly hides behind the hedge.','Oma öffnet die Tür und alle rufen: Überraschung!|Grandma opens the door and everyone shouts: Surprise!'],
 hs:{
 _bg:['der Vorgarten|the front garden','die Vorgärten','Vor Omas Haus ist ein kleiner Garten.|In front of Grandma’s house there is a small garden.','Es ist warm und die Sonne scheint. Ein perfekter Tag für eine Party!|It’s warm and the sun is shining. A perfect day for a party!','vor + Dativ: Der Vorgarten ist vor dem Haus, der Garten ist hinter dem Haus.|“vor” + dative: the front garden is in front of the house, the garden is behind the house.'],
 haus:['das Haus|the house','die Häuser','Omas Haus ist klein und hat ein rotes Dach.|Grandma’s house is small and has a red roof.','Hier wohnt Oma Erna schon seit vierzig Jahren.|Grandma Erna has lived here for forty years.','seit + Dativ: seit vierzig Jahren, seit einem Jahr.|“seit” + dative: for forty years, for a year.'],
 tuer:['die Haustür|the front door','die Haustüren','Die Haustür ist grün und steht offen.|The front door is green and open.','oma: Nanu? Wer klingelt denn da?|Hello? Who’s ringing the bell?','offen und zu: Die Tür ist offen. Am Abend ist die Tür zu.|open and closed: the door is open. In the evening the door is closed.'],
 klingel:['die Klingel|the doorbell','die Klingeln','Die Klingel ist neben der Tür.|The doorbell is next to the door.','Ding, dong! Mila hat geklingelt.|Ding dong! Mila has rung the bell.','neben + Dativ: neben der Tür, neben dem Fenster.|“neben” + dative: next to the door, next to the window.'],
 briefkasten:['der Briefkasten|the letterbox','die Briefkästen','Am Gartentor hängt ein Briefkasten.|A letterbox hangs on the garden gate.','Auf dem Briefkasten steht: E. Bär.|The letterbox says: E. Bär.','Auf deutschen Briefkästen steht der Name. So kommt die Post an.|German letterboxes have the name on them. That’s how the post arrives.'],
 hecke:['die Hecke|the hedge','die Hecken','Die Hecke ist hoch und grün.|The hedge is tall and green.',['ben: Psst! Ich bin ganz leise.|Shh! I’m being very quiet.','mila: Hinter der Hecke sieht Oma uns nicht.|Behind the hedge Grandma can’t see us.'],'hinter + Dativ: Die Familie steht hinter der Hecke.|“hinter” + dative: the family is standing behind the hedge.'],
 gartentor:['das Gartentor|the garden gate','die Gartentore','Das Gartentor ist aus Holz und steht offen.|The garden gate is made of wood and is open.','igel: Kommt rein, aber leise!|Come in, but quietly!','Ein Tor ist groß, eine Tür ist kleiner: das Gartentor, aber die Haustür.|A gate (Tor) is big, a door (Tür) is smaller: das Gartentor, but die Haustür.'],
 zaun:['der Zaun|the fence','die Zäune','Der Zaun ist weiß.|The fence is white.','Über den Zaun schaut Herr Igel und lacht.|Mr Hedgehog looks over the fence and laughs.','über den Zaun schauen: Wohin? Akkusativ.|look over the fence: where to? Accusative.'],
 rosen:['die Rose|the rose','die Rosen','Die Rosen sind rot und rosa.|The roses are red and pink.','oma: Meine Rosen blühen dieses Jahr so schön!|My roses are blooming so beautifully this year!','Die Rose ist Omas Lieblingsblume.|The rose is Grandma’s favourite flower.'],
 auto:['das Auto|the car','die Autos','Das Auto von Familie Bär ist blau.|The bear family’s car is blue.','papa: Ich parke um die Ecke. Oma darf das Auto nicht sehen!|I’ll park round the corner. Grandma mustn’t see the car!','mit + Dativ: Wir fahren mit dem Auto.|“mit” + dative: we go by car.'],
 luftballons:['der Luftballon|the balloon','die Luftballons','Ben hält drei Luftballons: rot, gelb und blau.|Ben is holding three balloons: red, yellow and blue.','ben: Ich halte die Luftballons ganz fest!|I’m holding the balloons really tight!','die Luft und der Ballon: der Luftballon.|“die Luft” and “der Ballon”: der Luftballon.'],
 geschenk:['das Geschenk|the present','die Geschenke','Mila hält das Geschenk mit der roten Schleife.|Mila is holding the present with the red bow.','mila: Hoffentlich gefällt Oma die Tasse!|I hope Grandma likes the cup!','hoffentlich heißt: I hope. Hoffentlich scheint die Sonne!|“hoffentlich” means: I hope. I hope the sun shines!'],
 kuchen:['der Kuchen|the cake','die Kuchen','Mama trägt den Kuchen auf einer Kuchenplatte.|Mum is carrying the cake on a cake plate.','mama: Vorsicht mit dem Kuchen! Er ist noch warm.|Careful with the cake! It’s still warm.','der Kuchen, die Kuchen: Singular und Plural sind gleich.|der Kuchen, die Kuchen: singular and plural are the same.'],
 blumenstrauss:['der Blumenstrauß|the bunch of flowers','die Blumensträuße','Papa versteckt den Blumenstrauß hinter dem Rücken.|Dad is hiding the bunch of flowers behind his back.','papa: Die Tulpen sind für dich, Mama!|The tulips are for you, Mum!','Papa sagt zu Oma Mama, denn sie ist seine Mutter.|Dad calls Grandma Mum, because she is his mother.'],
 nachbar:['der Nachbar|the neighbour','die Nachbarn','Herr Igel ist Omas Nachbar. Er hat einen Strohhut.|Mr Hedgehog is Grandma’s neighbour. He has a straw hat.',['igel: Ich habe nichts gesagt! Es ist ein Geheimnis.|I didn’t say anything! It’s a secret.'],'der Nachbar, die Nachbarin: Nachbarn wohnen neben uns.|der Nachbar, die Nachbarin: neighbours live next to us.'],
 oma:['Oma Erna|Grandma Erna','','Oma steht in der Tür und lacht.|Grandma is standing in the doorway and laughing.',['oma: Nein! Das ist ja eine Überraschung!|No! What a surprise!','oma: Meine Lieben! Kommt herein!|My dears! Come in!'],'Oma ist die Mutter von Papa. Papa ist ihr Sohn.|Grandma is Dad’s mother. Dad is her son.'],
 mila:['Mila','','Mila springt hinter der Hecke hervor.|Mila jumps out from behind the hedge.',['mila: Überraschung! Alles Gute zum Geburtstag, Oma!|Surprise! Happy birthday, Grandma!'],'Alles Gute zum Geburtstag! So gratuliert man in Deutschland.|Alles Gute zum Geburtstag! That’s how you say happy birthday in Germany.'],
 ben:['Ben','','Ben hat drei Luftballons in der Hand.|Ben has three balloons in his hand.',['ben: Überraschung! Oma, du bist jetzt siebzig!|Surprise! Grandma, you’re seventy now!'],'Kinder sagen zu ihrer Großmutter oft Oma und zum Großvater Opa.|Children often call their grandmother Oma and their grandfather Opa.'],
 mama:['Mama Bär|Mum Bear','','Mama trägt den Kuchen.|Mum is carrying the cake.',['mama: Herzlichen Glückwunsch, Erna!|Congratulations, Erna!'],'Herzlichen Glückwunsch zum Geburtstag! Das sagt man auch zu Erwachsenen.|Herzlichen Glückwunsch zum Geburtstag! You say that to grown-ups too.'],
 papa:['Papa Bär|Dad Bear','','Papa steht hinter der Hecke und lacht.|Dad is standing behind the hedge and laughing.',['papa: Alles Gute, Mama!|All the best, Mum!'],'hinter dem Rücken: hinter + Dativ.|behind his back: “hinter” + dative.'],
 },
 dlg:[['oma: Nanu! Was macht ihr denn hier?|Well! What are you doing here?',['Überraschung! Wir feiern deinen Geburtstag!|Surprise! We’re celebrating your birthday!','Wir kaufen Brötchen.|We’re buying rolls.','Es regnet.|It’s raining.']],
  ['oma: Ist das Geschenk für mich?|Is the present for me?',['Ja, das ist für dich. Alles Gute!|Yes, that’s for you. All the best!','Nein, das ist ein Hund.|No, that’s a dog.','Ja, um halb vier.|Yes, at half past three.']],
  ['igel: Hat Oma etwas gemerkt?|Did Grandma notice anything?',['Nein, sie hat nichts gemerkt!|No, she didn’t notice anything!','Ja, der Zaun ist weiß.|Yes, the fence is white.','Nein, ich esse keinen Kuchen.|No, I don’t eat cake.']],
  ['oma: Wer hat denn geklingelt?|Who rang the bell?',['Mila hat geklingelt!|Mila rang the bell!','Mit dem Auto.|By car.','Drei Luftballons.|Three balloons.']],
  ['mama: Wo ist denn Herr Igel?|Where is Mr Hedgehog?',['Dort, hinter dem Zaun!|Over there, behind the fence!','Am Sonntag.|On Sunday.','Er ist rund.|It’s round.']],
  ['oma: Kommt doch herein!|Do come in!',['Danke schön, gern!|Thank you, gladly!','Gute Nacht, Oma!|Good night, Grandma!','Ich habe keine Zeit, tschüss!|I have no time, bye!']]],
 tf:[['Die Familie versteckt sich hinter der Hecke.|The family is hiding behind the hedge.',1,'hecke'],['Omas Haustür ist rot.|Grandma’s front door is red.',0,'tuer','Nein. Die Haustür ist grün.|No. The front door is green.'],['Herr Igel ist Omas Nachbar.|Mr Hedgehog is Grandma’s neighbour.',1,'nachbar'],
  ['Ben hält fünf Luftballons.|Ben is holding five balloons.',0,'luftballons','Nein. Ben hält drei Luftballons.|No. Ben is holding three balloons.'],['Die Klingel ist neben der Tür.|The doorbell is next to the door.',1,'klingel'],
  ['Oma ist die Mutter von Mama.|Grandma is Mum’s mother.',0,'oma','Nein. Oma ist die Mutter von Papa.|No. Grandma is Dad’s mother.'],['Das Auto ist blau.|The car is blue.',1,'auto']]},

{id:'feier',title:'Die Feier',en:'The party',focus:'Perfekt · Glückwünsche',
 story:['Im Garten hinter dem Haus decken alle zusammen den Tisch.|In the garden behind the house everyone sets the table together.','Alle singen: Zum Geburtstag viel Glück! Oma pustet die Kerzen aus.|Everyone sings: Happy birthday to you! Grandma blows out the candles.','Oma packt die Tasse aus und trinkt sofort einen Tee daraus. Was für ein schöner Tag!|Grandma unwraps the cup and drinks a tea from it straight away. What a lovely day!'],
 hs:{
 _bg:['der Garten|the garden','die Gärten','Hinter dem Haus ist ein großer Garten.|Behind the house there is a big garden.','Die Sonne scheint, die Vögel singen. Alle sind fröhlich.|The sun is shining, the birds are singing. Everyone is happy.','Bei schönem Wetter feiert man in Deutschland gern draußen im Garten.|In nice weather people in Germany like to celebrate outside in the garden.'],
 kuchen:['der Geburtstagskuchen|the birthday cake','die Geburtstagskuchen','Der Schokoladenkuchen steht in der Mitte vom Tisch.|The chocolate cake is in the middle of the table.','oma: Der Kuchen ist so lecker! Habt ihr ihn selbst gebacken?|The cake is so tasty! Did you bake it yourselves?','selbst gebacken heißt homemade. Perfekt: Wir haben den Kuchen gebacken.|“selbst gebacken” means homemade. Perfect tense: Wir haben den Kuchen gebacken.'],
 kerzen:['die Kerze|the candle','die Kerzen','Auf dem Kuchen stehen zwei Kerzen: eine Sieben und eine Null.|Two candles are on the cake: a seven and a zero.',['Alle singen: Zum Geburtstag viel Glück!|Everyone sings: Happy birthday to you!','oma: Pfff! Alle Kerzen sind aus!|Pfff! All the candles are out!'],'Man pustet die Kerzen aus und wünscht sich etwas. Den Wunsch verrät man nicht!|You blow out the candles and make a wish. You don’t tell anyone the wish!'],
 tisch:['der Gartentisch|the garden table','die Gartentische','Auf dem Tisch liegt eine weiße Tischdecke.|There is a white tablecloth on the table.','mama: Kommt, wir decken den Tisch!|Come on, let’s set the table!','den Tisch decken heißt to set the table. Nach dem Essen räumt man den Tisch ab.|“den Tisch decken” means to set the table. After the meal you clear the table.'],
 teller:['der Teller|the plate','die Teller','Auf jedem Teller liegt ein Stück Kuchen.|There is a piece of cake on every plate.','ben: Ich möchte das größte Stück!|I want the biggest piece!','groß, größer, am größten: das größte Stück.|big, bigger, the biggest: the biggest piece.'],
 kaffeekanne:['die Kaffeekanne|the coffee pot','die Kaffeekannen','Die Kaffeekanne ist weiß und dampft.|The coffee pot is white and steaming.','papa: Wer möchte noch Kaffee?|Who would like more coffee?','Am Sonntagnachmittag gibt es in Deutschland oft Kaffee und Kuchen.|On Sunday afternoons in Germany there is often coffee and cake.'],
 saft:['der Saft|the juice','die Säfte','Der Apfelsaft ist in einem Krug.|The apple juice is in a jug.','mila: Für mich bitte Apfelsaft!|Apple juice for me, please!','Viele Kinder in Deutschland trinken Apfelschorle: Apfelsaft mit Wasser.|Many children in Germany drink Apfelschorle: apple juice with water.'],
 geschenk:['das Geschenk|the present','die Geschenke','Das Geschenk ist ausgepackt: Es ist die Tasse mit den Rosen.|The present is unwrapped: it’s the cup with the roses.',['oma: Oh, eine Tasse mit Rosen! Die ist wunderschön. Vielen Dank!|Oh, a cup with roses! It’s beautiful. Thank you so much!'],'auspacken, Perfekt: Oma hat das Geschenk ausgepackt.|“auspacken”, perfect tense: Grandma has unwrapped the present.'],
 girlande:['die Girlande|the paper chain','die Girlanden','Bens Girlande hängt zwischen zwei Bäumen.|Ben’s paper chain hangs between two trees.','ben: Die habe ich gemacht! Ganz allein!|I made that! All by myself!','zwischen + Dativ: zwischen den Bäumen.|“zwischen” + dative: between the trees.'],
 lampions:['der Lampion|the paper lantern','die Lampions','Die Lampions sind bunt und hängen über dem Tisch.|The paper lanterns are colourful and hang above the table.','Am Abend leuchten die Lampions.|In the evening the lanterns glow.','über + Dativ: Die Lampions hängen über dem Tisch.|“über” + dative: the lanterns hang above the table.'],
 luftballons:['der Luftballon|the balloon','die Luftballons','Die Luftballons sind an einem Stuhl festgebunden. Einer fliegt weg!|The balloons are tied to a chair. One is flying away!','ben: Tschüss, Luftballon!|Bye-bye, balloon!','festbinden ist trennbar: Wir binden die Luftballons fest.|“festbinden” is separable: Wir binden die Luftballons fest.'],
 karte:['die Geburtstagskarte|the birthday card','die Geburtstagskarten','Milas Karte steht neben Omas Teller.|Mila’s card stands next to Grandma’s plate.','oma: Mila, die Karte ist so schön! Die stelle ich ins Regal.|Mila, the card is so lovely! I’ll put it on the shelf.','stellen, Wohin? ins Regal (Akkusativ). stehen, Wo? im Regal (Dativ).|“stellen”, where to? onto the shelf (accusative). “stehen”, where? on the shelf (dative).'],
 gartenstuhl:['der Gartenstuhl|the garden chair','die Gartenstühle','Die Gartenstühle sind aus Holz.|The garden chairs are made of wood.','oma: Setzt euch, setzt euch!|Sit down, sit down!','sich setzen, Wohin? Ich setze mich auf den Stuhl.|“sich setzen”, where to? I sit down on the chair.'],
 baum:['der Apfelbaum|the apple tree','die Apfelbäume','Der Apfelbaum blüht weiß und rosa.|The apple tree is blossoming white and pink.','oma: Den Baum hat Opa vor fünfzig Jahren gepflanzt.|Grandpa planted the tree fifty years ago.','vor fünfzig Jahren heißt fifty years ago.|“vor fünfzig Jahren” means fifty years ago.'],
 nachbar:['der Nachbar|the neighbour','die Nachbarn','Herr Igel hat Erdbeeren aus seinem Garten mitgebracht.|Mr Hedgehog has brought strawberries from his garden.','igel: Herzlichen Glückwunsch, Erna! Die Erdbeeren sind für dich.|Congratulations, Erna! The strawberries are for you.','mitbringen, Perfekt: Er hat Erdbeeren mitgebracht.|“mitbringen”, perfect tense: Er hat Erdbeeren mitgebracht.'],
 oma:['Oma Erna|Grandma Erna','','Oma sitzt am Tisch und hält ihre neue Tasse.|Grandma is sitting at the table holding her new cup.',['oma: Das ist der schönste Geburtstag seit Jahren!|This is the best birthday in years!','oma: Danke, ihr Lieben. Ich habe mich so gefreut!|Thank you, my dears. I was so happy!'],'sich freuen, Perfekt: Ich habe mich gefreut.|“sich freuen”, perfect tense: Ich habe mich gefreut.'],

const ln=(str,dflt='erz')=>{const m=str.match(/^([a-z]+): ([\s\S]*)$/),own=m&&SPK[m[1]];const [de,en='']=(own?m[2]:str).split('|');return {s:own?m[1]:dflt,de,en}};
const asList=x=>Array.isArray(x)?x:[x];
const qOf=x=>{const [q,en='']=x.split('|');return {q,en}};
TIPBOOKS.forEach(b=>b.scenes.forEach(sc=>{
  sc.story=(sc.story||[]).map(x=>ln(x));
  for(const id in sc.hs){const [w,pl,d,e,k]=sc.hs[id],[wd,we]=w.split('|');
    sc.hs[id]={w:wd,en:we,pl,d:asList(d).map(x=>ln(x,'stift')),e:asList(e).map(x=>x.split(' // ').map(y=>ln(y,b.voice||'erz'))),k:asList(k).map(x=>ln(x,'stift'))}}
  sc.qs=(sc.qs||[]).map(([q,a])=>({...qOf(q),a:a.split(' ')}));
  sc.groups=(sc.groups||[]).map(([q,a])=>({...qOf(q),a:a.split(' ')}));
  sc.tf=(sc.tf||[]).map(([q,t,a,why])=>({...qOf(q),t:!!t,a:a?a.split(' '):[],why:why?ln(why,'stift'):null}));
  sc.hoer=(sc.hoer||[]).map(([q,a])=>({...qOf(q),a:a.split(' ')}));
  sc.wohin=(sc.wohin||[]).map(([item,a,q,ans])=>({item,a:a.split(' '),...qOf(q),ans:ln(ans,'stift')}));
  sc.luecke=(sc.luecke||[]).map(([q,fill,a])=>{const o=qOf(q);return {...o,fill,a:a.split(' '),full:o.q.replace('___',fill)}});
  sc.satz=(sc.satz||[]).map(x=>{const [de,en='']=x.split('|'),chunks=de.split(' / ');return {chunks,full:chunks.join(' '),en}});
  sc.quiz=(sc.quiz||[]).map(([q,opts,ex])=>{const o=qOf(q);return {prompt:{s:'stift',de:o.q,en:o.en},opts:opts.map(x=>{const [de,en='']=x.split('|');return {s:'stift',de,en}}),expl:ln(ex,'stift')}});

  sc.dlg=(sc.dlg||[]).map(([pr,opts])=>({prompt:ln(pr,'er'),opts:opts.map(o=>{const [de,en='']=o.split('|');return {s:'ich',de,en}})}));
}));

/* ---------- sound + speech ---------- */
function tone(kind){
  if(!soundOn) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seqs={tap:[[1046,.05]],ok:[[660,.09],[880,.09],[1320,.18]],no:[[220,.12],[165,.22]],win:[[523,.1],[659,.1],[784,.1],[1047,.32]],start:[[440,.08],[660,.08],[880,.14]]};
    let at=actx.currentTime;
    for(const [f,d] of seqs[kind]){const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='no'?'square':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(kind==='no'?.045:.13,at+.015);g.gain.exponentialRampToValueAtTime(.0001,at+d);
      o.connect(g).connect(actx.destination);o.start(at);o.stop(at+d+.03);at+=d*.9}
  }catch(e){}
}
const speakable=t=>t.replace(/→/g,', ').replace(/[„“"«»]/g,'').replace(/…/g,', ').replace(/\s[–-]\s/g,', ');
function sayAs(text,spk,onend){
  let done=false,timer,checks=0;
  const fin=()=>{if(done)return;done=true;clearTimeout(timer);onend&&onend()};
  const arm=ms=>{timer=setTimeout(()=>{if('speechSynthesis' in window&&speechSynthesis.speaking&&checks++<30)arm(800);else fin()},ms)};
  arm(1800+text.length*90);   // fallback in case the browser never fires onend
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const v=SPK[spk]||SPK.erz,u=new SpeechSynthesisUtterance(speakable(text));
  u.lang='de-DE';if(deVoice)u.voice=deVoice;u.pitch=v[1];u.rate=v[2];u.onend=u.onerror=fin;speechSynthesis.speak(u);
}
/* Recorded voices: every line is pre-generated as audio/tipp/<key>.mp3 (see tools/make_voices.py).
   A line can be split into reusable pieces (L.say) so game sentences are built from clips.
   Any clip that fails to load falls back to the browser's own German voice for that line. */
const CLIP_DIR='audio/tipp/';
const clipKey=(spk,t)=>{const s=spk+'|'+speakable(t).replace(/\s+/g,' ').trim();let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
const PL={el:new Audio(),tok:0,bad:new Set()};
PL.el.preload='auto';
function playClips(keys,onend,onfail){
  const tok=++PL.tok,el=PL.el;let i=0,timer;
  const stop=()=>{clearTimeout(timer);el.onended=el.onerror=el.onplaying=null};
  const fail=k=>{if(tok!==PL.tok)return;stop();PL.bad.add(k);onfail()};
  const step=()=>{
    if(tok!==PL.tok)return;
    if(i>=keys.length){stop();onend();return}
    const k=keys[i++];
    el.onended=step;el.onerror=()=>fail(k);el.onplaying=()=>clearTimeout(timer);
    clearTimeout(timer);timer=setTimeout(()=>fail(k),5000);   // never got going: use the browser voice
    el.src=CLIP_DIR+k+'.mp3';
    const p=el.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name!=='AbortError')fail(k)});
  };
  step();
}
function sayLine(L,onend){
  if(L.mute){onend();return}
  const keys=(L.say||[L.de]).map(t=>clipKey(L.s,t));
  if(keys.some(k=>PL.bad.has(k))){sayAs(L.de,L.s,onend);return}
  playClips(keys,onend,()=>sayAs(L.de,L.s,onend));

function tipHush(){T.seq++;PL.tok++;try{PL.el.pause()}catch(e){}penTalk(-1)}
function speakSeq(lines,head,done,extra){
  tipHush();if('speechSynthesis' in window)speechSynthesis.cancel();
  const my=++T.seq;T.last={lines,head,extra};penShow(lines,head,extra);let i=0;
  const next=()=>{if(my!==T.seq)return;if(i>=lines.length){penTalk(-1);done&&done();return}penTalk(i);const L=lines[i++];sayLine(L,next)};
  next();
}
// Every spoken piece of every tip book (speaker + text). The voice generator reads this list.
const PRAISE=['Richtig!','Super!','Toll!','Genau!','Prima!'];
const NOCH={1:'Noch eins!',2:'Noch zwei!',3:'Noch drei!',4:'Noch vier!'};
const FINISH={all:['Fantastisch! Alles richtig!','Fantastic! All correct!'],good:['Sehr gut!','Very good!'],ok:['Gut gemacht!','Well done!']};
const ptsSay=(s,len)=>`Du hast ${s===0?'keinen Punkt':s===1?'einen Punkt':`${s} Punkte`} von ${len}.`;
const SAYS={tf:'Tippe unten auf Richtig oder Falsch!|Tap True or False below!',have:'Das hast du schon.|You already have that.',all:'Super! Alle gefunden.|Great! All found.',
 nope:'Leider nicht.|Not quite.',slow:'Zu langsam! Schau mal, hier:|Too slow! Look, here:',darf:'Das darf man.|You may do that.',nicht:'Das darf man nicht.|You must not do that.',muss:'Das muss man.|You must do that.',notquite:'Leider nicht ganz. Richtig ist:|Not quite. Correct is:',build:'Bau den Satz!|Build the sentence!',words:'Tippe unten auf die Wörter!|Tap the words below!',solution:'Die richtige Reihenfolge ist:|The right order is:',retry:'Leider nicht. Versuch es noch einmal.|Not quite. Try again.',memo:'Merk dir:|Remember:',you:'Jetzt du! Tippe in der richtigen Reihenfolge.|Your turn! Tap them in the right order.',again:'Nein. Noch einmal von vorne!|No. Once more from the start!',order:'Super! Alles in der richtigen Reihenfolge.|Great! All in the right order.',was:'Schau, so war es richtig:|Look, this was right:',pick:'Wähle unten eine Antwort!|Choose an answer below!',wrongA:'Das passt nicht. Hör noch einmal.|That doesn’t fit. Listen again.',right:'Die richtige Antwort ist:|The right answer is:',true:'Das stimmt.|That’s true.',done:'Super! Du hast alles auf dieser Seite entdeckt!|Great! You have discovered everything on this page!'};
function tipAllLines(){
  const out=new Map(),add=(s,t)=>{const k=clipKey(s,t);if(!out.has(k))out.set(k,{key:k,s,text:speakable(t).replace(/\s+/g,' ').trim()})};
  const lineOf=L=>(L.say||[L.de]).forEach(t=>add(L.s,t));

    add('stift',`Wir lesen zusammen das Buch: ${b.title}.`);
    b.scenes.forEach(sc=>{

        add('stift',h.w);add('stift',`Das ist ${h.w}.`);if(h.pl)add('stift',`${h.w}, ${h.pl}`);
        if(ART(h.w)&&id[0]!=='_'&&b.games.includes('finde'))add('stift',`Wo ist ${h.w}?`);
        h.d.forEach(lineOf);h.k.forEach(lineOf);h.e.forEach(x=>x.forEach(lineOf))}
      [...sc.qs,...sc.groups,...sc.tf,...sc.hoer,...sc.wohin].forEach(q=>add('stift',q.q));
      sc.luecke.forEach(x=>{add('stift',x.q.replace('___','piep'));add('stift',x.full)});sc.satz.forEach(x=>add('stift',x.full));sc.quiz.forEach(x=>{lineOf(x.prompt);lineOf(x.expl)});
      sc.react.forEach(x=>add('stift',x.q));sc.darf.forEach(x=>{add('stift',x.q);lineOf(x.expl)});sc.pruef.forEach(x=>{lineOf(x.prompt);lineOf(x.expl)});
      sc.wohin.forEach(x=>lineOf(x.ans));sc.dlg.forEach(x=>{lineOf(x.prompt);x.opts.forEach(lineOf)});
      sc.tf.forEach(x=>x.why&&lineOf(x.why));

  });

   ...PRAISE,'Nein.','Ja!','Schau mal, hier!','Das hatten wir schon.',...Object.values(NOCH),
   ...Object.values(FINISH).map(x=>x[0]),...[3,4,5].flatMap(len=>[...Array(len+1)].map((_,s)=>ptsSay(s,len))),
   ...['der','die','das'].flatMap(a=>[`Finde etwas mit „${a}“!`,`Finde etwas anderes mit „${a}“!`])].forEach(t=>add('stift',t));
  [...Object.values(SAYS),STOPSAY,AGAIN,...Object.values(MODES).map(m=>m.intro),...Object.values(GAMES).map(g=>g.intro)].forEach(x=>lineOf(ln(x,'stift')));
  return [...out.values()];
}

/* ---------- discovering ---------- */
function markFound(sid,id){
  const a=T.found[sid]||(T.found[sid]=[]);if(a.includes(id))return false;
  a.push(id);store.set('a2.tip.found',T.found);
  document.querySelectorAll(`.fnd[data-s="${sid}"]`).forEach(e=>e.textContent=countFound(sid));
  return true}
const countFound=sid=>{const sc=scene(sid);return (T.found[sid]||[]).filter(id=>id in sc.hs).length};
const totalOf=sid=>Object.keys(scene(sid).hs).length;
function flash(id,cls){

  clearTimeout(flash[cls]);flash[cls]=setTimeout(()=>document.querySelectorAll(`.hs.${cls}`).forEach(g=>g.classList.remove(cls)),cls==='hint'?2100:750);

function ripple(ev,el){

  if(ev&&(ev.clientX||ev.clientY)){x=ev.clientX;y=ev.clientY}else{const b=el.getBoundingClientRect();x=Math.max(r.left,Math.min(r.right,b.left+b.width/2));y=Math.max(r.top,Math.min(r.bottom,b.top+b.height/2))}

function tipTap(el,ev){

function refreshSyms(){
