/* Content. Each hotspot: [word|english, plural, discover, story, knowledge].
   discover/knowledge: "deutsch|english" (or a list). story: one exchange or a list; an exchange is lines
   joined by " // ", each line "speaker: deutsch|english" (no speaker = narrator). Questions: [frage|question, "ids that count"]. */
const TIPBOOKS=[{id:'samstag',title:'Ein Samstag in der Stadt',titleEn:'A Saturday in town',color:'#B83FD1',kind:'Bildergeschichte',by:'mit Shruti, Sijan und Lena',
 modes:['entdecken','erzaehlen','wissen'],games:['finde','artikel','raetsel'],storyMode:'erzaehlen',cert:'Du kennst dich in der Stadt aus!',
scenes:[
{id:'kueche',art:'fruehstueck',title:'In der Küche',en:'In the kitchen',focus:'Wo? Wohin? · Präpositionen',
 story:['Es ist Samstagmorgen. Shruti und Sijan frühstücken in der Küche.|It is Saturday morning. Shruti and Sijan are having breakfast in the kitchen.','Am Nachmittag kommt ihre Freundin Lena mit dem Zug. Dann machen alle zusammen ein Picknick im Park.|In the afternoon their friend Lena is coming by train. Then they will all have a picnic in the park together.','Aber der Kühlschrank ist fast leer. Zuerst müssen sie einkaufen.|But the fridge is almost empty. First they have to go shopping.'],
 hs:{
 _bg:['die Küche|the kitchen','die Küchen','In der Küche kocht und isst man.|In the kitchen you cook and eat.','Die Küche ist hell und gemütlich. Hier frühstücken Shruti und Sijan jeden Morgen.|The kitchen is bright and cosy. Shruti and Sijan have breakfast here every morning.','Eine Wohnung hat oft eine Küche, ein Bad, ein Wohnzimmer und ein Schlafzimmer.|A flat often has a kitchen, a bathroom, a living room and a bedroom.'],
 fenster:['das Fenster|the window','die Fenster','Durch das Fenster sieht man den blauen Himmel.|Through the window you can see the blue sky.','shruti: Schau mal aus dem Fenster! Das Wetter ist super.|Look out of the window! The weather is great.','das Fenster, die Fenster: Viele Wörter auf -er haben im Plural keine Endung.|Many words ending in -er have no plural ending.'],
 sonne:['die Sonne|the sun','','Die Sonne scheint. Heute wird es warm.|The sun is shining. It will be warm today.','sijan: Die Sonne scheint! Perfekt für ein Picknick.|The sun is shining! Perfect for a picnic.','die Sonne → sonnig, der Regen → regnerisch, der Wind → windig. So spricht man über das Wetter.|sun → sunny, rain → rainy, wind → windy. That is how you talk about the weather.'],
 pflanze:['die Pflanze|the plant','die Pflanzen','Die Pflanze steht auf der Fensterbank.|The plant is on the windowsill.','shruti: Oh, die Pflanze braucht Wasser. Ich gieße sie später.|Oh, the plant needs water. I’ll water it later.','Stehen oder liegen? Die Pflanze steht, aber das Buch liegt. Hohe Dinge stehen, flache Dinge liegen.|Stand or lie? The plant stands, but the book lies. Tall things stand, flat things lie.'],
 uhr:['die Uhr|the clock','die Uhren','Es ist halb zehn.|It is half past nine.','sijan: Schon halb zehn! Der Markt ist nur bis ein Uhr offen.|Already half past nine! The market is only open until one o’clock.','Halb zehn ist neun Uhr dreißig. Achtung: Man sagt „halb“ und die nächste Stunde.|Halb zehn is 9:30. Careful: you say "halb" plus the next hour.'],
 schluessel:['der Schlüssel|the key','die Schlüssel','Die Schlüssel hängen an der Wand.|The keys are hanging on the wall.','shruti: Vergiss den Schlüssel nicht, Sijan!|Don’t forget the key, Sijan! // sijan: Keine Sorge, ich nehme ihn mit.|Don’t worry, I’ll take it with me.','Der Schlüssel hängt an der Wand: Wo? → Dativ. Ich hänge den Schlüssel an die Wand: Wohin? → Akkusativ.|The key hangs on the wall: where? → dative. I hang the key on the wall: where to? → accusative.'],
 lampe:['die Lampe|the lamp','die Lampen','Die Lampe hängt über dem Tisch.|The lamp hangs above the table.','Die Lampe ist aus. Draußen ist es schon hell.|The lamp is off. It is already light outside.','über + Dativ: über dem Tisch, über der Tür, über dem Bett.|über + dative: above the table, above the door, above the bed.'],
 tisch:['der Tisch|the table','die Tische','Auf dem Tisch stehen eine Tasse und ein Teller.|On the table there are a cup and a plate.','Shruti und Sijan frühstücken heute lange am Tisch.|Shruti and Sijan have a long breakfast at the table today.','am Tisch ist kurz für „an dem Tisch“. Aus „an dem“ wird „am“.|"am Tisch" is short for "an dem Tisch".'],
 broetchen:['das Brötchen|the bread roll','die Brötchen','Auf dem Teller liegen zwei Brötchen.|There are two bread rolls on the plate.','sijan: Die Brötchen sind lecker. Aber das sind die letzten!|The rolls are tasty. But these are the last ones!','In Deutschland isst man zum Frühstück oft Brötchen mit Butter, Käse oder Marmelade.|In Germany people often eat bread rolls with butter, cheese or jam for breakfast.'],
 tasse:['die Tasse|the cup','die Tassen','In der Tasse ist heißer Kaffee.|There is hot coffee in the cup.','sijan: Morgens trinke ich immer einen Kaffee mit Milch.|In the morning I always drink a coffee with milk.','eine Tasse Kaffee, ein Glas Wasser, eine Flasche Saft. Man sagt nicht „eine Tasse von Kaffee“.|a cup of coffee, a glass of water, a bottle of juice. You don’t say "eine Tasse von Kaffee".'],
 marmelade:['die Marmelade|the jam','','Das ist Erdbeermarmelade.|This is strawberry jam.','shruti: Die Marmelade ist fast leer. Ich schreibe sie auf die Liste.|The jam is almost empty. I’ll write it on the list.','die Erdbeere und die Marmelade: die Erdbeermarmelade. Das letzte Wort bestimmt den Artikel.|strawberry + jam = strawberry jam. The last word decides the article.'],
 katze:['die Katze|the cat','die Katzen','Die Katze sitzt unter dem Tisch.|The cat is sitting under the table.',['katze: Miau! Miau!|Meow! Meow!','Das ist Minka. Sie wartet unter dem Tisch auf ein Stück Käse.|This is Minka. She is waiting under the table for a piece of cheese.'],'Die Katze sitzt unter dem Tisch: Wo? → Dativ. Die Katze läuft unter den Tisch: Wohin? → Akkusativ.|The cat sits under the table: where? → dative. The cat runs under the table: where to? → accusative.'],
 herd:['der Herd|the stove','die Herde','Auf dem Herd steht ein Topf.|There is a pot on the stove.','shruti: Ich koche Eier. Möchtest du auch ein Ei?|I’m boiling eggs. Would you like an egg too? // sijan: Ja, gern!|Yes, please!','kochen: ich koche, du kochst, er kocht. Kochen heißt „to cook“ und auch „to boil“.|kochen means "to cook" and also "to boil".'],
 topf:['der Topf|the pot','die Töpfe','Im Topf kochen zwei Eier.|Two eggs are boiling in the pot.','Das Wasser im Topf ist heiß. Blubb, blubb!|The water in the pot is hot. Bubble, bubble!','der Topf, die Töpfe: Viele Nomen bekommen im Plural einen Umlaut, zum Beispiel der Apfel, die Äpfel.|Many nouns get an umlaut in the plural, for example Apfel – Äpfel.'],
 kaffee:['die Kaffeemaschine|the coffee machine','die Kaffeemaschinen','Die Kaffeemaschine macht frischen Kaffee.|The coffee machine makes fresh coffee.','sijan: Ohne Kaffee kann ich morgens nicht denken!|Without coffee I can’t think in the morning!','Kaffee ist das Lieblingsgetränk der Deutschen.|Coffee is the Germans’ favourite drink.'],
 kuehlschrank:['der Kühlschrank|the fridge','die Kühlschränke','Im Kühlschrank sind nur noch Milch und Butter.|There is only milk and butter left in the fridge.','shruti: Oh nein, der Kühlschrank ist fast leer!|Oh no, the fridge is almost empty! // sijan: Dann müssen wir heute einkaufen.|Then we have to go shopping today.','kühl und der Schrank: der Kühlschrank. Im Deutschen kann man Wörter zusammensetzen.|cool + cupboard = fridge. In German you can join words together.'],
 liste:['die Einkaufsliste|the shopping list','die Einkaufslisten','Auf der Liste stehen Brot, Käse, Äpfel und Tomaten.|Bread, cheese, apples and tomatoes are on the list.','shruti: Brot, Käse, Äpfel, Tomaten … Fehlt noch etwas?|Bread, cheese, apples, tomatoes … Is anything missing? // sijan: Ja, ein Kuchen für das Picknick!|Yes, a cake for the picnic!','einkaufen und die Liste: die Einkaufsliste. Das „s“ in der Mitte verbindet die zwei Wörter.|shop + list = shopping list. The "s" in the middle links the two words.'],
 tasche:['die Einkaufstasche|the shopping bag','die Einkaufstaschen','Die Tasche steht auf dem Boden.|The bag is on the floor.','shruti: Wir nehmen die Tasche mit. Dann brauchen wir keine Plastiktüte.|We’ll take the bag. Then we don’t need a plastic bag.','In Deutschland kostet eine Tüte im Geschäft Geld. Darum bringen viele Leute eine Tasche mit.|In Germany a bag costs money in shops. That’s why many people bring their own bag.'],
 shruti:['Shruti|Shruti','','Das ist Shruti. Sie liest die Einkaufsliste.|This is Shruti. She is reading the shopping list.',['shruti: Guten Morgen, Sijan! Heute ist Samstag. Wir müssen einkaufen.|Good morning, Sijan! Today is Saturday. We have to go shopping.','shruti: Zuerst gehen wir auf den Markt und dann in die Stadt.|First we go to the market and then into town.'],'Am Samstag sind die Geschäfte in Deutschland offen. Am Sonntag sind fast alle Geschäfte zu.|On Saturday shops in Germany are open. On Sunday almost all shops are closed.'],
 sijan:['Sijan|Sijan','','Das ist Sijan. Er trinkt Kaffee.|This is Sijan. He is drinking coffee.',['sijan: Guten Morgen! Heute habe ich frei. Wir können lange frühstücken.|Good morning! I have the day off today. We can have a long breakfast.','sijan: Wann kommt Lena?|When is Lena coming? // shruti: Um zwei Uhr am Bahnhof.|At two o’clock at the station.'],'er, sie, es: Sijan ist „er“, Shruti ist „sie“, das Kind ist „es“.|he, she, it: Sijan → er, Shruti → sie, the child → es.'],
 },
 qs:[['Was sitzt unter dem Tisch?|What is sitting under the table?','katze'],['Was hängt an der Wand und zeigt die Zeit?|What hangs on the wall and shows the time?','uhr'],['Was steht auf der Fensterbank?|What is on the windowsill?','pflanze'],['Wo steht, was Shruti und Sijan kaufen müssen?|Where does it say what Shruti and Sijan have to buy?','liste'],['Er ist kalt und weiß. Darin sind Milch und Butter. Was ist das?|It is cold and white. Milk and butter are inside. What is it?','kuehlschrank'],['Was braucht man für die Tür?|What do you need for the door?','schluessel'],['Was macht Kaffee?|What makes coffee?','kaffee'],['Was hängt über dem Tisch?|What hangs above the table?','lampe'],['Worin kochen die Eier?|What are the eggs boiling in?','topf']]},

{id:'markt',title:'Auf dem Markt',en:'At the market',focus:'Einkaufen · Mengen und Preise',
 story:['Auf dem Markt ist viel los. Es gibt Obst, Gemüse, Käse und Brot.|The market is busy. There is fruit, vegetables, cheese and bread.','Shruti hat die Einkaufsliste, und Sijan hat das Geld.|Shruti has the shopping list and Sijan has the money.','Sie kaufen alles für das Picknick.|They buy everything for the picnic.'],
 hs:{
 _bg:['der Markt|the market','die Märkte','Jeden Samstag ist hier Markt.|There is a market here every Saturday.','Auf dem Markt ist viel los. Viele Leute kaufen ein.|The market is busy. Lots of people are shopping.','Viele Städte haben einen Wochenmarkt. Dort gibt es frisches Obst und Gemüse aus der Region.|Many towns have a weekly market with fresh local fruit and vegetables.'],
 stand:['der Marktstand|the market stall','die Marktstände','Auf dem Markt gibt es viele Stände.|There are many stalls at the market.','Die Verkäufer bauen ihre Stände schon um sechs Uhr morgens auf.|The sellers set up their stalls at six in the morning.','aufbauen ist trennbar: Sie bauen den Stand auf. Sie haben den Stand aufgebaut.|aufbauen is separable: they set up the stall. They have set up the stall.'],
 aepfel:['der Apfel|the apple','die Äpfel','Die Äpfel sind rot und grün.|The apples are red and green.','shruti: Ich hätte gern ein Kilo Äpfel, bitte.|I’d like a kilo of apples, please. // huber: Gern. Die roten oder die grünen?|Sure. The red ones or the green ones? // shruti: Die roten, bitte.|The red ones, please.','der Apfel, die Äpfel: Im Plural kommt ein Umlaut dazu.|In the plural an umlaut is added.'],
 bananen:['die Banane|the banana','die Bananen','Die Bananen sind gelb.|The bananas are yellow.','huber: Die Bananen sind heute im Angebot!|The bananas are on offer today!','im Angebot: Es ist billiger als normal.|on offer: it is cheaper than usual.'],
 tomaten:['die Tomate|the tomato','die Tomaten','Die Tomaten sind rot und frisch.|The tomatoes are red and fresh.','sijan: Was kosten die Tomaten?|How much are the tomatoes? // huber: Ein Pfund kostet einen Euro fünfzig.|A pound costs one euro fifty.','ein Pfund sind fünfhundert Gramm. Auf dem Markt sagt man oft „ein Pfund Tomaten“.|A pound is 500 grams. At the market people often say "a pound of tomatoes".'],
 karotten:['die Karotte|the carrot','die Karotten','Die Karotten liegen in einer Kiste vor dem Stand.|The carrots are in a crate in front of the stall.','huber: Die Karotten kommen direkt vom Bauernhof.|The carrots come straight from the farm.','Karotte oder Möhre? Beide Wörter sind richtig. Im Norden sagt man oft Möhre.|Karotte or Möhre? Both are correct. In the north people often say Möhre.'],
 preis:['das Preisschild|the price tag','die Preisschilder','Ein Kilo Äpfel kostet zwei Euro.|A kilo of apples costs two euros.','sijan: Zwei Euro für ein Kilo. Das ist nicht teuer.|Two euros for a kilo. That’s not expensive.','teuer und billig: Auf dem Markt sind die Äpfel billiger als im Supermarkt.|expensive and cheap: at the market the apples are cheaper than in the supermarket.'],
 waage:['die Waage|the scales','die Waagen','Mit der Waage wiegt man Obst und Gemüse.|You weigh fruit and vegetables with the scales.','huber: So, ein Kilo und hundert Gramm. Ist das okay?|There, one kilo and a hundred grams. Is that okay? // shruti: Ja, das ist okay.|Yes, that’s okay.','wiegen: Frau Huber wiegt die Äpfel. Ein Kilo hat tausend Gramm.|to weigh: Mrs Huber weighs the apples. A kilo has a thousand grams.'],
 verkaeuferin:['die Verkäuferin|the saleswoman','die Verkäuferinnen','Das ist Frau Huber. Sie verkauft Obst und Gemüse.|This is Mrs Huber. She sells fruit and vegetables.',['huber: Guten Morgen! Was darf es sein?|Good morning! What can I get you?','huber: Darf es noch etwas sein?|Anything else? // shruti: Nein, danke. Das ist alles.|No, thank you. That’s everything.'],'der Verkäufer, die Verkäuferin: Mit -in wird ein Beruf weiblich.|With -in a job title becomes female.'],
 kaese:['der Käse|the cheese','','Der Käse ist gelb und hat Löcher.|The cheese is yellow and has holes.','sijan: Ich hätte gern zweihundert Gramm Bergkäse, bitte.|I’d like two hundred grams of mountain cheese, please. // wagner: Möchten Sie mal probieren?|Would you like to try some? // sijan: Ja, gern. Mmh, lecker!|Yes, please. Mmm, delicious!','Käse sagt man meistens ohne Plural: ein Stück Käse, zweihundert Gramm Käse.|Cheese is usually used without a plural: a piece of cheese, 200 grams of cheese.'],
 brot:['das Brot|the bread','die Brote','Das Brot ist frisch und noch warm.|The bread is fresh and still warm.','wagner: Das Vollkornbrot ist ganz frisch.|The wholemeal bread is very fresh. // shruti: Dann nehmen wir ein Vollkornbrot.|Then we’ll take a wholemeal loaf.','In Deutschland gibt es über dreitausend Brotsorten.|In Germany there are more than three thousand kinds of bread.'],
 brezel:['die Brezel|the pretzel','die Brezeln','Die Brezel ist braun und hat Salz.|The pretzel is brown and has salt on it.','sijan: Und zwei Brezeln für das Picknick, bitte.|And two pretzels for the picnic, please.','Die Brezel kommt aus Süddeutschland. In Bayern sagt man auch „die Breze“.|The pretzel comes from southern Germany. In Bavaria people also say "die Breze".'],
 baecker:['der Verkäufer|the salesman','die Verkäufer','Das ist Herr Wagner. Er verkauft Käse und Brot.|This is Mr Wagner. He sells cheese and bread.',['wagner: Guten Morgen! Was möchten Sie?|Good morning! What would you like?','wagner: Das macht zusammen neun Euro achtzig.|That’s nine euros eighty altogether. // sijan: Hier sind zehn Euro. Stimmt so!|Here are ten euros. Keep the change!'],'„Stimmt so!“ sagt man, wenn der Verkäufer den Rest als Trinkgeld behalten darf.|You say "Stimmt so!" when the seller can keep the rest as a tip.'],
 korb:['der Korb|the basket','die Körbe','Der Korb ist schon fast voll.|The basket is already almost full.','shruti: Der Korb ist schwer! Kannst du ihn tragen?|The basket is heavy! Can you carry it? // sijan: Na klar!|Of course!','der Korb, die Körbe: Aus o wird im Plural oft ö.|In the plural, o often becomes ö.'],
 blumen:['die Blume|the flower','die Blumen','Die Sonnenblumen stehen in einem Eimer.|The sunflowers are in a bucket.','sijan: Schau mal, Sonnenblumen! Die kaufen wir für Lena.|Look, sunflowers! We’ll buy them for Lena.','Wenn man Freunde besucht oder abholt, bringt man oft Blumen mit.|When you visit or pick up friends, you often bring flowers.'],
 hund:['der Hund|the dog','die Hunde','Der Hund ist klein und braun.|The dog is small and brown.',['hund: Wuff! Wuff!|Woof! Woof!','Der Hund riecht den Käse. Er hat Hunger!|The dog smells the cheese. He is hungry!'],'der Hund, die Katze, der Vogel: Das sind Haustiere.|dog, cat, bird: these are pets.'],
 kirche:['die Kirche|the church','die Kirchen','Die Kirchturmuhr zeigt Viertel nach zehn.|The church clock shows quarter past ten.','Die Glocken läuten. Ding, dong!|The bells are ringing. Ding, dong!','Viertel nach zehn ist zehn Uhr fünfzehn. Viertel vor elf ist zehn Uhr fünfundvierzig.|Quarter past ten is 10:15. Quarter to eleven is 10:45.'],
 shruti:['Shruti|Shruti','','Shruti hat die Einkaufsliste.|Shruti has the shopping list.','shruti: Äpfel, Tomaten, Käse, Brot … Was fehlt noch?|Apples, tomatoes, cheese, bread … What’s still missing? // sijan: Der Kuchen! Den kaufen wir später im Café.|The cake! We’ll buy that later at the café.','„Ich hätte gern …“ ist sehr höflich. Man sagt es oft beim Einkaufen.|"Ich hätte gern …" is very polite. People often say it when shopping.'],
 sijan:['Sijan|Sijan','','Sijan bezahlt.|Sijan is paying.','sijan: Kann ich mit Karte bezahlen?|Can I pay by card? // wagner: Ja, natürlich.|Yes, of course.','bar bezahlen oder mit Karte bezahlen? Auf dem Markt bezahlen viele Leute bar.|Pay cash or by card? At the market many people pay cash.'],
 },
 qs:[['Was ist gelb und krumm?|What is yellow and curved?','bananen'],['Was liegt in einer Kiste vor dem Stand?|What is in a crate in front of the stall?','karotten'],['Was kostet zwei Euro pro Kilo?|What costs two euros per kilo?','aepfel preis'],['Womit wiegt Frau Huber das Obst?|What does Mrs Huber weigh the fruit with?','waage'],['Was kauft Sijan für Lena?|What does Sijan buy for Lena?','blumen'],['Wer verkauft Käse und Brot?|Who sells cheese and bread?','baecker'],['Sie ist braun, hat Salz und kommt aus Süddeutschland. Was ist das?|It is brown, has salt and comes from southern Germany. What is it?','brezel'],['Wo ist die Uhr? Sie zeigt Viertel nach zehn.|Where is the clock? It shows quarter past ten.','kirche'],['Was macht „wuff, wuff“?|What goes "woof, woof"?','hund']]},

{id:'stadt',title:'In der Stadt',en:'In town',focus:'Wegbeschreibung · zu + Dativ',
 story:['Jetzt sind Shruti und Sijan in der Stadt.|Now Shruti and Sijan are in town.','Sijan bringt ein Paket für seine Oma zur Post. Shruti kauft Sonnencreme in der Apotheke und einen Kuchen im Café.|Sijan takes a parcel for his grandma to the post office. Shruti buys sun cream at the pharmacy and a cake at the café.','Dann fragt Shruti eine Frau nach dem Weg zum Bahnhof.|Then Shruti asks a woman the way to the station.'],
 hs:{
 _bg:['die Stadt|the town','die Städte','In der Stadt gibt es viele Geschäfte.|There are lots of shops in town.','In der Stadt ist es laut. Autos, Busse und Fahrräder fahren vorbei.|It is noisy in town. Cars, buses and bikes go past.','Eine große Stadt ist eine Großstadt, eine kleine Stadt ist eine Kleinstadt.|A big town is a "Großstadt", a small town is a "Kleinstadt".'],
 post:['die Post|the post office','','Bei der Post kann man Briefe und Pakete schicken.|At the post office you can send letters and parcels.','sijan: Ich gehe zur Post. Das Paket ist für meine Oma.|I’m going to the post office. The parcel is for my grandma.','zu + Dativ: zu der Post wird zur Post, zu dem Bahnhof wird zum Bahnhof.|zu + dative: zu der → zur, zu dem → zum.'],
 briefkasten:['der Briefkasten|the postbox','die Briefkästen','Der Briefkasten ist gelb.|The postbox is yellow.','shruti: Ich werfe noch schnell eine Postkarte in den Briefkasten.|I’ll quickly post a postcard in the postbox.','In Deutschland sind die Briefkästen gelb. In England sind sie rot.|In Germany postboxes are yellow. In England they are red.'],
 paket:['das Paket|the parcel','die Pakete','Das Paket ist groß und schwer.|The parcel is big and heavy.','sijan: Im Paket sind Tee, Schokolade und Fotos. Meine Oma hat nächste Woche Geburtstag.|In the parcel there are tea, chocolate and photos. My grandma has her birthday next week.','Ich schicke meiner Oma ein Paket. Wem? Meiner Oma, das ist Dativ. Was? Ein Paket, das ist Akkusativ.|I send my grandma a parcel. To whom? → dative. What? → accusative.'],
 apotheke:['die Apotheke|the pharmacy','die Apotheken','In der Apotheke kauft man Medikamente.|You buy medicine at the pharmacy.','shruti: Ich brauche noch Sonnencreme. Die kaufe ich in der Apotheke.|I still need sun cream. I’ll buy it at the pharmacy.','Das rote „A“ zeigt in Deutschland: Hier ist eine Apotheke.|In Germany the red "A" shows: here is a pharmacy.'],
 ampel:['die Ampel|the traffic light','die Ampeln','Die Ampel ist rot. Wir müssen warten.|The light is red. We have to wait.','shruti: Stopp, Sijan! Die Ampel ist rot!|Stop, Sijan! The light is red! // sijan: Oh, Entschuldigung! Ich warte.|Oh, sorry! I’ll wait.','Rot heißt stehen, grün heißt gehen. In Deutschland warten die Leute an der roten Ampel, auch ohne Autos.|Red means stop, green means go. In Germany people wait at a red light, even with no cars.'],
 zebrastreifen:['der Zebrastreifen|the zebra crossing','die Zebrastreifen','Am Zebrastreifen kann man über die Straße gehen.|At the zebra crossing you can cross the street.','Am Zebrastreifen halten die Autos an.|At the zebra crossing the cars stop.','über die Straße gehen: Wohin? → Akkusativ.|to go across the street: where to? → accusative.'],
 fahrrad:['das Fahrrad|the bicycle','die Fahrräder','Das Fahrrad steht vor der Apotheke.|The bicycle is in front of the pharmacy.','sijan: Nächstes Mal fahren wir mit dem Fahrrad in die Stadt.|Next time we’ll cycle into town.','mit + Dativ: mit dem Fahrrad, mit dem Bus, mit dem Zug. Aber: zu Fuß.|with + dative: by bike, by bus, by train. But: on foot.'],
 cafe:['das Café|the café','die Cafés','Im Café gibt es Kaffee und Kuchen.|At the café there is coffee and cake.','shruti: Hier kaufen wir den Kuchen für das Picknick. Einen Apfelkuchen, bitte!|We’ll buy the cake for the picnic here. An apple cake, please!','Kaffee und Kuchen: Am Nachmittag, so um drei Uhr, essen viele Deutsche gern Kuchen.|Coffee and cake: in the afternoon, around three, many Germans like to eat cake.'],
 haltestelle:['die Haltestelle|the bus stop','die Haltestellen','An der Haltestelle wartet man auf den Bus.|At the bus stop you wait for the bus.','Der Bus Nummer zwölf fährt zum Bahnhof.|Bus number twelve goes to the station.','Das grüne „H“ auf dem gelben Schild bedeutet: Haltestelle.|The green "H" on the yellow sign means: bus stop.'],
 bus:['der Bus|the bus','die Busse','Der Bus ist rot. Er fährt zum Bahnhof.|The bus is red. It goes to the station.','sijan: Nehmen wir den Bus?|Shall we take the bus? // shruti: Nein, wir gehen zu Fuß. Es ist nicht weit.|No, we’ll walk. It’s not far.','Eine Fahrkarte kauft man am Automaten, im Bus oder mit dem Handy.|You buy a ticket at the machine, on the bus or with your phone.'],
 bank:['die Bank|the bank','die Banken','Bei der Bank kann man Geld abheben.|At the bank you can withdraw money.','sijan: Ich brauche noch Bargeld. Da drüben ist eine Bank.|I still need cash. There’s a bank over there.','Achtung: die Bank für Geld, Plural die Banken. Aber die Bank zum Sitzen, Plural die Bänke!|Careful: bank (money) → Banken. But bench → Bänke!'],
 wegweiser:['der Wegweiser|the signpost','die Wegweiser','Der Wegweiser zeigt: Zum Bahnhof geht es nach rechts.|The signpost shows: the station is to the right.','Bahnhof: fünfhundert Meter. Park: ein Kilometer.|Station: five hundred metres. Park: one kilometre.','nach rechts, nach links, geradeaus: So zeigt man den Weg.|to the right, to the left, straight on: that’s how you give directions.'],
 frau:['die Frau|the woman','die Frauen','Die Frau ist freundlich. Sie hilft Shruti.|The woman is friendly. She helps Shruti.',['frau: Zum Bahnhof? Gehen Sie hier geradeaus und dann an der Ampel rechts.|To the station? Go straight on here and then right at the traffic lights.','frau: Es ist nicht weit, nur fünf Minuten zu Fuß.|It’s not far, only five minutes on foot.'],'„Gehen Sie geradeaus!“ Der Imperativ mit „Sie“ ist höflich: zuerst das Verb, dann „Sie“.|The imperative with "Sie" is polite: verb first, then "Sie".'],
 shruti:['Shruti|Shruti','','Shruti fragt nach dem Weg.|Shruti asks the way.',['shruti: Entschuldigung, wie komme ich zum Bahnhof?|Excuse me, how do I get to the station?','shruti: Vielen Dank! Einen schönen Tag noch!|Thank you very much! Have a nice day!'],'„Entschuldigung …“ sagt man, wenn man eine fremde Person etwas fragt.|You say "Entschuldigung …" when you ask a stranger something.'],
 sijan:['Sijan|Sijan','','Sijan trägt ein Paket.|Sijan is carrying a parcel.','sijan: Ich gehe schnell zur Post. Wartest du auf mich?|I’ll quickly go to the post office. Will you wait for me? // shruti: Ja, ich warte vor dem Café.|Yes, I’ll wait in front of the café.','warten auf + Akkusativ: Ich warte auf dich. Wir warten auf den Bus.|wait for + accusative: I wait for you. We wait for the bus.'],
 },
 qs:[['Wo kann man ein Paket schicken?|Where can you send a parcel?','post'],['Wo kauft Shruti Sonnencreme?|Where does Shruti buy sun cream?','apotheke'],['Er ist gelb und hat Briefe im Bauch. Was ist das?|It is yellow and has letters in its belly. What is it?','briefkasten'],['Sie ist rot, gelb oder grün. Was ist das?|It is red, yellow or green. What is it?','ampel'],['Wo wartet man auf den Bus?|Where do you wait for the bus?','haltestelle'],['Wo kann man Geld abheben?|Where can you withdraw money?','bank'],['Wer erklärt Shruti den Weg?|Who explains the way to Shruti?','frau'],['Was steht vor der Apotheke?|What is in front of the pharmacy?','fahrrad'],['Wo kauft Shruti den Kuchen?|Where does Shruti buy the cake?','cafe']]},

{id:'bahnhof',title:'Am Bahnhof',en:'At the station',focus:'Uhrzeit · trennbare Verben',
 story:['Am Bahnhof warten Shruti und Sijan auf Lena.|At the station Shruti and Sijan are waiting for Lena.','Ihr Zug kommt aus München. Er hat fünf Minuten Verspätung.|Her train is coming from Munich. It is five minutes late.','Endlich fährt der Zug ein, und Lena steigt aus. Sie hat einen großen Koffer.|Finally the train pulls in and Lena gets off. She has a big suitcase.'],
 hs:{
 _bg:['der Bahnhof|the station','die Bahnhöfe','Am Bahnhof fahren die Züge ab und kommen an.|At the station trains depart and arrive.','Der Bahnhof ist voll. Am Wochenende fahren viele Leute weg.|The station is full. At the weekend lots of people go away.','abfahren und ankommen sind trennbar: Der Zug fährt um zehn Uhr ab. Er kommt um zwei Uhr an.|abfahren and ankommen are separable: the train departs at ten. It arrives at two.'],
 zug:['der Zug|the train','die Züge','Das ist ein ICE. Er fährt sehr schnell.|This is an ICE. It goes very fast.','Der Zug aus München ist da. Die Türen gehen auf.|The train from Munich is here. The doors open.','ICE heißt Intercity-Express. Er fährt bis zu dreihundert Kilometer pro Stunde.|ICE means Intercity Express. It goes up to 300 kilometres per hour.'],
 gleis:['das Gleis|the platform','die Gleise','Der Zug kommt auf Gleis drei an.|The train arrives at platform three.','sijan: Gleis drei! Hier sind wir richtig.|Platform three! We’re in the right place.','Am Bahnhof sagt man: Der Zug fährt auf Gleis drei ab. Das Wort ist sächlich: das Gleis.|At the station you say: the train leaves from platform three. The word is neuter.'],
 uhr:['die Bahnhofsuhr|the station clock','die Bahnhofsuhren','Es ist fünf nach zwei.|It is five past two.','shruti: Schon fünf nach zwei. Wo bleibt der Zug?|Already five past two. Where is the train?','Offiziell sagt man „vierzehn Uhr fünf“. Im Alltag sagt man „fünf nach zwei“.|Officially you say "14:05". In everyday life you say "five past two".'],
 anzeige:['die Anzeigetafel|the arrivals board','die Anzeigetafeln','Auf der Anzeigetafel stehen die Züge und die Zeiten.|The trains and times are on the board.','sijan: Da steht: ICE aus München, plus fünf. Der Zug hat Verspätung.|It says: ICE from Munich, plus five. The train is late.','Verspätung haben: Der Zug hat fünf Minuten Verspätung.|to be late: the train is five minutes late.'],
 lautsprecher:['der Lautsprecher|the loudspeaker','die Lautsprecher','Aus dem Lautsprecher kommt eine Durchsage.|An announcement comes from the loudspeaker.',['durchsage: Achtung an Gleis drei: Der ICE aus München fährt ein. Bitte Vorsicht bei der Einfahrt!|Attention on platform three: the ICE from Munich is arriving. Please take care as the train comes in!','durchsage: Wir bitten um Entschuldigung für die Verspätung.|We apologise for the delay.'],'die Durchsage: So heißen die Informationen aus dem Lautsprecher.|Announcements from the loudspeaker are called "Durchsagen".'],
 automat:['der Fahrkartenautomat|the ticket machine','die Fahrkartenautomaten','Am Automaten kauft man Fahrkarten.|You buy tickets at the machine.','sijan: Wir brauchen keine Fahrkarte. Wir holen Lena nur ab.|We don’t need a ticket. We’re just picking Lena up.','die Fahrkarte und der Automat: der Fahrkartenautomat. Heute kaufen viele Leute ihr Ticket mit einer App.|ticket + machine = ticket machine. Today many people buy their ticket with an app.'],
 fahrplan:['der Fahrplan|the timetable','die Fahrpläne','Auf dem gelben Fahrplan stehen die Abfahrten.|The departures are on the yellow timetable.','Der nächste Zug nach Hamburg fährt um fünfzehn Uhr.|The next train to Hamburg leaves at 3 pm.','Am Bahnhof ist der Plan für die Abfahrten gelb und der Plan für die Ankünfte weiß.|At the station the departures timetable is yellow and the arrivals timetable is white.'],
 bank:['die Bank|the bench','die Bänke','Auf der Bank kann man sitzen und warten.|You can sit and wait on the bench.','shruti: Komm, wir setzen uns auf die Bank.|Come on, let’s sit on the bench.','Ein Wort, zwei Bedeutungen: die Bank zum Sitzen, die Bänke, und die Bank für Geld, die Banken.|One word, two meanings: bench (Bänke) and bank (Banken).'],
 taube:['die Taube|the pigeon','die Tauben','Die Taube sucht Krümel.|The pigeon is looking for crumbs.','taube: Gurr, gurr!|Coo, coo!','Tauben füttern ist in vielen Städten verboten.|Feeding pigeons is forbidden in many cities.'],
 koffer:['der Koffer|the suitcase','die Koffer','Lenas Koffer ist blau und groß.|Lena’s suitcase is blue and big.','lena: Mein Koffer ist so schwer!|My suitcase is so heavy! // sijan: Gib her, ich trage ihn.|Give it here, I’ll carry it.','Lenas Koffer: Bei Namen schreibt man das „s“ ohne Apostroph.|With names, you write the "s" without an apostrophe.'],
 lena:['Lena|Lena','','Das ist Lena. Sie kommt aus München.|This is Lena. She comes from Munich.',['lena: Hallo, ihr zwei! Endlich bin ich da!|Hello, you two! I’m finally here!','lena: Die Fahrt war lang, weil der Zug Verspätung hatte.|The journey was long because the train was late.','lena: Oh, Blumen für mich? Wie schön! Danke!|Oh, flowers for me? How lovely! Thank you!'],'Nach „weil“ steht das Verb am Ende: … weil der Zug Verspätung hatte.|After "weil" the verb goes to the end.'],
 shruti:['Shruti|Shruti','','Shruti winkt Lena.|Shruti waves to Lena.',['shruti: Lena! Hier sind wir!|Lena! We’re over here!','shruti: Wie war die Reise?|How was the journey?'],'„war“ ist das Präteritum von „sein“: Wie war die Reise? Die Reise war lang.|"war" is the simple past of "sein".'],
 sijan:['Sijan|Sijan','','Sijan hat Blumen für Lena.|Sijan has flowers for Lena.','sijan: Herzlich willkommen, Lena! Die Blumen sind für dich.|Welcome, Lena! The flowers are for you.','für + Akkusativ: für dich, für mich, für Lena.|für + accusative: for you, for me, for Lena.'],
 },
 qs:[['Wo stehen die Züge und die Zeiten?|Where are the trains and times shown?','anzeige fahrplan'],['Er ist blau und groß und gehört Lena. Was ist das?|It is blue and big and belongs to Lena. What is it?','koffer'],['Wo kann man sitzen?|Where can you sit?','bank'],['Wo kauft man eine Fahrkarte?|Where do you buy a ticket?','automat'],['Woher kommt die Durchsage?|Where does the announcement come from?','lautsprecher'],['Wer kommt aus München?|Who comes from Munich?','lena'],['Wie spät ist es? Tippe auf die Uhr!|What time is it? Tap the clock!','uhr'],['Was macht „gurr, gurr“?|What goes "coo, coo"?','taube'],['Auf welchem Gleis kommt Lena an? Tippe auf das Schild!|Which platform does Lena arrive at? Tap the sign!','gleis']]},

{id:'park',title:'Im Park',en:'In the park',focus:'Perfekt · Wetter',
 story:['Endlich sind alle im Park. Die Sonne scheint, und es ist warm.|Finally everyone is in the park. The sun is shining and it is warm.','Shruti, Sijan und Lena machen ein Picknick. Sie essen Brot, Käse und Kuchen.|Shruti, Sijan and Lena have a picnic. They eat bread, cheese and cake.','Was für ein schöner Samstag!|What a lovely Saturday!'],
 hs:{
 _bg:['der Park|the park','die Parks','Im Park ist es grün und ruhig.|The park is green and quiet.','Am Wochenende sind viele Familien im Park.|At the weekend many families are in the park.','im Park: Wo? → Dativ. In den Park: Wohin? → Akkusativ.|in the park (where?) vs into the park (where to?).'],
 sonne:['die Sonne|the sun','','Die Sonne scheint. Es ist fünfundzwanzig Grad.|The sun is shining. It is 25 degrees.','lena: Was für ein tolles Wetter!|What great weather! // shruti: Zum Glück habe ich Sonnencreme gekauft.|Luckily I bought sun cream.','Wetter mit „es“: Es ist sonnig. Es ist warm. Es regnet.|Weather with "es": it is sunny, it is warm, it is raining.'],
 wolke:['die Wolke|the cloud','die Wolken','Am Himmel ist nur eine kleine Wolke.|There is only one small cloud in the sky.','shruti: Schau mal, die Wolke sieht aus wie ein Hase!|Look, the cloud looks like a rabbit!','die Wolke → wolkig. Heute ist es nicht wolkig, sondern sonnig.|cloud → cloudy. Today it is not cloudy but sunny.'],
 drachen:['der Drachen|the kite','die Drachen','Der Drachen fliegt hoch am Himmel.|The kite is flying high in the sky.','tim: Schaut mal! Mein Drachen fliegt ganz hoch!|Look! My kite is flying really high!','der Drachen ist zum Spielen, der Drache ist ein Monster. Ein kleiner Unterschied!|Drachen = kite, Drache = dragon. A small difference!'],
 baum:['der Baum|the tree','die Bäume','Der Baum ist groß und grün.|The tree is big and green.','lena: Später setzen wir uns in den Schatten unter den Baum.|Later we’ll sit in the shade under the tree.','der Baum, die Bäume: Aus „au“ wird im Plural „äu“.|In the plural "au" becomes "äu".'],
 eiswagen:['der Eiswagen|the ice cream cart','die Eiswagen','Am Eiswagen gibt es Eis in vielen Sorten.|At the ice cream cart there are lots of flavours.','eismann: Eis! Leckeres Eis! Eine Kugel kostet einen Euro achtzig.|Ice cream! Delicious ice cream! One scoop costs one euro eighty. // lena: Ich nehme zwei Kugeln: Schokolade und Erdbeere.|I’ll have two scoops: chocolate and strawberry.','eine Kugel, zwei Kugeln: So bestellt man Eis in Deutschland.|one scoop, two scoops: that’s how you order ice cream in Germany.'],
 teich:['der Teich|the pond','die Teiche','Der Teich ist klein. Das Wasser ist blau.|The pond is small. The water is blue.','Im Teich schwimmen zwei Enten und viele kleine Fische.|Two ducks and lots of little fish are swimming in the pond.','der Teich, der See, das Meer: klein, groß, sehr groß.|pond, lake, sea: small, big, very big.'],
 enten:['die Ente|the duck','die Enten','Die Enten schwimmen im Teich.|The ducks are swimming in the pond.',['ente: Quak, quak!|Quack, quack!','tim: Darf ich die Enten mit Brot füttern?|Can I feed the ducks with bread? // sijan: Nein, Brot ist nicht gut für Enten.|No, bread is not good for ducks.'],'In vielen Parks steht ein Schild: „Bitte nicht füttern!“|In many parks there is a sign: "Please do not feed!"'],
 decke:['die Picknickdecke|the picnic blanket','die Picknickdecken','Die Decke ist rot und weiß.|The blanket is red and white.','shruti: Wir legen die Decke hier auf die Wiese.|We’ll put the blanket here on the grass.','Ich lege die Decke auf die Wiese: Akkusativ. Die Decke liegt auf der Wiese: Dativ.|I put the blanket on the grass (accusative). The blanket lies on the grass (dative).'],
 korb:['der Picknickkorb|the picnic basket','die Picknickkörbe','Im Korb sind Brot, Käse, Äpfel und Tomaten.|In the basket there are bread, cheese, apples and tomatoes.','sijan: Wir haben alles vom Markt mitgebracht.|We’ve brought everything from the market.','mitbringen ist trennbar: Ich bringe Brot mit. Ich habe Brot mitgebracht.|mitbringen is separable: I bring bread. I have brought bread.'],
 kuchen:['der Kuchen|the cake','die Kuchen','Das ist ein Apfelkuchen aus dem Café.|This is an apple cake from the café.','lena: Mmh, der Kuchen ist lecker! Habt ihr ihn selbst gebacken?|Mmm, the cake is delicious! Did you bake it yourselves? // shruti: Nein, wir haben ihn im Café gekauft.|No, we bought it at the café.','Perfekt: backen wird „hat gebacken“, kaufen wird „hat gekauft“.|Perfect tense: bake → hat gebacken, buy → hat gekauft.'],
 ball:['der Ball|the ball','die Bälle','Der Ball ist schwarz und weiß.|The ball is black and white.','tim: Wer spielt mit mir Fußball?|Who will play football with me? // sijan: Ich! Aber erst nach dem Kuchen.|Me! But after the cake.','der Ball, die Bälle. Fußball ist in Deutschland der beliebteste Sport.|Football is the most popular sport in Germany.'],
 kind:['das Kind|the child','die Kinder','Das ist Tim. Er lässt einen Drachen steigen.|This is Tim. He is flying a kite.','tim: Hallo! Ich bin Tim. Ich bin acht Jahre alt.|Hello! I’m Tim. I’m eight years old.','das Kind ist sächlich: Das Kind spielt. Es ist acht Jahre alt.|"Kind" is neuter: es.'],
 blumen:['die Blume|the flower','die Blumen','Auf der Wiese wachsen viele Blumen.|Lots of flowers grow in the meadow.','lena: Die Blumen sind so schön, gelb, rot und blau!|The flowers are so beautiful, yellow, red and blue!','Im Park darf man die Blumen oft nicht pflücken.|In the park you are often not allowed to pick the flowers.'],
 lena:['Lena|Lena','','Lena ist zu Besuch.|Lena is visiting.',['lena: Danke für den schönen Tag! Das Picknick ist super.|Thanks for the lovely day! The picnic is great.','lena: Nächsten Samstag besucht ihr mich in München, okay?|Next Saturday you visit me in Munich, okay? // sijan: Gute Idee!|Good idea!'],'„nächsten Samstag“: Zeitangaben ohne Präposition stehen im Akkusativ.|Time expressions without a preposition are in the accusative.'],
 shruti:['Shruti|Shruti','','Shruti ist glücklich.|Shruti is happy.','shruti: Was für ein Tag! Wir haben eingekauft, Lena abgeholt, und jetzt machen wir Picknick.|What a day! We went shopping, picked Lena up, and now we’re having a picnic.','Perfekt mit trennbaren Verben: einkaufen wird eingekauft, abholen wird abgeholt.|Perfect tense with separable verbs: the ge- goes in the middle.'],
 sijan:['Sijan|Sijan','','Sijan hat Hunger.|Sijan is hungry.','sijan: Ich habe so einen Hunger! Wer möchte Brot mit Käse?|I’m so hungry! Who wants bread and cheese?','Hunger haben, Durst haben: Ich habe Hunger. Ich habe Durst.|to be hungry, to be thirsty: German uses "haben".'],
 },
 qs:[['Was fliegt am Himmel?|What is flying in the sky?','drachen'],['Wo schwimmen die Enten?|Where are the ducks swimming?','teich'],['Wo kann man Eis kaufen?|Where can you buy ice cream?','eiswagen'],['Was hat Shruti im Café gekauft?|What did Shruti buy at the café?','kuchen'],['Er ist groß und grün und hat viele Blätter. Was ist das?|It is big and green and has lots of leaves. What is it?','baum'],['Wer ist acht Jahre alt?|Who is eight years old?','kind'],['Womit spielt Tim Fußball?|What does Tim play football with?','ball'],['Was macht „quak, quak“?|What goes "quack, quack"?','enten'],['Was sieht aus wie ein Hase?|What looks like a rabbit?','wolke']]},
]}];

TIPBOOKS.push({id:'jahr',title:'Das Jahr in Deutschland',titleEn:'The year in Germany',color:'#0B7285',kind:'Sachbuch',by:'Ein Sachbuch zum Hören und Lernen',
 modes:['entdecken','sagen','wissen'],games:['sammeln','wahr','hoeren'],storyMode:'wissen',voice:'stift',cert:'Du kennst das deutsche Jahr!',
scenes:[
{id:'kalender',title:'Der Kalender',en:'The calendar',focus:'Monate · Wochentage · Datum',
 story:['Ein Jahr hat zwölf Monate, zweiundfünfzig Wochen und vier Jahreszeiten.|A year has twelve months, fifty-two weeks and four seasons.','Eine Woche hat sieben Tage: fünf Arbeitstage und das Wochenende.|A week has seven days: five working days and the weekend.','Tippe auf die Monate, die Tage und die Jahreszeiten!|Tap the months, the days and the seasons!'],
 hs:{
 _bg:['der Kalender|the calendar','die Kalender','Im Kalender stehen die Tage, die Wochen und die Monate.|The days, weeks and months are in the calendar.','sie: Ich schreibe den Termin in meinen Kalender.|I’ll write the appointment in my calendar.','In Deutschland beginnt die Woche im Kalender mit dem Montag, nicht mit dem Sonntag.|In Germany the calendar week starts on Monday, not Sunday.'],
 jahr:['das Jahr|the year','die Jahre','Ein Jahr hat zwölf Monate und vier Jahreszeiten.|A year has twelve months and four seasons.','er: Wie alt bist du?|How old are you? // kind: Ich bin acht Jahre alt.|I am eight years old.','Ein Jahr hat dreihundertfünfundsechzig Tage. Ein Schaltjahr hat dreihundertsechsundsechzig.|A year has 365 days. A leap year has 366.'],
 winter:['der Winter|winter','die Winter','Der Winter: Dezember, Januar und Februar.|Winter: December, January and February.','er: Brr, ist das kalt!|Brr, it’s cold!','Im Winter wird es schon um halb fünf dunkel.|In winter it gets dark at half past four.'],
 fruehling:['der Frühling|spring','die Frühlinge','Der Frühling: März, April und Mai.|Spring: March, April and May.','sie: Endlich ist der Frühling da!|Spring is finally here!','Im Frühling werden die Tage länger und wärmer.|In spring the days get longer and warmer.'],
 sommer:['der Sommer|summer','die Sommer','Der Sommer: Juni, Juli und August.|Summer: June, July and August.','kind: Ich liebe den Sommer!|I love summer!','Im Sommer kann es in Deutschland über dreißig Grad heiß werden.|In summer it can get hotter than thirty degrees in Germany.'],
 herbst:['der Herbst|autumn','die Herbste','Der Herbst: September, Oktober und November.|Autumn: September, October and November.','sie: Es wird kühler. Zieh eine Jacke an!|It’s getting cooler. Put on a jacket!','Ende Oktober stellt man die Uhr eine Stunde zurück. Dann ist Winterzeit.|At the end of October the clocks go back an hour.'],
 januar:['der Januar|January','','Der Januar ist der erste Monat. Er hat einunddreißig Tage.|January is the first month. It has thirty-one days.','sie: Frohes neues Jahr!|Happy New Year!','Im Januar ist es oft kalt, manchmal unter null Grad.|In January it is often cold, sometimes below zero.'],
 februar:['der Februar|February','','Der Februar ist der kürzeste Monat. Er hat achtundzwanzig Tage, im Schaltjahr neunundzwanzig.|February is the shortest month. It has 28 days, 29 in a leap year.','er: Helau! Alaaf! Im Februar ist oft Karneval.|Helau! Alaaf! Carnival is often in February.','Karneval, Fasching oder Fastnacht: Das Fest hat in jeder Region einen anderen Namen.|Carnival has a different name in each region.'],
 maerz:['der März|March','','Der März ist der dritte Monat. Im März beginnt der Frühling.|March is the third month. Spring starts in March.','sie: Endlich wird es wärmer!|At last it’s getting warmer!','Am letzten Sonntag im März stellt man die Uhr eine Stunde vor. Dann beginnt die Sommerzeit.|On the last Sunday in March the clocks go forward an hour.'],
 april:['der April|April','','Im April ist das Wetter oft wechselhaft: Sonne, Regen und manchmal Schnee.|In April the weather is changeable: sun, rain and sometimes snow.','er: April, April, der macht, was er will!|April, April, does whatever it wants!','Am ersten April macht man Witze. Dann ruft man: April, April!|On the first of April people play jokes and shout: April fool!'],
 mai:['der Mai|May','','Im Mai blühen viele Blumen und Bäume.|In May many flowers and trees blossom.','sie: Der erste Mai ist ein Feiertag. Wir haben frei!|The first of May is a holiday. We have the day off!','Der erste Mai ist der Tag der Arbeit. Viele Leute machen einen Ausflug.|The first of May is Labour Day. Many people go on an outing.'],
 juni:['der Juni|June','','Im Juni beginnt der Sommer. Die Tage sind sehr lang.|Summer starts in June. The days are very long.','kind: Es ist schon zehn Uhr abends und noch hell!|It’s already ten in the evening and still light!','Um den einundzwanzigsten Juni ist der längste Tag des Jahres.|Around the twenty-first of June is the longest day of the year.'],
 juli:['der Juli|July','','Im Juli ist es oft heiß. Viele Kinder haben Sommerferien.|In July it is often hot. Many children have summer holidays.','sie: Schöne Ferien!|Have a nice holiday!','Die Sommerferien sind in jedem Bundesland zu einer anderen Zeit.|Summer holidays are at a different time in each federal state.'],
 august:['der August|August','','Der August ist der achte Monat. Viele Leute machen Urlaub.|August is the eighth month. Many people go on holiday.','er: Wohin fahrt ihr in den Urlaub?|Where are you going on holiday?','Viele Deutsche fahren im Urlaub ans Meer, in die Berge oder nach Italien und Spanien.|Many Germans go to the sea, the mountains or to Italy and Spain on holiday.'],
 september:['der September|September','','Im September beginnt der Herbst. Die Schule fängt wieder an.|Autumn starts in September. School starts again.','sie: Viel Glück am ersten Schultag!|Good luck on your first day of school!','Am ersten Schultag bekommen Kinder in Deutschland eine Schultüte mit Süßigkeiten.|On their first school day children in Germany get a cone full of sweets.'],
 oktober:['der Oktober|October','','Im Oktober werden die Blätter bunt.|In October the leaves turn colourful.','er: Der dritte Oktober ist ein Feiertag.|The third of October is a public holiday.','Am dritten Oktober feiert Deutschland die Wiedervereinigung von neunzehnhundertneunzig.|On the third of October Germany celebrates reunification in 1990.'],
 november:['der November|November','','Der November ist oft grau, nass und neblig.|November is often grey, wet and foggy.','kind: Ich gehe mit meiner Laterne!|I’m going with my lantern!','Am elften November ist Sankt Martin. Kinder gehen mit Laternen durch die Straßen und singen.|On the eleventh of November it’s St Martin’s Day. Children walk with lanterns and sing.'],
 dezember:['der Dezember|December','','Der Dezember ist der letzte Monat. Er hat einunddreißig Tage.|December is the last month. It has thirty-one days.','sie: Frohe Weihnachten!|Merry Christmas!','Am vierundzwanzigsten Dezember ist Heiligabend. Dann gibt es Geschenke.|The twenty-fourth of December is Christmas Eve. That’s when there are presents.'],
 montag:['der Montag|Monday','die Montage','Der Montag ist der erste Tag der Woche.|Monday is the first day of the week.','er: Am Montag fängt die Arbeit wieder an.|On Monday work starts again.','am Montag heißt „an dem Montag“. Bei Tagen benutzt man immer „am“.|With days you always use "am".'],
 dienstag:['der Dienstag|Tuesday','die Dienstage','Der Dienstag ist der zweite Tag der Woche.|Tuesday is the second day of the week.','sie: Hast du am Dienstag Zeit?|Are you free on Tuesday?','dienstags heißt: jeden Dienstag. Ich habe dienstags Deutschkurs.|dienstags means every Tuesday.'],
 mittwoch:['der Mittwoch|Wednesday','die Mittwoche','Der Mittwoch ist in der Mitte der Woche.|Wednesday is in the middle of the week.','er: Mittwoch! Die halbe Woche ist geschafft.|Wednesday! Half the week is done.','Mittwoch kommt von „Mitte der Woche“.|Mittwoch comes from "middle of the week".'],
 donnerstag:['der Donnerstag|Thursday','die Donnerstage','Der Donnerstag ist der vierte Tag der Woche.|Thursday is the fourth day of the week.','sie: Am Donnerstag habe ich einen Termin beim Arzt.|On Thursday I have a doctor’s appointment.','Donnerstag kommt von Donar, dem alten Gott des Donners.|Thursday comes from Donar, the old god of thunder.'],
 freitag:['der Freitag|Friday','die Freitage','Am Freitag ist die Arbeitswoche fast vorbei.|On Friday the working week is almost over.','er: Endlich Freitag! Schönes Wochenende!|Finally Friday! Have a nice weekend!','Am Freitagabend gehen viele Leute aus: ins Kino, ins Restaurant oder zu Freunden.|On Friday evening many people go out.'],
 samstag:['der Samstag|Saturday','die Samstage','Am Samstag sind die Geschäfte offen.|On Saturday the shops are open.','sie: Am Samstag gehe ich einkaufen.|On Saturday I go shopping.','Im Norden sagt man oft Sonnabend, im Süden Samstag.|In the north people often say Sonnabend, in the south Samstag.'],
 sonntag:['der Sonntag|Sunday','die Sonntage','Am Sonntag haben die meisten Leute frei.|On Sunday most people have the day off.','er: Was machst du am Sonntag?|What are you doing on Sunday?','Am Sonntag sind fast alle Geschäfte zu. Bäckereien sind oft am Morgen offen.|On Sunday almost all shops are closed. Bakeries are often open in the morning.'],
 wochenende:['das Wochenende|the weekend','die Wochenenden','Samstag und Sonntag sind das Wochenende.|Saturday and Sunday are the weekend.','sie: Schönes Wochenende!|Have a nice weekend!','Am Freitag sagt man zum Abschied oft: Schönes Wochenende!|On Friday people often say goodbye with: Have a nice weekend!'],
 feiertag:['der Feiertag|the public holiday','die Feiertage','Der dritte Oktober ist ein Feiertag.|The third of October is a public holiday.','er: Morgen ist Feiertag. Ich muss nicht arbeiten!|Tomorrow is a holiday. I don’t have to work!','An Feiertagen sind die Geschäfte und Ämter geschlossen.|On public holidays shops and offices are closed.'],
 geburtstag:['der Geburtstag|the birthday','die Geburtstage','Der Kuchen ist für einen Geburtstag.|The cake is for a birthday.',['sie: Alles Gute zum Geburtstag!|Happy birthday!','er: Wann hast du Geburtstag?|When is your birthday? // sie: Am zwölften Mai.|On the twelfth of May.'],['Ordinalzahlen: am ersten, am zweiten, am dritten, am zwölften Mai.|Ordinal numbers for dates: on the first, second, third, twelfth of May.','In Deutschland gratuliert man nicht vor dem Geburtstag. Das bringt Unglück.|In Germany you don’t congratulate someone before their birthday. It brings bad luck.']],
 },
 groups:[['Finde die drei Wintermonate!|Find the three winter months!','dezember januar februar'],['Finde die drei Sommermonate!|Find the three summer months!','juni juli august'],['Finde die zwei Tage vom Wochenende!|Find the two weekend days!','samstag sonntag'],['Finde die drei Frühlingsmonate!|Find the three spring months!','maerz april mai'],['Finde die drei Herbstmonate!|Find the three autumn months!','september oktober november'],['Finde die drei Monate mit J!|Find the three months with J!','januar juni juli']],
 tf:[['Ein Jahr hat zwölf Monate.|A year has twelve months.',1,'jahr'],['Der Februar hat einunddreißig Tage.|February has thirty-one days.',0,'februar','Nein. Der Februar hat achtundzwanzig oder neunundzwanzig Tage.|No. February has twenty-eight or twenty-nine days.'],['Nach dem Dienstag kommt der Mittwoch.|After Tuesday comes Wednesday.',1,'mittwoch'],['Der Juli ist ein Wintermonat.|July is a winter month.',0,'juli','Nein. Der Juli ist ein Sommermonat.|No. July is a summer month.'],['Der dritte Oktober ist ein Feiertag in Deutschland.|The third of October is a public holiday in Germany.',1,'feiertag'],['Die Woche hat acht Tage.|The week has eight days.',0,'','Nein. Die Woche hat sieben Tage.|No. The week has seven days.'],['Der Frühling beginnt im März.|Spring starts in March.',1,'fruehling']],
 hoer:[['Dieser Monat kommt nach dem April und vor dem Juni.|This month comes after April and before June.','mai'],['An diesem Tag sagt man: Alles Gute! Es gibt Kuchen mit Kerzen.|On this day people say: All the best! There is cake with candles.','geburtstag'],['Diese Jahreszeit ist kalt. Oft liegt Schnee.|This season is cold. There is often snow.','winter'],['Das ist der erste Tag der Woche. Viele Leute fangen wieder an zu arbeiten.|This is the first day of the week. Many people start work again.','montag'],['In diesem Monat ist Weihnachten. Es ist der letzte Monat im Jahr.|Christmas is in this month. It is the last month of the year.','dezember'],['Dieser Tag ist zwischen Mittwoch und Freitag.|This day is between Wednesday and Friday.','donnerstag'],['In diesem Monat fängt die Schule wieder an, und der Herbst kommt.|In this month school starts again and autumn comes.','september']]},

{id:'fruehling',title:'Im Frühling',en:'In spring',focus:'Wetter · Natur · Ostern',
 story:['Im Frühling wird es wärmer. Die Tage werden länger.|In spring it gets warmer. The days get longer.','Die Bäume blühen, die Vögel bauen Nester, und im Garten wachsen Blumen.|The trees blossom, birds build nests and flowers grow in the garden.','Das Wetter wechselt oft: Sonne, Regen und manchmal ein Regenbogen.|The weather changes often: sun, rain and sometimes a rainbow.'],
 hs:{
 _bg:['der Garten|the garden','die Gärten','Im Garten wachsen Blumen, Obst und Gemüse.|Flowers, fruit and vegetables grow in the garden.','sie: Im Frühling arbeite ich gern im Garten.|In spring I like working in the garden.','In der Stadt mieten viele Leute einen kleinen Garten. Er heißt Schrebergarten.|In the city many people rent a small garden plot called a Schrebergarten.'],
 sonne:['die Sonne|the sun','','Die Sonne scheint schon wärmer.|The sun is already warmer.','er: Heute ist es schön warm. Endlich keine dicke Jacke mehr!|It’s nice and warm today. Finally no more thick jacket!','Im Frühling steht die Sonne jeden Tag ein bisschen höher.|In spring the sun climbs a little higher every day.'],
 regen:['der Regen|the rain','','Aus der Wolke kommt Regen.|Rain is coming out of the cloud.','er: Es regnet schon wieder! Gut, dass ich einen Regenschirm habe.|It’s raining again! Good thing I have an umbrella.','Beim Wetter benutzt man „es“: Es regnet, es schneit, es donnert.|For weather you use "es": it rains, it snows, it thunders.'],
 regenbogen:['der Regenbogen|the rainbow','die Regenbögen','Der Regenbogen hat sieben Farben.|The rainbow has seven colours.','kind: Schau mal, ein Regenbogen! Wie schön!|Look, a rainbow! How beautiful!','Einen Regenbogen sieht man, wenn die Sonne scheint und es gleichzeitig regnet.|You see a rainbow when the sun shines and it rains at the same time.'],
 baum:['der Kirschbaum|the cherry tree','die Kirschbäume','Der Kirschbaum blüht rosa und weiß.|The cherry tree blossoms pink and white.','sie: Riech mal! Die Blüten duften so gut.|Smell that! The blossoms smell so good.','Aus den Blüten werden im Sommer Kirschen.|In summer the blossoms turn into cherries.'],
 nest:['das Nest|the nest','die Nester','Im Nest liegen zwei blaue Eier.|There are two blue eggs in the nest.','kind: Bald schlüpfen die Vogelbabys!|Soon the baby birds will hatch!','Vögel bauen ihre Nester im Frühling aus kleinen Ästen und Gras.|Birds build their nests in spring from little twigs and grass.'],
 vogel:['der Vogel|the bird','die Vögel','Der Vogel fliegt zum Nest.|The bird flies to the nest.','kind: Hör mal, der Vogel singt!|Listen, the bird is singing!','Viele Vögel fliegen im Herbst in den Süden und kommen im Frühling zurück.|Many birds fly south in autumn and come back in spring.'],
 tulpen:['die Tulpe|the tulip','die Tulpen','Die Tulpen sind rot, gelb und lila.|The tulips are red, yellow and purple.','sie: Ich kaufe einen Strauß Tulpen für meine Mutter.|I’ll buy a bunch of tulips for my mother.','Tulpen sind typische Frühlingsblumen. Viele kommen aus den Niederlanden.|Tulips are typical spring flowers. Many come from the Netherlands.'],
 biene:['die Biene|the bee','die Bienen','Die Biene sammelt Nektar von den Blumen.|The bee collects nectar from the flowers.','kind: Hilfe, eine Biene!|Help, a bee! // sie: Keine Angst, sie tut dir nichts.|Don’t be afraid, it won’t hurt you.','Bienen machen Honig. Ohne Bienen gibt es auch weniger Obst.|Bees make honey. Without bees there is also less fruit.'],
 schmetterling:['der Schmetterling|the butterfly','die Schmetterlinge','Der Schmetterling hat bunte Flügel.|The butterfly has colourful wings.','kind: Der Schmetterling fliegt von Blume zu Blume.|The butterfly flies from flower to flower.','Ein Schmetterling war zuerst eine Raupe.|A butterfly was a caterpillar first.'],
 ostereier:['das Osterei|the Easter egg','die Ostereier','Die Ostereier sind bunt bemalt.|The Easter eggs are painted in bright colours.','kind: Ich habe drei Ostereier gefunden!|I’ve found three Easter eggs!','Zu Ostern bemalt man Eier und versteckt sie im Garten. Die Kinder suchen sie.|At Easter people paint eggs and hide them in the garden. The children look for them.'],
 osterhase:['der Osterhase|the Easter bunny','die Osterhasen','Der Osterhase bringt die Eier.|The Easter bunny brings the eggs.','sie: Frohe Ostern!|Happy Easter!','Ostern ist im März oder im April. Das Datum ist jedes Jahr anders.|Easter is in March or April. The date is different every year.'],
 nachbar:['der Nachbar|the neighbour','die Nachbarn','Der Nachbar steht im Regen.|The neighbour is standing in the rain.','er: Guten Morgen! Schönes Wetter heute, oder? Na ja, ein bisschen nass.|Good morning! Nice weather today, isn’t it? Well, a bit wet.','der Nachbar, die Nachbarin: die Person, die neben dir wohnt.|The person who lives next to you.'],
 regenschirm:['der Regenschirm|the umbrella','die Regenschirme','Der Regenschirm ist rot und offen.|The umbrella is red and open.','sie: Nimm einen Regenschirm mit! Im April weiß man nie.|Take an umbrella! In April you never know.','der Regen und der Schirm: der Regenschirm. Gegen die Sonne gibt es den Sonnenschirm.|rain + shade = umbrella. Against the sun there is the parasol.'],
 gummistiefel:['der Gummistiefel|the rubber boot','die Gummistiefel','Die Gummistiefel sind gelb.|The rubber boots are yellow.','kind: Juhu, Pfützen! Mit Gummistiefeln kann ich springen.|Yay, puddles! With rubber boots I can jump.','Für zwei Schuhe sagt man „ein Paar“: ein Paar Gummistiefel, ein Paar Socken.|For two shoes you say "a pair".'],
 oma:['die Oma|the grandma','die Omas','Die Oma gießt die Blumen.|Grandma is watering the flowers.','sie: Die Blumen haben Durst. Ich gieße sie jeden Morgen.|The flowers are thirsty. I water them every morning.','Die Oma heißt auch Großmutter. Der Opa heißt auch Großvater.|Oma is also called grandmother. Opa is grandfather.'],
 giesskanne:['die Gießkanne|the watering can','die Gießkannen','Die Gießkanne ist voll Wasser.|The watering can is full of water.','sie: Kannst du mir bitte die Gießkanne geben?|Can you please give me the watering can?','gießen und die Kanne: die Gießkanne. Mit der Gießkanne gießt man Blumen.|water + can = watering can.'],
 },
 groups:[['Finde vier Tiere!|Find four animals!','vogel biene schmetterling osterhase'],['Finde zwei Dinge für Ostern!|Find two things for Easter!','ostereier osterhase'],['Finde zwei Dinge für den Regen!|Find two things for the rain!','regenschirm gummistiefel'],['Finde drei Dinge zum Wetter!|Find three weather things!','sonne regen regenbogen'],['Finde zwei Personen!|Find two people!','nachbar oma']],
 tf:[['Im Frühling werden die Tage länger.|In spring the days get longer.',1,'sonne'],['Der Regenbogen hat drei Farben.|The rainbow has three colours.',0,'regenbogen','Nein. Der Regenbogen hat sieben Farben.|No. The rainbow has seven colours.'],['Ostern ist immer im Dezember.|Easter is always in December.',0,'osterhase','Nein. Ostern ist im März oder im April.|No. Easter is in March or April.'],['Bienen machen Honig.|Bees make honey.',1,'biene'],['Aus den Blüten werden im Sommer Kirschen.|The blossoms turn into cherries in summer.',1,'baum'],['Ein Schmetterling war zuerst ein Vogel.|A butterfly was a bird first.',0,'schmetterling','Nein. Ein Schmetterling war zuerst eine Raupe.|No. A butterfly was a caterpillar first.'],['Mit Gummistiefeln bleiben die Füße trocken.|With rubber boots your feet stay dry.',1,'gummistiefel']],
 hoer:[['Sie ist klein, gelb und schwarz. Sie fliegt von Blume zu Blume und macht Honig.|It is small, yellow and black. It flies from flower to flower and makes honey.','biene'],['Er hat lange Ohren und bringt zu Ostern die Eier.|He has long ears and brings the eggs at Easter.','osterhase'],['Man braucht ihn, wenn es regnet. Man hält ihn über den Kopf.|You need it when it rains. You hold it over your head.','regenschirm'],['Damit gießt man die Blumen im Garten.|You water the flowers in the garden with it.','giesskanne'],['Er hat sieben Farben. Man sieht ihn nach dem Regen am Himmel.|It has seven colours. You see it in the sky after the rain.','regenbogen'],['Darin liegen kleine blaue Eier. Ein Vogel hat es gebaut.|Small blue eggs lie in it. A bird built it.','nest']]},

{id:'sommer',title:'Im Sommer',en:'In summer',focus:'Temperatur · Freizeit · Imperativ',
 story:['Im Sommer ist es warm, oft sogar heiß.|In summer it is warm, often even hot.','Viele Leute gehen ins Freibad, essen Eis und liegen in der Sonne.|Many people go to the outdoor pool, eat ice cream and lie in the sun.','Aber Vorsicht: Am Nachmittag kommt manchmal ein Gewitter.|But be careful: in the afternoon a thunderstorm sometimes comes.'],
 hs:{
 _bg:['das Freibad|the outdoor pool','die Freibäder','Das Freibad ist im Sommer geöffnet.|The outdoor pool is open in summer.','er: Zwei Erwachsene und ein Kind, bitte.|Two adults and one child, please.','Ein Freibad ist draußen, ein Hallenbad ist drinnen.|An outdoor pool is outside, an indoor pool is inside.'],
 sonne:['die Sonne|the sun','','Die Sonne ist heute sehr stark.|The sun is very strong today.','sie: Bleib im Schatten! Die Sonne ist zu stark.|Stay in the shade! The sun is too strong.','Zwischen zwölf und drei Uhr ist die Sonne am stärksten.|Between twelve and three o’clock the sun is strongest.'],
 gewitter:['das Gewitter|the thunderstorm','die Gewitter','Dunkle Wolken, Blitz und Donner: Ein Gewitter kommt.|Dark clouds, lightning and thunder: a storm is coming.','er: Alle raus aus dem Wasser! Ein Gewitter kommt!|Everybody out of the water! A storm is coming!','Bei Gewitter muss man sofort aus dem Wasser gehen.|In a thunderstorm you must get out of the water at once.'],
 becken:['das Schwimmbecken|the swimming pool','die Schwimmbecken','Das Wasser im Becken ist blau und kühl.|The water in the pool is blue and cool.','kind: Das Wasser ist kalt! Aber super!|The water is cold! But great!','In Deutschland lernen Kinder oft in der Grundschule schwimmen.|In Germany children often learn to swim at primary school.'],
 sprungbrett:['das Sprungbrett|the diving board','die Sprungbretter','Vom Sprungbrett springt man ins Wasser.|You jump into the water from the diving board.','kind: Eins, zwei, drei … und los!|One, two, three … and go!','springen bildet das Perfekt mit „sein“: Ich bin ins Wasser gesprungen.|springen forms the perfect tense with "sein".'],
 bademeister:['der Bademeister|the lifeguard','die Bademeister','Der Bademeister passt auf alle auf.|The lifeguard watches everyone.','er: Bitte nicht vom Beckenrand springen!|Please don’t jump from the edge of the pool!','Der Bademeister hat eine Pfeife. Wenn er pfeift, muss man hören.|The lifeguard has a whistle. When he blows it, you must listen.'],
 sonnenschirm:['der Sonnenschirm|the parasol','die Sonnenschirme','Unter dem Sonnenschirm ist Schatten.|There is shade under the parasol.','sie: Komm unter den Sonnenschirm, hier ist es kühler.|Come under the parasol, it’s cooler here.','Komm unter den Schirm! Wohin? Akkusativ. Ich sitze unter dem Schirm. Wo? Dativ.|Come under the parasol (accusative). I sit under the parasol (dative).'],
 liegestuhl:['der Liegestuhl|the deckchair','die Liegestühle','Auf dem Liegestuhl kann man sich ausruhen.|You can rest on the deckchair.','er: Ah, jetzt erst mal ausruhen.|Ah, now first a little rest.','liegen und der Stuhl: der Liegestuhl.|lie + chair = deckchair.'],
 handtuch:['das Handtuch|the towel','die Handtücher','Das Handtuch liegt auf der Wiese.|The towel is lying on the grass.','sie: Vergiss dein Handtuch nicht!|Don’t forget your towel!','das Handtuch, die Handtücher: Aus u wird im Plural ü.|In the plural u becomes ü.'],
 sonnenbrille:['die Sonnenbrille|the sunglasses','die Sonnenbrillen','Die Sonnenbrille liegt auf dem Handtuch.|The sunglasses are lying on the towel.','kind: Wo ist meine Sonnenbrille?|Where are my sunglasses?','Achtung: „die Brille“ ist im Deutschen Singular. Auf Englisch sagt man „glasses“, im Plural.|Careful: "die Brille" is singular in German, "glasses" is plural in English.'],
 sonnencreme:['die Sonnencreme|the sun cream','','Die Sonnencreme schützt die Haut.|Sun cream protects the skin.','sie: Hast du dich schon eingecremt?|Have you put on sun cream yet?','Man soll sich alle zwei Stunden neu eincremen, besonders nach dem Schwimmen.|You should put on sun cream every two hours, especially after swimming.'],
 wassermelone:['die Wassermelone|the watermelon','die Wassermelonen','Die Wassermelone ist rot, süß und saftig.|The watermelon is red, sweet and juicy.','kind: Darf ich noch ein Stück Melone?|May I have another piece of melon?','Eine Wassermelone besteht zu über neunzig Prozent aus Wasser.|A watermelon is over ninety percent water.'],

 briefkaesten:['der Briefkasten|the letterbox','die Briefkästen','Jede Wohnung hat einen Briefkasten.|Every flat has a letterbox.','Die Briefkästen hängen im Hausflur an der Wand.|The letterboxes hang on the wall in the hallway.','Auf den Briefkasten und an die Klingel schreibt man seinen Namen. Sonst kommt keine Post an.|You write your name on the letterbox and the doorbell. Otherwise no post arrives.'],
